<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>777 CASINO SLOT</title>

<style>

body {
    margin: 0;
    background: radial-gradient(circle, #444, #050505);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: gold;
    font-size: 42px;
    text-shadow:
        0 0 10px red,
        0 0 25px gold;
}

.casino {
    width: 430px;
    max-width: 90%;
    margin: 30px auto;
    padding: 25px;

    background:
        linear-gradient(#c40000, #700000, #300000);

    border: 8px solid gold;
    border-radius: 25px;

    box-shadow:
        0 0 20px gold,
        0 0 40px red;
}

#coins {
    font-size: 28px;
    color: gold;
    font-weight: bold;
    margin-bottom: 10px;
}

#adminStatus {
    font-size: 15px;
    color: #aaa;
    margin: 10px;
}

.reels {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 25px 0;
}

.reel {
    width: 100px;
    height: 110px;

    background:
        linear-gradient(
            white,
            #eee,
            #ccc
        );

    color: black;

    border: 6px solid #aaa;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 55px;

    box-shadow:
        inset 0 0 15px #555;
}

button {
    padding: 14px 25px;
    margin: 7px;

    font-size: 20px;
    font-weight: bold;

    border-radius: 12px;
    border: 3px solid gold;

    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

#start {
    background:
        linear-gradient(#ff3333, #aa0000);

    color: white;

    font-size: 30px;

    padding: 18px 55px;

    box-shadow:
        0 0 15px red,
        0 0 30px orange;
}

#adminLogin {
    background: #222;
    color: gold;
}

#settingArea {
    display: none;

    margin: 15px 0;
    padding: 15px;

    border: 2px solid gold;
    border-radius: 10px;

    background: rgba(0,0,0,0.45);
}

#settingNumber {
    color: gold;
    font-size: 25px;
    font-weight: bold;
}

#settingButton {
    background: #222;
    color: gold;
}

#logoutButton {
    background: #555;
    color: white;
}

#result {
    font-size: 22px;
    min-height: 40px;
    margin-top: 15px;
    font-weight: bold;
}


/* =========================
   777 JACKPOT
========================= */

#jackpotEffect {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(255, 215, 0, 0.3);

    z-index: 9999;
    pointer-events: none;
}

#jackpotEffect.show {
    display: flex;

    align-items: center;
    justify-content: center;

    animation: flash 0.12s infinite alternate;
}

.jackpotText {
    font-size: 70px;
    font-weight: bold;

    color: gold;

    text-shadow:
        0 0 10px red,
        0 0 30px red,
        0 0 60px gold,
        0 0 100px white;

    animation:
        jackpotBig 0.35s infinite alternate;
}

@keyframes flash {

    from {
        background: rgba(255, 0, 0, 0.15);
    }

    to {
        background: rgba(255, 215, 0, 0.55);
    }

}

@keyframes jackpotBig {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.3);
    }

}

.jackpotReel {

    animation:
        reelFlash 0.15s infinite alternate;

}

@keyframes reelFlash {

    from {
        box-shadow:
            0 0 10px gold,
            inset 0 0 15px #555;
    }

    to {
        box-shadow:
            0 0 50px red,
            0 0 90px gold,
            inset 0 0 15px #555;
    }

}

@media (max-width: 500px) {

    h1 {
        font-size: 32px;
    }

    .reel {
        width: 80px;
        height: 90px;
        font-size: 45px;
    }

    .jackpotText {
        font-size: 45px;
    }

}

</style>
</head>


<body>

<h1>🎰 777 CASINO 🎰</h1>


<div class="casino">


    <div id="coins">
        💰 コイン：100
    </div>


    <div id="adminStatus">
        🔒 管理者モード：OFF
    </div>


    <button id="adminLogin">
        🔐 管理者ログイン
    </button>


    <div id="settingArea">

        <div>
            ⚙️ 現在の設定：
            <span id="settingNumber">-</span>
        </div>

        <br>

        <button id="settingButton">
            ⚙️ 設定変更
        </button>

        <button id="logoutButton">
            🔓 ログアウト
        </button>

    </div>


    <div class="reels">

        <div class="reel" id="reel1">7</div>

        <div class="reel" id="reel2">7</div>

        <div class="reel" id="reel3">7</div>

    </div>


    <button id="start">
        START
    </button>


    <div id="result">
        スタートを押してね！
    </div>


</div>


<div id="jackpotEffect">

    <div class="jackpotText">
        🎉 777 JACKPOT!! 🎉
    </div>

</div>


<script>


/* =========================
   図柄
========================= */

const symbols = [
    "🍒",
    "🍋",
    "🔔",
    "⭐",
    "🍊",
    "💎",
    "7"
];


/* =========================
   基本
========================= */

let coins = 100;

let isAdmin = false;


/* =========================
   パスワード
========================= */

const ADMIN_PASSWORD = "777admin";


/* =========================
   777確率
========================= */

const settingRates = {

    1: 0.0005,
    2: 0.0008,
    3: 0.0012,
    4: 0.0030,
    5: 0.0070,
    6: 0.0120

};


/* =========================
   3つ揃い確率
========================= */

const tripleRates = {

    1: 0.10,
    2: 0.12,
    3: 0.15,
    4: 0.20,
    5: 0.25,
    6: 0.30

};


/* =========================
   設定ランダム
========================= */

function randomSetting() {

    const r = Math.random() * 100;

    if (r < 50) {
        return 1;
    }

    else if (r < 74) {
        return 2;
    }

    else if (r < 89) {
        return 3;
    }

    else if (r < 96) {
        return 4;
    }

    else if (r < 99) {
        return 5;
    }

    else {
        return 6;
    }

}


/*
設定1 = 50%
設定2 = 24%
設定3 = 15%
設定4 = 7%
設定5 = 3%
設定6 = 1%
*/


/* =========================
   現在の設定
========================= */

let setting = randomSetting();


/* =========================
   HTML
========================= */

const coinsElement =
    document.getElementById("coins");

const settingArea =
    document.getElementById("settingArea");

const settingNumber =
    document.getElementById("settingNumber");

const result =
    document.getElementById("result");

const reel1 =
    document.getElementById("reel1");

const reel2 =
    document.getElementById("reel2");

const reel3 =
    document.getElementById("reel3");

const startButton =
    document.getElementById("start");

const adminLogin =
    document.getElementById("adminLogin");

const settingButton =
    document.getElementById("settingButton");

const logoutButton =
    document.getElementById("logoutButton");

const adminStatus =
    document.getElementById("adminStatus");

const jackpotEffect =
    document.getElementById("jackpotEffect");


/* =========================
   ランダム図柄
========================= */

function randomSymbol() {

    return symbols[
        Math.floor(
            Math.random() * symbols.length
        )
    ];

}


/* =========================
   管理者ログイン
========================= */

adminLogin.addEventListener(
    "click",
    function() {

        const password =
            prompt(
                "🔐 管理者パスワードを入力してください"
            );


        if (password === ADMIN_PASSWORD) {

            isAdmin = true;

            settingArea.style.display =
                "block";

            settingNumber.textContent =
                setting;

            adminStatus.textContent =
                "🔓 管理者モード：ON";

            adminStatus.style.color =
                "lime";

            adminLogin.style.display =
                "none";

            result.textContent =
                "✅ 管理者ログイン成功！";

        }

        else {

            result.textContent =
                "❌ パスワードが違います！";

        }

    }
);


/* =========================
   ログアウト
========================= */

logoutButton.addEventListener(
    "click",
    function() {

        isAdmin = false;

        settingArea.style.display =
            "none";

        adminLogin.style.display =
            "inline-block";

        adminStatus.textContent =
            "🔒 管理者モード：OFF";

        adminStatus.style.color =
            "#aaa";

        result.textContent =
            "🔒 管理者モードを終了しました";

    }
);


/* =========================
   設定変更
========================= */

settingButton.addEventListener(
    "click",
    function() {

        if (!isAdmin) {
            return;
        }

        setting++;

        if (setting > 6) {
            setting = 1;
        }

        settingNumber.textContent =
            setting;

        result.textContent =
            "⚙️ 設定" +
            setting +
            "に変更しました！";

    }
);


/* =========================
   スロット
========================= */

function play() {


    /* 3コイン必要 */

    if (coins < 3) {

        result.textContent =
            "💸 コインが足りません！";

        return;

    }


    /* 掛け金 */

    coins -= 3;


    let a;
    let b;
    let c;


    /* =====================
       777
    ===================== */

    const jackpot =
        Math.random()
        <
        settingRates[setting];


    if (jackpot) {

        a = "7";
        b = "7";
        c = "7";

    }


    /* =====================
       3つ揃い
    ===================== */

    else if (
        Math.random()
        <
        tripleRates[setting]
    ) {

        const nonSevenSymbols =
            symbols.slice(0, 6);

        const symbol =
            nonSevenSymbols[
                Math.floor(
                    Math.random()
                    *
                    nonSevenSymbols.length
                )
            ];

        a = symbol;
        b = symbol;
        c = symbol;

    }


    /* =====================
       通常
    ===================== */

    else {

        a = randomSymbol();
        b = randomSymbol();
        c = randomSymbol();

    }


    /* リール表示 */

    reel1.textContent = a;
    reel2.textContent = b;
    reel3.textContent = c;


    /* =====================
       777 JACKPOT
    ===================== */

    if (
        a === "7" &&
        b === "7" &&
        c === "7"
    ) {

        coins += 100;


        result.textContent =
            "🎉🎉 JACKPOT!! +100 🎉🎉";


        reel1.classList.add(
            "jackpotReel"
        );

        reel2.classList.add(
            "jackpotReel"
        );

        reel3.classList.add(
            "jackpotReel"
        );


        jackpotEffect.classList.add(
            "show"
        );


        setTimeout(
            function() {

                jackpotEffect.classList.remove(
                    "show"
                );

                reel1.classList.remove(
                    "jackpotReel"
                );

                reel2.classList.remove(
                    "jackpotReel"
                );

                reel3.classList.remove(
                    "jackpotReel"
                );

            },
            2500
        );

    }


    /* =====================
       3つ揃い
    ===================== */

    else if (
        a === b &&
        b === c
    ) {

        coins += 20;

        result.textContent =
            "🔥 3つ揃った！ +20";

    }


    /* =====================
       2つ揃い
       配当なし
    ===================== */

    else if (
        a === b ||
        b === c ||
        a === c
    ) {

        result.textContent =
            "💦 2つ揃い！ 配当なし";

    }


    /* =====================
       ハズレ
    ===================== */

    else {

        result.textContent =
            "💦 ハズレ！";

    }


    /* コイン更新 */

    coinsElement.textContent =
        "💰 コイン：" + coins;

}


/* =========================
   START
========================= */

startButton.addEventListener(
    "click",
    play
);


/* =========================
   1時間ごとに設定変更
========================= */

setInterval(
    function() {

        setting =
            randomSetting();


        if (isAdmin) {

            settingNumber.textContent =
                setting;

        }


        result.textContent =
            "🎲 設定が変更されました";

    },
    60 * 60 * 1000
);


</script>

</body>
</html>
