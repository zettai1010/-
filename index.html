<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASINO [Re]</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at center,#252525 0%,#101010 50%,#050505 100%);
  color:white;
  font-family:Arial,sans-serif;
}

button{cursor:pointer}
.hidden{display:none!important}

#loginScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:420px;
  max-width:100%;
  background:#151515;
  border:2px solid #555;
  border-radius:16px;
  padding:30px;
  box-shadow:0 0 30px rgba(0,0,0,.8);
  text-align:center;
}

.login-box h1{
  margin-top:0;
  font-size:38px;
  color:#ffd84d;
  text-shadow:0 0 15px #ffb300;
}

.login-box input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #555;
  background:#080808;
  color:white;
  font-size:16px;
}

.login-box button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#e5a900;
  color:#111;
  font-weight:bold;
  font-size:17px;
}

.login-box button:hover{background:#ffc928}

#loginMessage{
  margin-top:15px;
  color:#ff7777;
}

#hubScreen{
  min-height:100vh;
  padding:25px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.header h1{
  margin:0;
  color:#ffd84d;
  text-shadow:0 0 15px #ffb300;
}

.coin-display{
  font-size:20px;
  font-weight:bold;
  background:#161616;
  border:1px solid #555;
  border-radius:10px;
  padding:10px 18px;
}

.logout-btn{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  background:#444;
  color:white;
}

.games{
  max-width:1100px;
  margin:40px auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.game-card{
  background:#151515;
  border:2px solid #555;
  border-radius:16px;
  padding:25px;
  text-align:center;
  box-shadow:0 0 20px rgba(0,0,0,.5);
}

.game-card h2{color:#ffd84d}

.game-card button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#e5a900;
  color:#111;
  font-weight:bold;
  font-size:17px;
}

.coin-panel,
.admin-panel{
  max-width:700px;
  margin:25px auto;
  padding:22px;
  background:#151515;
  border:1px solid #555;
  border-radius:14px;
}

.coin-panel h2,
.admin-panel h2{
  margin-top:0;
  color:#ffd84d;
}

.coin-panel input,
.admin-panel input{
  width:100%;
  padding:13px;
  margin:8px 0;
  background:#080808;
  color:white;
  border:1px solid #555;
  border-radius:8px;
}

.coin-panel button,
.admin-panel button{
  padding:12px 18px;
  border:0;
  border-radius:8px;
  background:#e5a900;
  color:#111;
  font-weight:bold;
}

.request-result{
  margin-top:15px;
  padding:12px;
  background:#080808;
  border-radius:8px;
  word-break:break-all;
}

#gameScreen{
  min-height:100vh;
  padding:20px;
}

.game-wrap{
  max-width:900px;
  margin:auto;
}

.game-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.game-top h1{
  color:#ffd84d;
  text-shadow:0 0 15px #ffb300;
}

.back-btn{
  padding:10px 18px;
  background:#444;
  color:white;
  border:0;
  border-radius:8px;
}

.status-bar{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  margin:15px 0;
}

.status-item{
  background:#151515;
  border:1px solid #555;
  border-radius:8px;
  padding:10px 18px;
}

.reel-machine{
  margin:20px auto;
  max-width:760px;
  padding:30px;
  background:linear-gradient(145deg,#292929,#101010);
  border:8px solid #555;
  border-radius:18px;
  box-shadow:inset 0 0 20px #000,0 0 25px rgba(0,0,0,.8);
}

.reels{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.reel{
  height:150px;
  background:#f5f5f5;
  color:#111;
  border:5px solid #888;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:55px;
  font-weight:bold;
  box-shadow:inset 0 0 15px rgba(0,0,0,.5);
}

.game-message{
  min-height:50px;
  margin:20px auto;
  max-width:760px;
  padding:14px;
  border-radius:10px;
  background:#111;
  border:1px solid #555;
  text-align:center;
  font-size:20px;
}

.state-box{
  max-width:760px;
  margin:15px auto;
  text-align:center;
  font-weight:bold;
  font-size:22px;
  color:#ffd84d;
}

.play-btn{
  display:block;
  width:100%;
  max-width:760px;
  margin:20px auto;
  padding:18px;
  font-size:24px;
  font-weight:bold;
  border:0;
  border-radius:12px;
  background:#e5a900;
  color:#111;
  box-shadow:0 0 20px rgba(229,169,0,.3);
}

.play-btn:hover{background:#ffc928}

.play-btn:disabled{
  background:#555;
  color:#aaa;
  cursor:not-allowed;
}

.replay-panel{
  max-width:760px;
  margin:15px auto;
  padding:15px;
  text-align:center;
  border:2px solid #36a8ff;
  border-radius:12px;
  background:#08131d;
}

.replay-title{
  font-size:28px;
  color:#49b5ff;
  font-weight:bold;
}

.replay-info{
  margin-top:5px;
  font-size:18px;
}

.absolute-panel{
  max-width:760px;
  margin:15px auto;
  padding:20px;
  text-align:center;
  border:2px solid #ff3030;
  border-radius:12px;
  background:#1a0505;
}

.absolute-title{
  color:#ff4040;
  font-size:30px;
  font-weight:bold;
}

.history{
  max-width:760px;
  margin:25px auto;
  background:#101010;
  border:1px solid #444;
  border-radius:10px;
  padding:15px;
}

.history h3{margin-top:0}

.history-list{
  max-height:220px;
  overflow-y:auto;
}

.history-item{
  padding:7px;
  border-bottom:1px solid #333;
  font-size:14px;
}

#effectOverlay{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,#fff 0%,#ffd84d 20%,#ff5a00 45%,#000 80%);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s;
}

#effectOverlay.show{opacity:1}

.effect-text{
  font-size:70px;
  font-weight:bold;
  color:white;
  text-shadow:0 0 10px #fff,0 0 30px #ff0,0 0 60px #f00;
}

@media(max-width:600px){
  .reel{
    height:110px;
    font-size:40px;
  }

  .reel-machine{padding:15px}

  .effect-text{font-size:45px}

  .login-box{padding:20px}
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="login-box">

    <h1>CASINO [Re]</h1>

    <input
      id="loginId"
      type="text"
      placeholder="ID"
      maxlength="20"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="パスワード"
    >

    <button onclick="loginUser()">
      ログイン
    </button>

    <button onclick="registerUser()">
      新規登録
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- HUB -->

<div id="hubScreen" class="hidden">

  <div class="header">

    <h1>CASINO [Re]</h1>

    <div class="coin-display">

    </div>

    <button
      class="logout-btn"

  <div class="games">

<!-- GAME -->

<div id="gameScreen" class="hidden">

  <div class="game-wrap">

        🪙 COINS:

    <div

    </button>


    <div class="history">

      <div

  </div>

</div>


<!-- EFFECT -->

<div id="effectOverlay">

  <div
    id="effectText"
    class="effect-text"
  >
    BONUS!!
  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://yazkexvgmdyjeeimmayq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_87rSIEju76172IK7boCx_g_y_2qPHpe";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:false,
        autoRefreshToken:false,
        detectSessionInUrl:false
      }
    }
  );


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;
let medals = 0;
let isAdmin = false;
let saveQueue = Promise.resolve();

const BET = 3;


/* =====================================================
   SETTINGS
   ※ 画面には表示しない
===================================================== */

const CURRENT_SETTING = 1;

const BONUS_PROBABILITY = {

  1:1 / 280,
  2:1 / 265,
  3:1 / 250,
  4:1 / 235,
  5:1 / 210,
  6:1 / 190,
  7:1 / 170

};


/* =====================================================
   GAME STATE
===================================================== */

let state = "normal";

let bonusName = "";

let bonusRemaining = 0;

let replayRemaining = 0;

let absoluteRemaining = 0;


/* =====================================================
   BONUS TYPES
===================================================== */

const BONUS_TYPES = [

  {
    name:"レギュラー",
    rounds:5,
    payout:10,
    weight:39.5
  },

  {
    name:"BIG",
    rounds:10,
    payout:10,
    weight:25
  },

  {
    name:"RBIG",
    rounds:15,
    payout:10,
    weight:15
  },

  {
    name:"LBIG",
    rounds:20,
    payout:10,
    weight:10
  }

];


/* =====================================================
   ID
===================================================== */

function idToEmail(id){

  return id.toLowerCase() +
    "@casino-re.local";

}


function validId(id){

  return /^[a-zA-Z0-9_-]{3,20}$/.test(id);

}


/* =====================================================
   PROFILE
===================================================== */

async function ensureProfile(){

  if(!currentUser) return;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("id,coins,is_admin")
      .eq("id",currentUser.id)
      .maybeSingle();


  if(error){

    console.error(error);

    return;

  }


  if(!data){

    const {
      error:insertError
    } =
      await supabaseClient
        .from("profiles")
        .insert({
          id:currentUser.id,
          coins:1000,
          is_admin:false
        });


    if(insertError){

      console.error(insertError);

    }


    medals = 1000;

    isAdmin = false;

    return;

  }


  medals =
    Number(data.coins || 0);

  isAdmin =
    data.is_admin === true;

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

  if(!currentUser) return;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("coins,is_admin")
      .eq("id",currentUser.id)
      .single();


  if(error){

    console.error(error);

    return;

  }


  medals =
    Number(data.coins || 0);

  isAdmin =
    data.is_admin === true;


  updateCoinDisplays();

}


/* =====================================================
   SAVE COINS
===================================================== */

function saveCoins(){

  if(!currentUser) return;


  const value =
    Number(medals);


  saveQueue =
    saveQueue.then(async()=>{

      const {
        error
      } =
        await supabaseClient
          .from("profiles")
          .update({
            coins:value
          })
          .eq("id",currentUser.id);


      if(error){

        console.error(
          "コイン保存エラー:",
          error
        );

      }

    });

}


/* =====================================================
   COIN DISPLAY
===================================================== */

function updateCoinDisplays(){

  const hubCoins =
    document.getElementById("hubCoins");

  const gameCoins =
    document.getElementById("gameCoins");


  if(hubCoins){

    hubCoins.textContent =
      medals.toLocaleString();

  }


  if(gameCoins){

    gameCoins.textContent =
      medals.toLocaleString();

  }


  updatePlayButton();

}


/* =====================================================
   LOGIN
===================================================== */

async function loginUser(){

  const id =
    document.getElementById("loginId")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");


  if(!validId(id)){

    message.textContent =
      "IDは3～20文字で入力してください";

    return;

  }


  if(!password){

    message.textContent =
      "パスワードを入力してください";

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({

        email:idToEmail(id),

        password:password

      });


  if(error){

    message.textContent =
      "ログインできません：" +
      error.message;

    return;

  }


  currentUser =
    data.user;


  await ensureProfile();

  await loadProfile();

  showHub();

}


/* =====================================================
   REGISTER
===================================================== */

async function registerUser(){

  const id =
    document.getElementById("loginId")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");


  if(!validId(id)){

    message.textContent =
      "IDは3～20文字で入力してください";

    return;

  }


  if(password.length < 6){

    message.textContent =
      "パスワードは6文字以上にしてください";

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signUp({

        email:idToEmail(id),

        password:password

      });


  if(error){

    message.textContent =
      "登録エラー：" +
      error.message;

    return;

  }


  if(data.user){

    currentUser =
      data.user;

    await ensureProfile();

    await loadProfile();

    showHub();

  }else{

    message.textContent =
      "登録しました。ログインしてください。";

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logoutUser(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  medals = 0;

  isAdmin = false;


  document
    .getElementById("hubScreen")
    .classList.add("hidden");


  document
    .getElementById("gameScreen")
    .classList.add("hidden");


  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

}


/* =====================================================
   SHOW HUB
===================================================== */

function showHub(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");


  document
    .getElementById("gameScreen")
    .classList.add("hidden");


  document
    .getElementById("hubScreen")
    .classList.remove("hidden");


  updateCoinDisplays();


  const adminPanel =
    document.getElementById("adminPanel");


  if(isAdmin){

    adminPanel.classList.remove("hidden");

  }else{

    adminPanel.classList.add("hidden");

  }

}


/* =====================================================
   OPEN GAME
===================================================== */

function openGame(){

  resetGameState();


  document
    .getElementById("hubScreen")
    .classList.add("hidden");


  document
    .getElementById("gameScreen")
    .classList.remove("hidden");


  updateCoinDisplays();

}


/* =====================================================
   BACK HUB
===================================================== */

function backToHub(){

  resetGameState();


  document
    .getElementById("gameScreen")
    .classList.add("hidden");


  document
    .getElementById("hubScreen")
    .classList.remove("hidden");


  updateCoinDisplays();

}


/* =====================================================
   CREATE COIN REQUEST
===================================================== */

async function createCoinRequest(){

  const input =
    document.getElementById("requestAmount");

  const result =
    document.getElementById("requestResult");

  const amount =
    Number(input.value);


  if(
    !Number.isInteger(amount) ||
    amount <= 0 ||
    amount > 1000000
  ){

    result.classList.remove("hidden");

    result.textContent =
      "1～1,000,000の整数を入力してください";

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .rpc(
        "create_coin_request",
        {
          amount_input:amount
        }
      );


  result.classList.remove("hidden");


  if(error){

    result.textContent =
      "申請エラー：" +
      error.message;

    console.error(error);

    return;

  }


  result.innerHTML =
    "申請コード：<strong>" +
    data +
    "</strong><br>" +
    "管理者にこのコードを伝えてください。";

}


/* =====================================================
   APPROVE REQUEST
===================================================== */

async function approveCoinRequest(){

  const input =
    document.getElementById(
      "requestCodeInput"
    );

  const result =
    document.getElementById(
      "adminResult"
    );

  const code =
    input.value.trim();


  if(!code){

    result.classList.remove("hidden");

    result.textContent =
      "申請コードを入力してください";

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .rpc(
        "approve_coin_request",
        {
          request_code_input:code
        }
      );


  result.classList.remove("hidden");


  if(error){

    result.textContent =
      "承認エラー：" +
      error.message;

    return;

  }


  result.textContent =
    "承認しました。新しい残高：" +
    Number(data).toLocaleString();

}


/* =====================================================
   PLAY GAME
===================================================== */

async function playGame(){

  if(state === "normal"){

    await normalGame();

    return;

  }


  if(state === "bonus"){

    await bonusGame();

    return;

  }


  if(state === "replay"){

    await replayGame();

    return;

  }


  if(state === "absolute"){

    await absoluteGame();

    return;

  }

}


/* =====================================================
   NORMAL GAME
===================================================== */

async function normalGame(){

  if(medals < BET){

    setMessage(
      "コインが足りません"
    );

    return;

  }


  medals -= BET;

  updateCoinDisplays();

  saveCoins();


  const bonusChance =
    BONUS_PROBABILITY[
      CURRENT_SETTING
    ];


  const bonusRoll =
    Math.random();


  if(bonusRoll < bonusChance){

    const result =
      drawBonus();


    if(result.type === "bonus"){

      showBonusEffect();

      startBonus(
        result.bonus
      );

      return;

    }


    if(result.type === "absolute"){

      startAbsolute();

      return;

    }

  }


  updateReels();

  setMessage("ハズレ");

  addHistory("ハズレ");

}


/* =====================================================
   REELS
===================================================== */

function updateReels(){

  const symbols = [
    "7",
    "BAR",
    "🍒",
    "🔔",
    "🍋",
    "★"
  ];


  document.getElementById("reel1")
    .textContent =
      symbols[
        Math.floor(
          Math.random() *
          symbols.length
        )
      ];


  document.getElementById("reel2")
    .textContent =
      symbols[
        Math.floor(
          Math.random() *
          symbols.length
        )
      ];


  document.getElementById("reel3")
    .textContent =
      symbols[
        Math.floor(
          Math.random() *
          symbols.length
        )
      ];

}


/* =====================================================
   DRAW BONUS
===================================================== */

function drawBonus(){

  const roll =
    Math.random() * 100;

  let total = 0;


  for(
    const bonus
    of BONUS_TYPES
  ){

    total += bonus.weight;


    if(roll < total){

      return {
        type:"bonus",
        bonus:bonus
      };

    }

  }


  if(roll < 99.5){

    return {
      type:"none"
    };

  }


  return {
    type:"absolute"
  };

}


/* =====================================================
   START BONUS
===================================================== */

function startBonus(bonus){

  state = "bonus";

  bonusName =
    bonus.name;

  bonusRemaining =
    bonus.rounds;


  document
    .getElementById("replayPanel")
    .classList.add("hidden");


  setState(
    "BONUS",
    bonus.name
  );


  setMessage(
    "🎉 " +
    bonus.name +
    " START!"
  );


  addHistory(
    bonus.name +
    " START"
  );


  updatePlayButton();

}


/* =====================================================
   BONUS GAME
===================================================== */

async function bonusGame(){

  if(bonusRemaining <= 0){

    finishBonus();

    return;

  }


  bonusRemaining--;

  medals += 10;


  updateCoinDisplays();

  saveCoins();


  setMessage(
    bonusName +
    " +10コイン"
  );


  addHistory(
    bonusName +
    " +10"
  );


  if(bonusRemaining <= 0){

    finishBonus();

    return;

  }


  updatePlayButton();

}


/* =====================================================
   FINISH BONUS
===================================================== */

function finishBonus(){

  state = "replay";

  bonusName = "";

  bonusRemaining = 0;

  replayRemaining = 30;


  document
    .getElementById("replayPanel")
    .classList.remove("hidden");


  updateReplayInfo();


  setState(
    "REPLAY",
    "BONUS後REPLAY"
  );


  setMessage(
    "BONUS終了！REPLAY 30G開始"
  );


  addHistory(
    "REPLAY 30G START"
  );


  updatePlayButton();

}


/* =====================================================
   REPLAY
   ★ ここではコインを使わない
===================================================== */

async function replayGame(){

  if(replayRemaining <= 0){

    finishReplay();

    return;

  }


  replayRemaining--;


  const bonusChance =
    BONUS_PROBABILITY[
      CURRENT_SETTING
    ];


  const bonusRoll =
    Math.random();


  if(bonusRoll < bonusChance){

    const result =
      drawBonus();


    if(result.type === "bonus"){

      showBonusEffect();

      startBonus(
        result.bonus
      );

      return;

    }


    if(result.type === "absolute"){

      startAbsoluteFromReplay();

      return;

    }

  }


  updateReels();

  setMessage("REPLAY");

  addHistory("REPLAY");

  updateReplayInfo();


  if(replayRemaining <= 0){

    finishReplay();

    return;

  }


  setState(
    "REPLAY",
    "REPLAY中"
  );


  updatePlayButton();

}


/* =====================================================
   REPLAY INFO
===================================================== */

function updateReplayInfo(){

  document
    .getElementById("replayInfo")
    .textContent =
      "残り " +
      replayRemaining +
      "G";

}


/* =====================================================
   FINISH REPLAY
===================================================== */

function finishReplay(){

  state = "normal";

  replayRemaining = 0;


  document
    .getElementById("replayPanel")
    .classList.add("hidden");


  setState(
    "NORMAL",
    "通常状態"
  );


  setMessage(
    "REPLAY終了"
  );


  addHistory(
    "REPLAY END"
  );


  updatePlayButton();

}


/* =====================================================
   ABSOLUTE
===================================================== */

function startAbsolute(){

  state = "absolute";

  absoluteRemaining = 10;


  document
    .getElementById("absolutePanel")
    .classList.remove("hidden");


  document
    .getElementById("replayPanel")
    .classList.add("hidden");


  setState(
    "ABSOLUTE",
    "SPECIAL"
  );


  setMessage(
    "⚡ ABSOLUTE TERRITORY"
  );


  updateAbsoluteInfo();

  updatePlayButton();

}


function startAbsoluteFromReplay(){

  startAbsolute();

}


/* =====================================================
   ABSOLUTE GAME
===================================================== */

async function absoluteGame(){

  if(absoluteRemaining <= 0){

    finishAbsolute();

    return;

  }


  absoluteRemaining--;

  updateReels();

  setMessage(
    "ABSOLUTE TERRITORY"
  );

  addHistory(
    "ABSOLUTE"
  );

  updateAbsoluteInfo();


  if(absoluteRemaining <= 0){

    finishAbsolute();

    return;

  }


  updatePlayButton();

}

   ABSOLUTE INFO
===================================================== */

function updateAbsoluteInfo(){

    .getElementById("absoluteInfo")
    .textContent =

      "G";

}


/* =====================================================
   FINISH ABSOLUTE
===================================================== */

function finishAbsolute(){

  absoluteRemaining = 0;


  document
    .getElementById("absolutePanel")
    .classList.add("hidden");

/* =====================================================
   STATE
===================================================== */

function setState(title,message){

  document
    .getElementById("stateBox")
    .textContent =
      title;

}


/* =====================================================
   MESSAGE
===================================================== */

function setMessage(message){

  document
    .getElementById("gameMessage")
    .textContent =
      message;

}


/* =====================================================
   PLAY BUTTON
===================================================== */

function updatePlayButton(){

  const button =
    document.getElementById(
      "playButton"
    );


  if(!button) return;


  if(state === "normal"){

    button.textContent =
      "START";

    button.disabled =
      medals < BET;

    return;

  }


  if(state === "bonus"){

    button.textContent =
      "BONUS";

    button.disabled =
      false;

    return;

  }


  if(state === "replay"){

    button.textContent =
      "REPLAY";

    // ★ REPLAYは無料
    button.disabled =
      false;

    return;

  }


  if(state === "absolute"){

    button.textContent =
      "ABSOLUTE";

    button.disabled =
      false;

  }

}


/* =====================================================
   HISTORY
===================================================== */

function addHistory(text){

  const list =
    document.getElementById(
      "historyList"
    );


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "history-item";


  const time =
    new Date()
      .toLocaleTimeString();


  item.textContent =
    time +
    " - " +
    text;


  list.prepend(item);

}


/* =====================================================
   BONUS EFFECT
===================================================== */

function showBonusEffect(){

  const overlay =
    document.getElementById(
      "effectOverlay"
    );

  const text =
    document.getElementById(
      "effectText"
    );


  text.textContent =
    "BONUS!!";


  overlay.classList.add(
    "show"
  );


  setTimeout(()=>{

    overlay.classList.remove(
      "show"
    );

  },700);

}


/* =====================================================
   RESET
===================================================== */

function resetGameState(){

  state = "normal";

  bonusName = "";

  bonusRemaining = 0;

  replayRemaining = 0;

  absoluteRemaining = 0;


  document
    .getElementById("replayPanel")
    .classList.add("hidden");


  document
    .getElementById("absolutePanel")
    .classList.add("hidden");


  setState(
    "NORMAL",
    "通常状態"
  );


  setMessage(
    "STARTを押してください"
  );


  updatePlayButton();

}
