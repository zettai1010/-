<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOGO! SLOT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #303030 0%, #111 45%, #050505 100%);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  margin: 25px 0 5px;
  font-size: 42px;
  color: #ffd700;
  text-shadow:
    0 0 5px #ff0,
    0 0 15px #ff9800,
    0 0 30px #ff4500;
}

.machine {
  width: 650px;
  max-width: 95%;
  margin: 20px auto;
  padding: 25px;
  border: 8px solid #777;
  border-radius: 25px;
  background: linear-gradient(#333, #111);
  box-shadow:
    0 0 20px #000,
    inset 0 0 25px #000;
}

.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  font-size: 20px;
}

.coins {
  color: #ffd700;
  font-weight: bold;
}

.gogo-area {
  margin: 10px auto 25px;
}

.gogo {
  display: inline-block;
  padding: 12px 28px;
  border-radius: 50px;
  background: #111;
  border: 4px solid #555;
  color: #444;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 4px;
  box-shadow: inset 0 0 15px #000;
}

.gogo.on {
  color: white;
  background: #00a000;
  border-color: #55ff55;
  box-shadow:
    0 0 10px #0f0,
    0 0 25px #0f0,
    0 0 50px #0f0,
    inset 0 0 15px #fff;
  animation: gogoFlash 0.45s infinite alternate;
}

@keyframes gogoFlash {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.08);
  }
}

.reels {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}

.reel-box {
  width: 170px;
}

.reel {
  height: 155px;
  background: linear-gradient(#eee, #ccc);
  border: 7px solid #555;
  border-radius: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  box-shadow:
    inset 0 0 15px #000,
    0 0 10px #000;
}

.symbol {
  font-size: 78px;
  line-height: 1;
  user-select: none;
}

.reel.spinning .symbol {
  animation: shake 0.07s infinite linear;
}

@keyframes shake {
  0% {
    transform: translateY(-7px);
  }
  50% {
    transform: translateY(7px);
  }
  100% {
    transform: translateY(-7px);
  }
}

.stop-btn {
  width: 100%;
  margin-top: 12px;
  padding: 15px 5px;
  border: 4px solid #8b0000;
  border-radius: 12px;
  background: linear-gradient(#ff4444, #a00000);
  color: white;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 0 #500000;
}

.stop-btn:hover {
  filter: brightness(1.2);
}

.stop-btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #500000;
}

.stop-btn:disabled {
  background: #444;
  border-color: #333;
  color: #777;
  cursor: default;
  box-shadow: 0 3px 0 #222;
}

.start-btn {
  width: 300px;
  max-width: 90%;
  margin-top: 25px;
  padding: 18px;
  border: 5px solid #ffd700;
  border-radius: 15px;
  background: linear-gradient(#ffdf00, #d89000);
  color: #111;
  font-size: 30px;
  font-weight: bold;
  cursor: pointer;
  box-shadow:
    0 6px 0 #805000,
    0 0 20px #ffb300;
}

.start-btn:hover {
  filter: brightness(1.15);
}

.start-btn:active {
  transform: translateY(5px);
  box-shadow: 0 1px 0 #805000;
}

.start-btn:disabled {
  background: #555;
  border-color: #444;
  color: #888;
  cursor: default;
  box-shadow: 0 3px 0 #222;
}

.result {
  min-height: 40px;
  margin-top: 22px;
  font-size: 25px;
  font-weight: bold;
}

.admin-login {
  margin-top: 25px;
}

.admin-login input {
  width: 180px;
  padding: 10px;
  border-radius: 8px;
  border: 2px solid #555;
  background: #222;
  color: white;
  font-size: 16px;
}

.admin-login button {
  padding: 10px 15px;
  margin-left: 5px;
  border: none;
  border-radius: 8px;
  background: #555;
  color: white;
  cursor: pointer;
}

.admin-area {
  display: none;
  margin-top: 20px;
  padding: 15px;
  border: 2px solid #777;
  border-radius: 12px;
  background: #222;
}

.admin-area button {
  margin: 5px;
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.change-setting {
  background: #ff9800;
}

.logout {
  background: #777;
  color: white;
}

.setting-number {
  color: #ffd700;
  font-size: 25px;
  font-weight: bold;
}

.jackpot {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: rgba(0,0,0,0.94);
}

.jackpot.show {
  display: flex;
  animation: jackpotBg 0.2s infinite alternate;
}

@keyframes jackpotBg {
  from {
    background: rgba(0,0,0,0.94);
  }
  to {
    background: rgba(100,0,0,0.94);
  }
}

.jackpot-title {
  font-size: 75px;
  font-weight: bold;
  color: #ffd700;
  text-shadow:
    0 0 10px #fff,
    0 0 25px #ff0,
    0 0 50px #f00;
  animation: jackpotText 0.25s infinite alternate;
}

@keyframes jackpotText {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.15) rotate(-2deg);
  }
}

.jackpot-seven {
  font-size: 130px;
  margin-top: 20px;
}

@media (max-width: 600px) {
  .machine {
    padding: 12px;
  }

  .reels {
    gap: 6px;
  }

  .reel-box {
    width: 31%;
  }

  .reel {
    height: 120px;
  }

  .symbol {
    font-size: 55px;
  }

  .stop-btn {
    font-size: 17px;
    padding: 12px 3px;
  }

  h1 {
    font-size: 32px;
  }
}
</style>
</head>

<body>

<h1>🎰 GOGO! SLOT 🎰</h1>

<div class="machine">

  <div class="info">
    <div>💰 コイン</div>
    <div class="coins" id="coins">100</div>
  </div>

  <div class="gogo-area">
    <div id="gogo" class="gogo">GOGO! CHANCE</div>
  </div>

  <div class="reels">

    <div class="reel-box">
      <div class="reel" id="reel0">
        <div class="symbol" id="symbol0">🍒</div>
      </div>
      <button class="stop-btn" id="stop0" onclick="stopReel(0)" disabled>
        STOP
      </button>
    </div>

    <div class="reel-box">
      <div class="reel" id="reel1">
        <div class="symbol" id="symbol1">🍋</div>
      </div>
      <button class="stop-btn" id="stop1" onclick="stopReel(1)" disabled>
        STOP
      </button>
    </div>

    <div class="reel-box">
      <div class="reel" id="reel2">
        <div class="symbol" id="symbol2">🔔</div>
      </div>
      <button class="stop-btn" id="stop2" onclick="stopReel(2)" disabled>
        STOP
      </button>
    </div>

  </div>

  <button class="start-btn" id="startBtn" onclick="startGame()">
    START
  </button>

  <div class="result" id="result">
    STARTを押してね！
  </div>

  <div class="admin-login">
    <input
      type="password"
      id="adminPassword"
      placeholder="管理者パスワード"
    >
    <button onclick="adminLogin()">管理者ログイン</button>
  </div>

  <div class="admin-area" id="adminArea">

    <div>
      現在の設定：
      <span class="setting-number" id="settingNumber"></span>
    </div>

    <button class="change-setting" onclick="changeSetting()">
      設定変更
    </button>

    <button class="logout" onclick="adminLogout()">
      ログアウト
    </button>

  </div>

</div>

<div class="jackpot" id="jackpot">
  <div class="jackpot-title">🎉 JACKPOT! 🎉</div>
  <div class="jackpot-seven">7️⃣7️⃣7️⃣</div>
</div>

<script>

const symbols = [
  "🍒",
  "🍋",
  "🔔",
  "⭐",
  "🍊",
  "💎",
  "7"
];

let coins = 100;

let setting = randomSetting();

let isAdmin = false;

let spinning = false;

let stopped = [false, false, false];

let spinTimers = [null, null, null];

let reelValues = ["🍒", "🍋", "🔔"];

/*
  設定
  1 = 50%
  2 = 24%
  3 = 15%
  4 = 7%
  5 = 3%
  6 = 1%
*/

function randomSetting() {

  const r = Math.random() * 100;

  if (r < 50) return 1;
  if (r < 74) return 2;
  if (r < 89) return 3;
  if (r < 96) return 4;
  if (r < 99) return 5;

  return 6;
}

/*
  設定ごとの当たりやすさ。
  目押し版なので、リール上の図柄の出現割合にも反映。
*/

const settingWeights = {

  1: {
    seven: 1,
    common: 8
  },

  2: {
    seven: 1.3,
    common: 10
  },

  3: {
    seven: 1.8,
    common: 12
  },

  4: {
    seven: 3,
    common: 16
  },

  5: {
    seven: 5,
    common: 20
  },

  6: {
    seven: 8,
    common: 25
  }

};

/*
  設定に応じたリール図柄を作る
*/

function createReelStrip() {

  const data = settingWeights[setting];

  let strip = [];

  const commonSymbols = [
    "🍒",
    "🍋",
    "🔔",
    "⭐",
    "🍊",
    "💎"
  ];

  /*
    通常図柄
  */

  for (let i = 0; i < data.common; i++) {

    strip.push(
      commonSymbols[i % commonSymbols.length]
    );

  }

  /*
    7の割合
  */

  for (let i = 0; i < data.seven; i++) {

    strip.push("7");

  }

  /*
    シャッフル
  */

  for (let i = strip.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [strip[i], strip[j]] = [strip[j], strip[i]];

  }

  return strip;
}

let reelStrips = [
  createReelStrip(),
  createReelStrip(),
  createReelStrip()
];

let reelPositions = [0, 0, 0];


/*
  START
*/

function startGame() {

  if (spinning) return;

  if (coins < 3) {

    document.getElementById("result").textContent =
      "💰 コインが足りません！";

    return;

  }

  coins -= 3;

  updateCoins();

  spinning = true;

  stopped = [false, false, false];

  document.getElementById("startBtn").disabled = true;

  document.getElementById("result").textContent =
    "🎰 目押ししてSTOP！";

  /*
    GOGO!リセット
  */

  document.getElementById("gogo").classList.remove("on");

  /*
    設定によってGOGO!が光る確率
  */

  const gogoRates = {
    1: 0.10,
    2: 0.13,
    3: 0.17,
    4: 0.22,
    5: 0.28,
    6: 0.35
  };

  if (Math.random() < gogoRates[setting]) {

    document.getElementById("gogo").classList.add("on");

    document.getElementById("result").textContent =
      "💡 GOGO! CHANCE！ 7を狙え！";

  }

  /*
    新しいリール位置
  */

  for (let i = 0; i < 3; i++) {

    reelStrips[i] = createReelStrip();

    reelPositions[i] =
      Math.floor(Math.random() * reelStrips[i].length);

    startReel(i);

  }

}


/*
  リール回転
*/

function startReel(index) {

  const reel = document.getElementById("reel" + index);

  const symbol =
    document.getElementById("symbol" + index);

  reel.classList.add("spinning");

  document.getElementById("stop" + index).disabled = false;

  spinTimers[index] = setInterval(function() {

    if (stopped[index]) return;

    reelPositions[index]++;

    if (
      reelPositions[index] >=
      reelStrips[index].length
    ) {

      reelPositions[index] = 0;

    }

    symbol.textContent =
      reelStrips[index][reelPositions[index]];

  }, 80);

}


/*
  STOP
*/

function stopReel(index) {

  if (!spinning) return;

  if (stopped[index]) return;

  stopped[index] = true;

  clearInterval(spinTimers[index]);

  spinTimers[index] = null;

  document
    .getElementById("reel" + index)
    .classList.remove("spinning");

  document.getElementById("stop" + index).disabled = true;

  reelValues[index] =
    reelStrips[index][reelPositions[index]];

  document.getElementById("symbol" + index).textContent =
    reelValues[index];

  /*
    3つ全部止まったら結果判定
  */

  if (
    stopped[0] &&
    stopped[1] &&
    stopped[2]
  ) {

    finishGame();

  }

}


/*
  結果判定
*/

function finishGame() {

  spinning = false;

  document.getElementById("startBtn").disabled = false;

  const a = reelValues[0];
  const b = reelValues[1];
  const c = reelValues[2];

  /*
    777
  */

  if (
    a === "7" &&
    b === "7" &&
    c === "7"
  ) {

    coins += 100;

    updateCoins();

    document.getElementById("result").textContent =
      "🎉 777 JACKPOT！ +100コイン！";

    showJackpot();

    return;

  }

  /*
    3つ同じ
  */

  if (
    a === b &&
    b === c
  ) {

    coins += 20;

    updateCoins();

    document.getElementById("result").textContent =
      "✨ 小当たり！ +20コイン！";

    return;

  }

  /*
    2つ揃いは払い出しなし
  */

  if (
    a === b ||
    b === c ||
    a === c
  ) {

    document.getElementById("result").textContent =
      "2つ揃い！ 払い出しなし";

    return;

  }

  /*
    ハズレ
  */

  document.getElementById("result").textContent =
    "😢 ハズレ……";

}


/*
  コイン表示
*/

function updateCoins() {

  document.getElementById("coins").textContent =
    coins;

}


/*
  777演出
*/

function showJackpot() {

  const jackpot =
    document.getElementById("jackpot");

  jackpot.classList.add("show");

  setTimeout(function() {

    jackpot.classList.remove("show");

  }, 2500);

}


/*
  管理者ログイン
*/

function adminLogin() {

  const password =
    document.getElementById("adminPassword").value;

  if (password === "777admin") {

    isAdmin = true;

    document.getElementById("adminArea").style.display =
      "block";

    document.getElementById("settingNumber").textContent =
      setting;

    document.getElementById("adminPassword").value =
      "";

    document.getElementById("result").textContent =
      "🔐 管理者ログインしました";

  } else {

    document.getElementById("result").textContent =
      "❌ パスワードが違います";

  }

}


/*
  管理者による設定変更
*/

function changeSetting() {

  if (!isAdmin) return;

  setting++;

  if (setting > 6) {

    setting = 1;

  }

  reelStrips = [
    createReelStrip(),
    createReelStrip(),
    createReelStrip()
  ];

  document.getElementById("settingNumber").textContent =
    setting;

  document.getElementById("result").textContent =
    "⚙️ 設定 " + setting + " に変更しました";

}


/*
  管理者ログアウト
*/

function adminLogout() {

  isAdmin = false;

  document.getElementById("adminArea").style.display =
    "none";

  document.getElementById("result").textContent =
    "🔒 管理者ログアウト";

}


/*
  1時間ごとに設定をランダム変更
*/

setInterval(function() {

  setting = randomSetting();

  if (isAdmin) {

    document.getElementById("settingNumber").textContent =
      setting;

    document.getElementById("result").textContent =
      "🎲 設定が変更されました";

  }

  reelStrips = [
    createReelStrip(),
    createReelStrip(),
    createReelStrip()
  ];

}, 60 * 60 * 1000);


/*
  最初の表示
*/

updateCoins();

</script>

</body>
</html>
