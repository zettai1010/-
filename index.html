<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スロット[Re]</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,"Noto Sans JP",sans-serif;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  transition:background 0.5s ease;
}

/* =========================
   背景
========================= */

body.normal-bg{
  background:
    radial-gradient(circle at center,#252525 0%,#111 55%,#050505 100%);
}

body.chance-bg{
  background:
    radial-gradient(circle at center,#183c61 0%,#0a1828 55%,#03070c 100%);
}

body.high-bg{
  background:
    radial-gradient(circle at center,#234d32 0%,#0b2415 55%,#030805 100%);
}

body.hot-bg{
  background:
    radial-gradient(circle at center,#663d16 0%,#291607 55%,#080300 100%);
}

body.void-bg{
  background:
    radial-gradient(circle at center,#54216e 0%,#200b2d 55%,#050108 100%);
}

/* =========================
   メイン
========================= */

.game{
  width:780px;
  max-width:95vw;
  background:rgba(12,17,28,.94);
  border:2px solid #414e6d;
  border-radius:20px;
  padding:22px;
  box-shadow:0 0 40px rgba(0,0,0,.75);
}

/* =========================
   タイトル
========================= */

.title{
  text-align:center;
  font-size:38px;
  font-weight:bold;
  letter-spacing:3px;
}

.subtitle{
  text-align:center;
  color:#8995b2;
  font-size:13px;
  margin-top:4px;
  margin-bottom:18px;
}

/* =========================
   状態
========================= */

.status{
  background:#171e2f;
  border:1px solid #35415e;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

.status-name{
  font-size:23px;
  font-weight:bold;
}

.status-info{
  color:#9da9c4;
  font-size:14px;
  margin-top:6px;
}

/* =========================
   背景情報
========================= */

.background-info{
  text-align:center;
  color:#aeb9d3;
  font-size:14px;
  margin-bottom:10px;
}

.expect{
  font-weight:bold;
}

/* =========================
   リール
========================= */

.reels{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}

.reel{
  width:150px;
  height:120px;
  background:linear-gradient(#f7f7f7,#c9c9c9);
  border:5px solid #606b82;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#111;
  font-size:32px;
  font-weight:bold;
  box-shadow:
    inset 0 0 15px rgba(0,0,0,.35),
    0 6px 18px rgba(0,0,0,.45);
}

/* =========================
   PUSH
========================= */

.push{
  width:100%;
  height:75px;
  border:none;
  border-radius:15px;
  color:white;
  font-size:30px;
  font-weight:bold;
  letter-spacing:3px;
  cursor:pointer;
  transition:.15s;
  box-shadow:0 7px 0 rgba(0,0,0,.4);
}

.push:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 rgba(0,0,0,.4);
}

.push-white{
  background:linear-gradient(#eee,#999);
  color:#111;
}

.push-blue{
  background:linear-gradient(#4d9cff,#1753a8);
}

.push-green{
  background:linear-gradient(#62d879,#16833a);
}

.push-yellow{
  background:linear-gradient(#ffe96a,#c89b00);
  color:#201800;
}

.push-red{
  background:linear-gradient(#ff6969,#a70000);
}

.push-purple{
  background:linear-gradient(#c873ff,#6320a5);
}

.push-rainbow{
  background:linear-gradient(
    90deg,
    #ff4444,
    #ffcf33,
    #55dd66,
    #55aaff,
    #c45cff
  );
}

/* =========================
   メッセージ
========================= */

.message{
  min-height:75px;
  margin-top:17px;
  background:#171e2f;
  border:1px solid #35415e;
  border-radius:11px;
  padding:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:18px;
  line-height:1.5;
}

.message.hot{
  color:#ffe36e;
  border-color:#a38325;
  background:#28220f;
}

.message.void{
  color:#e7b8ff;
  border-color:#8148a4;
  background:#24132e;
}

/* =========================
   ボーナス情報
========================= */

.bonus-info{
  display:none;
  margin-bottom:15px;
  padding:16px;
  background:#181f31;
  border:1px solid #4b5878;
  border-radius:12px;
}

.bonus-title{
  font-size:22px;
  font-weight:bold;
}

.bonus-count{
  font-size:17px;
  margin-top:7px;
}

.bonus-medals{
  color:#abb7d1;
  margin-top:5px;
}

/* =========================
   ボーナス一覧
========================= */

.section-title{
  margin-top:23px;
  margin-bottom:10px;
  color:#bbc5ff;
  font-size:18px;
  font-weight:bold;
}

.bonus-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.bonus{
  background:#1a2233;
  border:1px solid #303b55;
  border-radius:9px;
  padding:12px;
}

.bonus-name{
  font-weight:bold;
}

.bonus-game{
  color:#8e9ab5;
  font-size:13px;
  margin-top:5px;
}

/* =========================
   履歴
========================= */

.history{
  margin-top:15px;
  background:#0c121f;
  border-radius:10px;
  padding:10px;
  max-height:150px;
  overflow-y:auto;
}

.history div{
  padding:5px;
  border-bottom:1px solid #202a3d;
  color:#98a5c1;
  font-size:13px;
}

.reset{
  margin-top:12px;
  width:100%;
  padding:10px;
  background:#242d42;
  color:#aeb8d0;
  border:1px solid #3b4762;
  border-radius:8px;
  cursor:pointer;
}

/* =========================
   突入演出
========================= */

.effect{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:100;
}

.effect.show{
  display:flex;
}

.effect-box{
  text-align:center;
  animation:effectIn .5s ease-out;
}

.effect-small{
  font-size:22px;
  letter-spacing:5px;
  color:#d4d8e5;
}

.effect-big{
  font-size:58px;
  font-weight:bold;
  margin-top:12px;
  text-shadow:0 0 25px currentColor;
}

.effect-sub{
  font-size:24px;
  margin-top:15px;
  color:#fff;
}

@keyframes effectIn{
  from{
    transform:scale(.5);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.flash{
  animation:flash .3s ease-in-out 3;
}

@keyframes flash{
  50%{
    transform:scale(1.05);
  }
}

/* =========================
   スマホ
========================= */

@media(max-width:600px){

  .game{
    padding:14px;
  }

  .title{
    font-size:30px;
  }

  .reel{
    width:30%;
    height:90px;
    font-size:22px;
  }

  .bonus-list{
    grid-template-columns:1fr;
  }

  .effect-big{
    font-size:40px;
  }
}
</style>
</head>

<body class="normal-bg">

<div class="game">

  <div class="title">
    スロット[Re]
  </div>

  <div class="subtitle">
    BONUS / VOID / REPLAY CHANCE
  </div>

  <!-- 状態 -->

  <div class="status">

    <div
      class="status-name"
      id="stateName">
      通常時
    </div>

    <div
      class="status-info"
      id="stateInfo">
      小役を消化しながらボーナスを抽選
    </div>

  </div>

  <!-- 背景 -->

  <div class="background-info">
    背景：
    <span id="backgroundName">
      通常
    </span>
   　
    期待度：
    <span
      class="expect"
      id="backgroundExpect">
      ★☆☆☆☆
    </span>
  </div>

  <!-- BONUS情報 -->

  <div
    class="bonus-info"
    id="bonusInfo">

    <div
      class="bonus-title"
      id="bonusTitle">
      BONUS
    </div>

    <div
      class="bonus-count"
      id="bonusCount">
      100枚 × 5回
    </div>

    <div
      class="bonus-medals"
      id="bonusMedals">
      獲得枚数：0枚
    </div>

  </div>

  <!-- リール -->

  <div class="reels">

    <div
      class="reel"
      id="reel1">
      7
    </div>

    <div
      class="reel"
      id="reel2">
      BAR
    </div>

    <div
      class="reel"
      id="reel3">
      7
    </div>

  </div>

  <!-- PUSH -->

  <button
    class="push push-white"
    id="pushButton"
    onclick="play()">
    PUSH
  </button>

  <div
    class="background-info"
    style="margin-top:9px">

    PUSH：
    <span id="pushName">
      WHITE
    </span>
    　
    期待度：
    <span
      class="expect"
      id="pushExpect">
      ★☆☆☆☆
    </span>

  </div>

  <!-- メッセージ -->

  <div
    class="message"
    id="message">

    PUSHでゲーム開始

  </div>

  <!-- ボーナス一覧 -->

  <div class="section-title">
    ボーナス
  </div>

  <div class="bonus-list">

    <div class="bonus">
      <div class="bonus-name">
        レギュラー
      </div>
      <div class="bonus-game">
        100枚 × 5回
      </div>
    </div>

    <div class="bonus">
      <div class="bonus-name">
        リーフィンド
      </div>
      <div class="bonus-game">
        100枚 × 5回
      </div>
    </div>

    <div class="bonus">
      <div class="bonus-name">
        ダストロック
      </div>
      <div class="bonus-game">
        100枚 × 5回
      </div>
    </div>

    <div class="bonus">
      <div class="bonus-name">
        書物の怨念
      </div>
      <div class="bonus-game">
        100枚 × 5回
      </div>
    </div>

  </div>

  <!-- 履歴 -->

  <div class="section-title">
    ゲーム履歴
  </div>

  <div
    class="history"
    id="history">

    <div>
      ゲーム開始
    </div>

  </div>

  <button
    class="reset"
    onclick="resetGame()">

    リセット

  </button>

</div>


<!-- =========================
     突入演出画面
========================= -->

<div
  class="effect"
  id="effect">

  <div class="effect-box">

    <div
      class="effect-small"
      id="effectSmall">
      CHANCE
    </div>

    <div
      class="effect-big"
      id="effectBig">
      BONUS
    </div>

    <div
      class="effect-sub"
      id="effectSub">
      BONUS START!!
    </div>

  </div>

</div>


<script>

/* =========================
   状態
========================= */

let state = "normal";

let bonusName = "";

let bonusRemaining = 0;

let bonusMedals = 0;

let remainingGames = 0;


/* =========================
   背景
========================= */

let currentBackground = {
  name:"通常",
  expect:1,
  bonusRate:0
};


/* =========================
   PUSH
========================= */

let currentPush = {
  name:"WHITE",
  expect:1,
  bonusRate:0
};


/* =========================
   ボーナス
========================= */

const bonuses = [

  {name:"レギュラー"},

  {name:"リーフィンド"},

  {name:"ダストロック"},

  {name:"書物の怨念"}

];


/* =========================
   背景抽選
========================= */

function randomBackground(){

  const r = Math.random();

  if(r < 0.55){

    currentBackground = {
      name:"通常",
      expect:1,
      bonusRate:0
    };

    document.body.className =
      "normal-bg";

  }

  else if(r < 0.78){

    currentBackground = {
      name:"チャンス",
      expect:2,
      bonusRate:.02
    };

    document.body.className =
      "chance-bg";

  }

  else if(r < 0.91){

    currentBackground = {
      name:"HIGH",
      expect:3,
      bonusRate:.04
    };

    document.body.className =
      "high-bg";

  }

  else if(r < 0.98){

    currentBackground = {
      name:"激熱",
      expect:4,
      bonusRate:.07
    };

    document.body.className =
      "hot-bg";

  }

  else{

    currentBackground = {
      name:"VOID",
      expect:5,
      bonusRate:.12
    };

    document.body.className =
      "void-bg";

  }


  document.getElementById(
    "backgroundName"
  ).textContent =
    currentBackground.name;


  document.getElementById(
    "backgroundExpect"
  ).textContent =
    stars(currentBackground.expect);

}


/* =========================
   PUSH色抽選
========================= */

function randomPush(){

  const button =
    document.getElementById(
      "pushButton"
    );

  button.className =
    "push";


  const r = Math.random();


  if(r < .40){

    currentPush = {
      name:"WHITE",
      expect:1,
      bonusRate:0
    };

    button.classList.add(
      "push-white"
    );

  }

  else if(r < .60){

    currentPush = {
      name:"BLUE",
      expect:2,
      bonusRate:.01
    };

    button.classList.add(
      "push-blue"
    );

  }

  else if(r < .76){

    currentPush = {
      name:"GREEN",
      expect:3,
      bonusRate:.025
    };

    button.classList.add(
      "push-green"
    );

  }

  else if(r < .88){

    currentPush = {
      name:"YELLOW",
      expect:3,
      bonusRate:.04
    };

    button.classList.add(
      "push-yellow"
    );

  }

  else if(r < .96){

    currentPush = {
      name:"RED",
      expect:4,
      bonusRate:.07
    };

    button.classList.add(
      "push-red"
    );

  }

  else if(r < .99){

    currentPush = {
      name:"PURPLE",
      expect:5,
      bonusRate:.10
    };

    button.classList.add(
      "push-purple"
    );

  }

  else{

    currentPush = {
      name:"RAINBOW",
      expect:5,
      bonusRate:.20
    };

    button.classList.add(
      "push-rainbow"
    );

  }


  document.getElementById(
    "pushName"
  ).textContent =
    currentPush.name;


  document.getElementById(
    "pushExpect"
  ).textContent =
    stars(currentPush.expect);

}


/* =========================
   星
========================= */

function stars(n){

  return "★".repeat(n) +
         "☆".repeat(5-n);

}


/* =========================
   初期演出
========================= */

randomBackground();
randomPush();


/* =========================
   PUSH
========================= */

function play(){

  if(state === "normal"){

    normalGame();

    return;

  }


  if(state === "bonus"){

    bonusGame();

    return;

  }


  if(state === "void"){

    voidGame();

    return;

  }


  if(state === "replay30"){

    replayChanceGame();

    return;

  }


  if(state === "cz"){

    czGame();

    return;

  }


  if(state === "replayInfinite"){

    infiniteReplayGame();

    return;

  }

}


/* =========================
   通常時
========================= */

function normalGame(){

  /*
    背景＋PUSHの複合期待度
  */

  let bonusRate =
    .045 +
    currentBackground.bonusRate +
    currentPush.bonusRate;


  /*
    VOID背景＋虹PUSH
  */

  if(
    currentBackground.expect >= 5 &&
    currentPush.expect >= 5
  ){

    if(Math.random() < .35){

      startVoidBonusEffect();

      return;

    }

  }


  /*
    ボーナス
  */

  if(Math.random() < bonusRate){

    startBonusEffect();

    return;

  }


  /*
    CZチャンス
  */

  if(
    currentBackground.expect >= 3 &&
    Math.random() < .08
  ){

    setReels(
      "CZ",
      "CZ",
      "CZ"
    );

    message(
      "⚡ CZチャンス！"
    );

    addHistory(
      "通常時：CZチャンス"
    );

    nextNormal();

    return;

  }


  /*
    チャンス役
  */

  if(Math.random() < .12){

    setReels(
      "🍒",
      "🍒",
      "🍒"
    );

    message(
      "🍒 チャンス役！"
    );

    addHistory(
      "通常時：チャンス役"
    );

    nextNormal();

    return;

  }


  /*
    ハズレ
  */

  setReels(
    "7",
    "BAR",
    "🍒"
  );

  message(
    "ハズレ"
  );

  addHistory(
    "通常時：ハズレ"
  );


  nextNormal();

}


/* =========================
   次の通常ゲーム
========================= */

function nextNormal(){

  randomBackground();
  randomPush();

}


/* =========================
   BONUS演出
========================= */

function startBonusEffect(){

  const bonus =
    bonuses[
      Math.floor(
        Math.random() *
        bonuses.length
      )
    ];


  bonusName =
    bonus.name;


  showEffect(
    "CHANCE",
    bonusName + " BONUS",
    "BONUS START!!"
  );


  addHistory(
    "BONUS突入演出：" +
    bonusName
  );


  setTimeout(()=>{

    hideEffect();

    startBonus();

  },1800);

}


/* =========================
   BONUS開始
========================= */

function startBonus(){

  state =
    "bonus";


  bonusRemaining =
    5;


  bonusMedals =
    0;


  showBonusInfo();


  setState(
    "ボーナス",
    bonusName +
    "　100枚 × 5回"
  );


  setReels(
    "BONUS",
    "BONUS",
    "BONUS"
  );


  message(
    "🎰 " +
    bonusName +
    " BONUS開始！<br>" +
    "100枚 × 5回"
  );


  addHistory(
    bonusName +
    " BONUS START"
  );

}


/* =========================
   BONUS中
========================= */

function bonusGame(){

  bonusRemaining--;

  bonusMedals += 100;


  setReels(
    "100",
    "枚",
    "GET"
  );


  updateBonusInfo();


  /*
    Void昇格
  */

  if(Math.random() < .01){

    startVoidBonusEffect();

    return;

  }


  /*
    +500枚
  */

  if(Math.random() < .02){

    bonusRemaining += 5;

    message(
      "🔥 <b>BIG BONUS CHANCE!!</b><br>" +
      "+500枚追加！"
    );

    document
      .getElementById("message")
      .classList.add("hot");

    updateBonusInfo();

    addHistory(
      "BIG BONUS CHANCE → +500枚"
    );

    setTimeout(()=>{

      document
        .getElementById("message")
        .classList.remove("hot");

    },500);

    return;

  }


  /*
    +100枚
  */

  if(Math.random() < .10){

    bonusRemaining++;

    message(
      "⚡ <b>BONUS CHANCE!</b><br>" +
      "+100枚追加！"
    );

    document
      .getElementById("message")
      .classList.add("hot");

    updateBonusInfo();

    addHistory(
      "BONUS CHANCE → +100枚"
    );

    setTimeout(()=>{

      document
        .getElementById("message")
        .classList.remove("hot");

    },500);

    return;

  }


  message(
    "💰 100枚獲得！<br>" +
    "残り " +
    bonusRemaining +
    "回"
  );


  addHistory(
    "BONUS：+100枚"
  );


  if(bonusRemaining <= 0){

    finishBonus();

  }

}


/* =========================
   BONUS終了
========================= */

function finishBonus(){

  state =
    "replay30";


  remainingGames =
    30;


  hideBonusInfo();


  setState(
    "リプレイ確変",
    "30G"
  );


  setReels(
    "REPLAY",
    "REPLAY",
    "REPLAY"
  );


  message(
    "🎉 BONUS終了！<br>" +
    "獲得枚数：" +
    bonusMedals +
    "枚<br>" +
    "リプレイ確変30Gへ！"
  );


  addHistory(
    "BONUS終了：" +
    bonusMedals +
    "枚"
  );

}


/* =========================
   Void演出
========================= */

function startVoidBonusEffect(){

  showEffect(
    "SPECIAL",
    "VOID BONUS",
    "MAXIMUM CHANCE"
  );


  addHistory(
    "👑 VOID BONUS昇格演出"
  );


  setTimeout(()=>{

    hideEffect();

    startVoidBonus();

  },2000);

}


/* =========================
   Void開始
========================= */

function startVoidBonus(){

  state =
    "void";


  remainingGames =
    100;


  hideBonusInfo();


  setState(
    "Voidボーナス",
    "100G"
  );


  document.body.className =
    "void-bg";


  setReels(
    "VOID",
    "VOID",
    "VOID"
  );


  message(
    "👑 <b>VOID BONUS</b><br>" +
    "100G開始！"
  );


  addHistory(
    "VOID BONUS START"
  );

}


/* =========================
   Void中
========================= */

function voidGame(){

  remainingGames--;


  if(Math.random() < .02){

    remainingGames += 10;


    message(
      "👑 Void中<br>" +
      "ゲーム数上乗せ！<br>" +
      "+10G"
    );


    addHistory(
      "Void：+10G"
    );


    return;

  }


  setReels(
    "VOID",
    randomSymbol(),
    "VOID"
  );


  message(
    "👑 Voidボーナス中<br>" +
    "残り " +
    remainingGames +
    "G"
  );


  if(remainingGames <= 0){

    state =
      "replayInfinite";


    setState(
      "リプレイ確変（無限）",
      "終了条件なし"
    );


    setReels(
      "REPLAY",
      "REPLAY",
      "REPLAY"
    );


    message(
      "👑 Void終了！<br>" +
      "♾️ 無限リプレイ確変へ！"
    );


    addHistory(
      "Void終了 → 無限リプレイ確変"
    );

  }

}


/* =========================
   リプレイ確変30G
========================= */

function replayChanceGame(){

  remainingGames--;


  const r =
    Math.random();


  if(r < .02){

    startBonusEffect();

    return;

  }


  if(r < .10){

    state =
      "cz";


    remainingGames =
      5;


    setState(
      "CZ",
      "5G"
    );


    setReels(
      "CZ",
      "CZ",
      "CZ"
    );


    message(
      "⚡ <b>CZ突入！</b><br>" +
      "5G間のチャンス！"
    );


    addHistory(
      "CZ突入"
    );


    return;

  }


  setReels(
    "REPLAY",
    "REPLAY",
    "BAR"
  );


  message(
    "リプレイ確変中<br>" +
    "残り " +
    remainingGames +
    "G"
  );


  if(remainingGames <= 0){

    state =
      "normal";


    setState(
      "通常時",
      "小役を消化しながらボーナスを抽選"
    );


    message(
      "リプレイ確変終了<br>" +
      "通常時へ"
    );


    addHistory(
      "リプレイ確変終了"
    );


    nextNormal();

  }

}

/* =========================
   無限リプレイ確変
========================= */

function infiniteReplayGame(){

  const r =
    Math.random();


  if(r < .04){

    startVoidBonusEffect();

    return;

  }


  if(r < .08){

    startBonusEffect();

    return;

  }


  setReels(
    "REPLAY",
    "REPLAY",
    "REPLAY"
  );


  message(
    "♾️ リプレイ確変（無限）<br>" +
    "終了条件なし"
  );


  addHistory(
    "無限リプレイ：リプレイ"
  );

}


/* =========================
   リール
========================= */

function setReels(a,b,c){

  document.getElementById(
    "reel1"
  ).textContent=a;

  document.getElementById(
    "reel2"
  ).textContent=b;

  document.getElementById(
    "reel3"
  ).textContent=c;

}


/* =========================
   ランダム図柄
========================= */

function randomSymbol(){

  const symbols=[
    "7",
    "BAR",
    "🍒",
    "🍈",
    "REPLAY"
  ];


  return symbols[
    Math.floor(
      Math.random() *
      symbols.length
    )
  ];

}


/* =========================
   状態
========================= */

function setState(name,info){

  document.getElementById(
    "stateName"
  ).textContent=name;

  document.getElementById(
    "stateInfo"
  ).textContent=info;

}


/* =========================
   メッセージ
========================= */

function message(text){

  document.getElementById(
    "message"
  ).innerHTML=text;

}


/* =========================
   BONUS情報
========================= */

function showBonusInfo(){

  document.getElementById(
    "bonusInfo"
  ).style.display="block";

  updateBonusInfo();

}


function hideBonusInfo(){

  document.getElementById(
    "bonusInfo"
  ).style.display="none";

}


function updateBonusInfo(){

  document.getElementById(
    "bonusTitle"
  ).textContent=
    bonusName+" BONUS";


  document.getElementById(
    "bonusCount"
  ).textContent=
    "100枚 × "+
    bonusRemaining+
    "回";


  document.getElementById(
    "bonusMedals"
  ).textContent=
    "獲得枚数："+
    bonusMedals+
    "枚";

}


/* =========================
   演出
========================= */

function showEffect(small,big,sub){

  document.getElementById(
    "effectSmall"
  ).textContent=small;

  document.getElementById(
    "effectBig"
  ).textContent=big;

  document.getElementById(
    "effectSub"
  ).textContent=sub;


  const bigText =
    document.getElementById(
      "effectBig"
    );


  if(big.includes("VOID")){

    bigText.style.color=
      "#d98cff";

  }
  else{

    bigText.style.color=
      "#ffd85c";

  }


  document.getElementById(
    "effect"
  ).classList.add("show");

}


function hideEffect(){

  document.getElementById(
    "effect"
  ).classList.remove("show");

}


/* =========================
   履歴
========================= */

function addHistory(text){

  const history =
    document.getElementById(
      "history"
    );


  const item =
    document.createElement(
      "div"
    );


  item.textContent=text;


  history.prepend(item);

}


/* =========================
   リセット
========================= */

function resetGame(){

  state="normal";

  bonusName="";

  bonusRemaining=0;

  bonusMedals=0;

  remainingGames=0;


  hideBonusInfo();

  hideEffect();


  document.body.className=
    "normal-bg";


  setState(
    "通常時",
    "小役を消化しながらボーナスを抽選"
  );


  setReels(
    "7",
    "BAR",
    "7"
  );


  message(
    "PUSHでゲーム開始"
  );


  document.getElementById(
    "history"
  ).innerHTML=
    "<div>ゲームリセット</div>";


  randomBackground();
  randomPush();

}

</script>
