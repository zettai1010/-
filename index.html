<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG CASINO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f111a;
    --card: #171a26;
    --dark: #0b0d14;
    --border: #282c3f;
    --gold: #f5b942;
    --green: #10b981;
    --red: #ef4444;
    --text: #f8fafc;
    --muted: #8b92a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px;
  }
  .hidden { display: none !important; }

  .auth-card {
    width: 100%;
    max-width: 380px;
    margin-top: 40px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 22px;
  }
  .auth-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: var(--dark);
    padding: 4px;
    border-radius: 8px;
  }
  .auth-tab {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
    cursor: pointer;
  }
  .auth-tab.active { background: var(--gold); color: #111; }
  .label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; font-weight: bold; }
  .input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--dark);
    color: var(--text);
    font-size: 0.95rem;
  }
  .btn-main {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--gold);
    color: #111;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn-main:disabled { background: #2c3146; color: var(--muted); cursor: not-allowed; }

  .app-wrap { width: 100%; max-width: 520px; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .bal { font-weight: 800; font-size: 0.95rem; }
  .bal span { color: var(--green); font-size: 1.15rem; }
  .mini-btn {
    background: #222638;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
  }
  .tab.active { background: var(--gold); color: #111; border-color: var(--gold); }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
  }
  .msg { margin-top: 12px; font-size: 0.88rem; font-weight: 700; min-height: 22px; }

  /* ルーレット用スタイル */
  .wheel-box {
    width: 120px;
    height: 120px;
    margin: 8px auto 14px;
    border-radius: 50%;
    border: 5px solid var(--gold);
    background: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    font-weight: 900;
    box-shadow: 0 0 20px rgba(245, 185, 66, 0.25);
    transition: background 0.2s, transform 0.2s;
  }
  .wheel-red { background: #dc2626; color: #fff; }
  .wheel-black { background: #18181b; color: #fff; }
  .wheel-green { background: #059669; color: #fff; }

  .history-bar {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-bottom: 14px;
    min-height: 26px;
  }
  .hist-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 0.75rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .rl-choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .rl-btn {
    padding: 12px 8px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--dark);
    color: #fff;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .rl-btn.selected {
    border-color: var(--gold);
    box-shadow: 0 0 10px rgba(245, 185, 66, 0.4);
  }
  .rl-btn.red { background: rgba(220, 38, 38, 0.25); }
  .rl-btn.black { background: rgba(39, 39, 42, 0.7); }
  .rl-btn.green { grid-column: span 2; background: rgba(16, 185, 129, 0.2); }

  .bet-row { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
  .bet-input {
    width: 130px;
    padding: 9px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
  }

  /* ランキング用スタイル */
  .rank-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
    text-align: left;
  }
  .rank-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--dark);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 9px;
    font-size: 0.9rem;
  }
  .rank-item.me {
    border-color: var(--gold);
    background: rgba(245, 185, 66, 0.08);
  }
  .rank-left { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .rank-badge { width: 28px; text-align: center; font-weight: 900; color: var(--muted); }
  .rank-1 { color: #ffd700; font-size: 1.15rem; }
  .rank-2 { color: #c0c0c0; font-size: 1.1rem; }
  .rank-3 { color: #cd7f32; font-size: 1.05rem; }
  .rank-bal { font-weight: 800; color: var(--green); }

  .user-list {
    max-height: 220px;
    overflow-y: auto;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    text-align: left;
    margin-top: 14px;
    font-size: 0.82rem;
  }
  .user-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 8px;
    border-bottom: 1px solid #1a1e2e;
    cursor: pointer;
  }
  .user-row:hover { background: #171a26; }
</style>
</head>
<body>

<!-- ログイン / 新規登録画面 -->
<div class="auth-card" id="login-view">
  <h2 style="margin:0 0 14px; color:var(--gold); text-align:center;">⚔️ RPG CASINO</h2>
  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-log" onclick="switchAuth('login')">ログイン</button>
    <button class="auth-tab" id="tab-reg" onclick="switchAuth('register')">新規登録</button>
  </div>

  <label class="label">MCID（統合版は先頭に BE_ ）</label>
  <input id="mcid" class="input" placeholder="例: Steve / BE_Steve">

  <label class="label">パスワード</label>
  <input id="pass" type="password" class="input" placeholder="••••••••">

  <div id="reg-extra" class="hidden">
    <label class="label">パスワード（確認用）</label>
    <input id="pass2" type="password" class="input" placeholder="もう一度入力">
  </div>

  <button class="btn-main" id="auth-submit" onclick="submitAuth()">ログイン</button>
  <div id="err" style="color:var(--red); font-size:0.8rem; text-align:center; margin-top:10px;"></div>
</div>

<!-- メイン画面 -->
<div class="app-wrap hidden" id="game-view">
  <div class="header">
    <div>
      <div style="font-weight:800; color:var(--gold); font-size:0.9rem;" id="u-name"></div>
      <div class="bal"><span id="bal">0</span> G <button class="mini-btn" style="padding:2px 6px; margin-left:4px;" onclick="refreshBalance()">🔄</button></div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="mini-btn" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="tab('roulette', this)">🎡 ルーレット</button>
    <button class="tab" onclick="tab('ranking', this)">🏆 順位</button>
    <button class="tab" id="dep-tab-btn" onclick="tab('deposit', this)">💰 入出金</button>
    <button class="tab hidden" id="admin-tab-btn" style="color:var(--gold);" onclick="tab('admin', this)">👑 管理</button>
  </div>

  <!-- 1. ルーレット（お試し版） -->
  <div id="roulette" class="panel">
    <div style="font-size:0.75rem; color:var(--muted); margin-bottom:4px;">最大ベット上限: <strong>5,000 G</strong></div>

    <div class="wheel-box" id="rl-wheel">?</div>
    <div class="history-bar" id="rl-hist"></div>

    <div class="rl-choices">
      <button class="rl-btn red selected" onclick="selectBetType('red', this)">🔴 RED (2.0x)</button>
      <button class="rl-btn black" onclick="selectBetType('black', this)">⚫ BLACK (2.0x)</button>
      <button class="rl-btn" onclick="selectBetType('even', this)">🔢 EVEN 偶数 (2.0x)</button>
      <button class="rl-btn" onclick="selectBetType('odd', this)">🔢 ODD 奇数 (2.0x)</button>
      <button class="rl-btn green" onclick="selectBetType('zero', this)">🟢 0 一点狙い (30.0x)</button>
    </div>

    <div class="bet-row">
      <input id="rl-bet" type="number" class="bet-input" value="500" min="10">
      <button class="mini-btn" onclick="scaleBet(0.5)">1/2</button>
      <button class="mini-btn" onclick="scaleBet(2)">2x</button>
      <button class="mini-btn" onclick="maxBet()">MAX</button>
    </div>

    <button class="btn-main" id="rl-spin-btn" onclick="spinRoulette()">🎡 SPIN ROULETTE</button>
    <div class="msg" id="rl-msg"></div>
  </div>

  <!-- 2. 所持金ランキング -->
  <div id="ranking" class="panel hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <h3 style="margin:0; color:var(--gold);">🏆 所持金ランキング TOP20</h3>
      <button class="mini-btn" onclick="loadRanking()">🔄 更新</button>
    </div>
    <div class="rank-list" id="rank-list">読み込み中...</div>
  </div>

  <!-- 3. 入出金申請 -->
  <div id="deposit" class="panel hidden">
    <h3 style="margin-top:0; color:var(--gold);">💰 入金・出金申請</h3>
    <label class="label" style="text-align:left;">申請タイプ</label>
    <select id="req-type" class="input">
      <option value="💰 入金申請">💰 入金（マイクラ → カジノ）</option>
      <option value="💸 出金申請">💸 出金（カジノ → マイクラ）</option>
    </select>
    <label class="label" style="text-align:left;">金額 (G)</label>
    <input id="req-amount" type="number" class="input" value="10000" min="100">
    <button class="btn-main" id="req-btn" onclick="sendDepositNotice()">📩 運営に通知を送る</button>
    <div class="msg" id="req-msg"></div>
  </div>

  <!-- 4. 運営専用管理パネル -->
  <div id="admin" class="panel hidden">
    <h3 style="margin-top:0; color:var(--gold);">👑 運営用：残高操作</h3>
    <label class="label" style="text-align:left;">対象プレイヤーのMCID</label>
    <input id="adm-target" class="input" placeholder="下のリストからタップでも選択可">
    <label class="label" style="text-align:left;">増減金額（減らす場合はマイナス -1000）</label>
    <input id="adm-amount" type="number" class="input" value="10000">
    <button class="btn-main" onclick="adminAddBalance()">✅ 残高を反映する</button>
    <div class="msg" id="adm-msg"></div>
    <div class="user-list" id="adm-user-list">読み込み中...</div>
  </div>
</div>

<script>
  // ==========================================
  // ★ 設定（新しいDiscord Webhook URLを貼ってください） ★
  // ==========================================
  const SUPABASE_URL = "https://vjbejlzlddraniyqmbvr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqYmVqbHpsZGRyYW5peXFtYnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMTg1OTYsImV4cCI6MjExMDY5NDU5Nn0.ZQdt16PuI-aQiPEx0A2_a8GXO6SgNlOZ-7l-Bzp8dpM";
  const ADMIN_MCID = "Smile2525";
  const DISCORD_WEBHOOK_URL = "";
  const MAX_BET_LIMIT = 5000;

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ME_KEY = "rpg_casino_cloud_mcid";
  let authMode = "login";
  let me = localStorage.getItem(ME_KEY);
  let myBalance = 0;

  function switchAuth(mode) {
    authMode = mode;
    document.getElementById("err").innerText = "";
    document.getElementById("tab-log").classList.toggle("active", mode === "login");
    document.getElementById("tab-reg").classList.toggle("active", mode === "register");
    document.getElementById("reg-extra").classList.toggle("hidden", mode === "login");
    document.getElementById("auth-submit").innerText = mode === "login" ? "ログイン" : "アカウントを新規作成";
  }

  async function submitAuth() {
    const id = document.getElementById("mcid").value.trim();
    const pw = document.getElementById("pass").value.trim();
    const pw2 = document.getElementById("pass2").value.trim();
    const err = document.getElementById("err");
    const btn = document.getElementById("auth-submit");

    if (!id || !pw) { err.innerText = "MCIDとパスワードを入力してください"; return; }
    btn.disabled = true;
    err.innerText = "通信中...";

    try {
      if (authMode === "register") {
        if (pw !== pw2) { err.innerText = "確認用パスワードが一致しません"; btn.disabled = false; return; }
        const { data: existing, error: selErr } = await sb.from("casino_users").select("mcid").eq("mcid", id).maybeSingle();
        if (selErr) { err.innerText = "通信エラー: " + selErr.message; btn.disabled = false; return; }
        if (existing) { err.innerText = "このMCIDはすでに登録されています"; btn.disabled = false; return; }

        const { error: insErr } = await sb.from("casino_users").insert({ mcid: id, password: pw, balance: 0 });
        if (insErr) { err.innerText = "登録エラー: " + insErr.message; btn.disabled = false; return; }
        notifyDiscord(`🆕 **新規登録**\nMCID: \`${id}\``);
      } else {
        const { data: user, error: logErr } = await sb.from("casino_users").select("*").eq("mcid", id).maybeSingle();
        if (logErr) { err.innerText = "通信エラー: " + logErr.message; btn.disabled = false; return; }
        if (!user) { err.innerText = "MCIDが見つかりません"; btn.disabled = false; return; }
        if (user.password !== pw) { err.innerText = "パスワードが違います"; btn.disabled = false; return; }
      }

      me = id;
      localStorage.setItem(ME_KEY, me);
      btn.disabled = false;
      err.innerText = "";
      await startApp();
    } catch (e) {
      err.innerText = "エラー: " + e.message;
      btn.disabled = false;
    }
  }

  async function startApp() {
    document.getElementById("login-view").classList.add("hidden");
    document.getElementById("game-view").classList.remove("hidden");
    document.getElementById("u-name").innerText = "MCID: " + me;
    if (me === ADMIN_MCID) {
      document.getElementById("admin-tab-btn").classList.remove("hidden");
    }
    await refreshBalance();
  }

  async function refreshBalance() {
    const { data } = await sb.from("casino_users").select("balance").eq("mcid", me).single();
    if (data) {
      myBalance = Number(data.balance);
      document.getElementById("bal").innerText = Math.floor(myBalance).toLocaleString();
    }
  }

  async function updateCloudBalance(diff) {
    await refreshBalance();
    const nextBal = Math.max(0, Math.floor(myBalance + diff));
    const { error } = await sb.from("casino_users").update({ balance: nextBal }).eq("mcid", me);
    if (!error) {
      myBalance = nextBal;
      document.getElementById("bal").innerText = myBalance.toLocaleString();
    }
  }

  function logout() {
    localStorage.removeItem(ME_KEY);
    location.reload();
  }

  function tab(name, btn) {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    ["roulette", "ranking", "deposit", "admin"].forEach(t => document.getElementById(t).classList.toggle("hidden", t !== name));
    if (name === "ranking") loadRanking();
    if (name === "admin") loadAllUsers();
  }

  // ==========================================
  // 🎡 ルーレットロジック（0〜36のヨーロピアン形式）
  // ==========================================
  const RED_NUMS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  let selectedBetType = "red";
  let rlHistory = [];

  function getNumColor(n) {
    if (n === 0) return "green";
    return RED_NUMS.has(n) ? "red" : "black";
  }

  function selectBetType(type, btn) {
    selectedBetType = type;
    document.querySelectorAll(".rl-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
  }

  function scaleBet(factor) {
    const el = document.getElementById("rl-bet");
    el.value = Math.min(MAX_BET_LIMIT, Math.max(10, Math.floor(el.value * factor)));
  }

  function maxBet() {
    document.getElementById("rl-bet").value = Math.min(MAX_BET_LIMIT, Math.max(10, Math.floor(myBalance)));
  }

  async function spinRoulette() {
    const bet = Number(document.getElementById("rl-bet").value);
    const msg = document.getElementById("rl-msg");
    const btn = document.getElementById("rl-spin-btn");
    const wheel = document.getElementById("rl-wheel");

    await refreshBalance();
    if (bet <= 0 || bet > myBalance) {
      msg.style.color = "var(--red)";
      msg.innerText = "残高不足です";
      return;
    }
    if (bet > MAX_BET_LIMIT) {
      msg.style.color = "var(--red)";
      msg.innerText = `最大ベット上限は ${MAX_BET_LIMIT.toLocaleString()} G です`;
      return;
    }

    await updateCloudBalance(-bet);
    btn.disabled = true;
    msg.style.color = "var(--muted)";
    msg.innerText = "回転中...";

    let ticks = 0;
    const iv = setInterval(async () => {
      const tempNum = Math.floor(Math.random() * 37);
      const tempCol = getNumColor(tempNum);
      wheel.innerText = tempNum;
      wheel.className = "wheel-box wheel-" + tempCol;

      if (++ticks > 16) {
        clearInterval(iv);
        const resultNum = Math.floor(Math.random() * 37);
        const resultCol = getNumColor(resultNum);
        wheel.innerText = resultNum;
        wheel.className = "wheel-box wheel-" + resultCol;

        // 履歴追加（最新8件）
        rlHistory.unshift({ num: resultNum, col: resultCol });
        if (rlHistory.length > 8) rlHistory.pop();
        document.getElementById("rl-hist").innerHTML = rlHistory.map(h => {
          const bg = h.col === "red" ? "#dc2626" : h.col === "black" ? "#27272a" : "#059669";
          return `<div class="hist-dot" style="background:${bg};">${h.num}</div>`;
        }).join("");

        let mult = 0;
        if (selectedBetType === "red" && resultCol === "red") mult = 2.0;
        else if (selectedBetType === "black" && resultCol === "black") mult = 2.0;
        else if (selectedBetType === "even" && resultNum !== 0 && resultNum % 2 === 0) mult = 2.0;
        else if (selectedBetType === "odd" && resultNum % 2 === 1) mult = 2.0;
        else if (selectedBetType === "zero" && resultNum === 0) mult = 30.0;

        if (mult > 0) {
          const win = Math.floor(bet * mult);
          await updateCloudBalance(win);
          msg.style.color = "var(--green)";
          msg.innerText = `🎉 出目「${resultNum}」的中 (${mult.toFixed(1)}x)！ +${win.toLocaleString()} G`;
        } else {
          msg.style.color = "var(--red)";
          msg.innerText = `💥 出目「${resultNum}」ハズレ... (-${bet.toLocaleString()} G)`;
        }
        btn.disabled = false;
      }
    }, 65);
  }

  // 🏆 ランキング読み込み
  async function loadRanking() {
    const box = document.getElementById("rank-list");
    box.innerHTML = "<div style='text-align:center; color:var(--muted); padding:16px;'>読み込み中...</div>";
    const { data, error } = await sb
      .from("casino_users")
      .select("mcid, balance")
      .order("balance", { ascending: false })
      .limit(20);

    if (error || !data) {
      box.innerHTML = "<div style='color:var(--red); text-align:center;'>読み込みに失敗しました</div>";
      return;
    }

    box.innerHTML = data.map((u, idx) => {
      const rank = idx + 1;
      let badge = `${rank}位`;
      let cls = "rank-badge";
      if (rank === 1) { badge = "🥇"; cls += " rank-1"; }
      else if (rank === 2) { badge = "🥈"; cls += " rank-2"; }
      else if (rank === 3) { badge = "🥉"; cls += " rank-3"; }

      const isMe = u.mcid === me ? " me" : "";
      return `
        <div class="rank-item${isMe}">
          <div class="rank-left">
            <span class="${cls}">${badge}</span>
            <span>${u.mcid}${u.mcid === me ? " <small style='color:var(--gold);'>(あなた)</small>" : ""}</span>
          </div>
          <div class="rank-bal">${Number(u.balance).toLocaleString()} G</div>
        </div>
      `;
    }).join("");
  }

  async function loadAllUsers() {
    const box = document.getElementById("adm-user-list");
    const { data } = await sb.from("casino_users").select("mcid, balance").order("balance", { ascending: false });
    if (!data) return;
    box.innerHTML = data.map(u => `
      <div class="user-row" onclick="document.getElementById('adm-target').value='${u.mcid}'">
        <span>👤 <strong>${u.mcid}</strong></span>
        <span style="color:var(--green);">${Number(u.balance).toLocaleString()} G</span>
      </div>
    `).join("");
  }

  async function adminAddBalance() {
    const target = document.getElementById("adm-target").value.trim();
    const diff = Number(document.getElementById("adm-amount").value);
    const msg = document.getElementById("adm-msg");
    if (!target || !diff) return;

    const { data: u } = await sb.from("casino_users").select("balance").eq("mcid", target).maybeSingle();
    if (!u) { msg.style.color = "var(--red)"; msg.innerText = "そのMCIDは見つかりません"; return; }

    const next = Math.max(0, Number(u.balance) + diff);
    await sb.from("casino_users").update({ balance: next }).eq("mcid", target);
    msg.style.color = "var(--green)";
    msg.innerText = `✅ ${target} の残高を ${next.toLocaleString()} G に更新しました`;
    if (target === me) await refreshBalance();
    await loadAllUsers();
  }

  async function notifyDiscord(text) {
    if (!DISCORD_WEBHOOK_URL) return false;
    try {
      await fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: text })
      });
      return true;
    } catch (e) { return false; }
  }

  async function sendDepositNotice() {
    const type = document.getElementById("req-type").value;
    const amount = Number(document.getElementById("req-amount").value);
    const msg = document.getElementById("req-msg");
    const btn = document.getElementById("req-btn");

    if (amount <= 0) return;
    await refreshBalance();
    if (type.includes("出金") && amount > myBalance) {
      msg.style.color = "var(--red)";
      msg.innerText = "残高不足です";
      return;
    }

    btn.disabled = true;
    const payload = `━━━━━━━━━━━━━━\n**${type}**\n👤 MCID: \`${me}\`\n💵 金額: **${amount.toLocaleString()} G**\n━━━━━━━━━━━━━━`;
    const ok = await notifyDiscord(payload);
    if (ok) {
      if (type.includes("出金")) await updateCloudBalance(-amount);
      msg.style.color = "var(--green)";
      msg.innerText = "✅ 運営のDiscordに通知しました！";
    } else {
      msg.style.color = "var(--gold)";
      msg.innerText = "⚠️ Webhook URLが未設定か送信に失敗しました";
    }
    btn.disabled = false;
  }

  if (me) startApp();
</script>
</body>
</html>
