
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スロット[Re]</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #20283d 0%, #0b0f1b 55%, #05070d 100%);
  color: #fff;
  font-family: Arial, "Noto Sans JP", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game {
  width: 760px;
  max-width: 95vw;
  background: #111827;
  border: 2px solid #394866;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 0 35px rgba(0,0,0,.6);
}

/* タイトル */
.title {
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #8e9ab5;
  font-size: 13px;
  margin-bottom: 18px;
}

/* 状態 */
.status {
  background: #1b2335;
  border: 1px solid #34405c;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

.status-name {
  font-size: 22px;
  font-weight: bold;
  color: #d7ddff;
}

.status-info {
  margin-top: 7px;
  color: #9da9c4;
  font-size: 14px;
}

/* ボーナス情報 */
.bonus-info {
  display: none;
  background: #171f31;
  border: 1px solid #3c4b6b;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

.bonus-title {
  font-size: 21px;
  font-weight: bold;
}

.bonus-count {
  margin-top: 8px;
  font-size: 17px;
}

.bonus-medals {
  margin-top: 5px;
  color: #aeb9d4;
}

/* リール */
.reels {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}

.reel {
  width: 150px;
  height: 120px;
  background: linear-gradient(#f5f5f5, #c9c9c9);
  border: 5px solid #59657c;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #111;
  font-size: 34px;
  font-weight: bold;
  box-shadow:
    inset 0 0 15px rgba(0,0,0,.3),
    0 5px 15px rgba(0,0,0,.4);
}

/* START */
.start {
  width: 100%;
  height: 65px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(#6675ff, #4050d7);
  color: white;
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 0 #2935a0;
}

.start:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #2935a0;
}

/* メッセージ */
.message {
  min-height: 70px;
  margin-top: 16px;
  background: #181f30;
  border: 1px solid #303c57;
  border-radius: 10px;
  padding: 14px;
  text-align: center;
  font-size: 17px;
  color: #dfe5ff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 特殊メッセージ */
.message.hot {
  color: #ffd95a;
  border-color: #806b25;
  background: #211f16;
}

.message.void {
  color: #e1b7ff;
  border-color: #704b8e;
  background: #20182b;
}

/* ボーナス一覧 */
.section-title {
  margin-top: 22px;
  margin-bottom: 10px;
  color: #b9c4ff;
  font-size: 18px;
  font-weight: bold;
}

.bonus-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.bonus {
  background: #1a2233;
  border: 1px solid #303b55;
  border-radius: 9px;
  padding: 12px;
}

.bonus-name {
  font-weight: bold;
  font-size: 15px;
}

.bonus-game {
  color: #8e9ab5;
  font-size: 13px;
  margin-top: 5px;
}

/* 履歴 */
.history {
  margin-top: 15px;
  background: #0d1320;
  border-radius: 10px;
  padding: 10px;
  max-height: 150px;
  overflow-y: auto;
}

.history div {
  padding: 5px;
  border-bottom: 1px solid #202a3d;
  color: #9da9c4;
  font-size: 13px;
}

.reset {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  background: #242d42;
  color: #aeb8d0;
  border: 1px solid #3b4762;
  border-radius: 8px;
  cursor: pointer;
}

/* 演出 */
@keyframes flash {
  0%,100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.04);
  }
}

.hot-effect {
  animation: flash .35s ease-in-out 2;
}

@media (max-width: 600px) {

  .game {
    padding: 14px;
  }

  .reel {
    width: 30%;
    height: 90px;
    font-size: 23px;
  }

  .bonus-list {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="title">
    スロット[Re]
  </div>

  <div class="subtitle">
    Bonus / Void / Replay Chance
  </div>

  <!-- 状態 -->
  <div class="status">

    <div class="status-name" id="stateName">
      通常時
    </div>

    <div class="status-info" id="stateInfo">
      小役を消化しながらボーナスを抽選
    </div>

  </div>

  <!-- ボーナス情報 -->
  <div class="bonus-info" id="bonusInfo">

    <div class="bonus-title" id="bonusTitle">
      ボーナス
    </div>

    <div class="bonus-count" id="bonusCount">
      100枚 × 5回
    </div>

    <div class="bonus-medals" id="bonusMedals">
      獲得枚数：0枚
    </div>

  </div>

  <!-- リール -->
  <div class="reels">

    <div class="reel" id="reel1">
      7
    </div>

    <div class="reel" id="reel2">
      BAR
    </div>

    <div class="reel" id="reel3">
      7
    </div>

  </div>

  <button
    class="start"
    id="startButton"
    onclick="play()">
    START
  </button>

  <div class="message" id="message">
    STARTを押してゲーム開始
  </div>

  <!-- ボーナス -->
  <div class="section-title">
    ボーナス
  </div>

  <div class="bonus-list">

    <div class="bonus">
      <div class="bonus-name">
        レギュラー
      </div>
      <div class="bonus-game">
        100枚 × 5回
      </div>
    </div>

    <div class="bonus">
      <div class="bonus-name">
        リーフィンド
      </div>
      <div class="bonus-game">
        100枚 × 5回
      </div>
    </div>

    <div class="bonus">
      <div class="bonus-name">
        ダストロック
      </div>
      <div class="bonus-game">
        100枚 × 5回
      </div>
    </div>

    <div class="bonus">
      <div class="bonus-name">
        書物の怨念
      </div>
      <div class="bonus-game">
        100枚 × 5回
      </div>
    </div>

  </div>

  <!-- 履歴 -->
  <div class="section-title">
    ゲーム履歴
  </div>

  <div class="history" id="history">
    <div>ゲーム開始</div>
  </div>

  <button
    class="reset"
    onclick="resetGame()">
    リセット
  </button>

</div>


<script>

/* =========================
   ゲーム状態
========================= */

let state = "normal";

let bonusName = "";

let bonusRemaining = 0;

let bonusTotal = 0;

let bonusMedals = 0;

let remainingGames = 0;


/* =========================
   ボーナス種類
========================= */

const bonuses = [

  {
    name: "レギュラー"
  },

  {
    name: "リーフィンド"
  },

  {
    name: "ダストロック"
  },

  {
    name: "書物の怨念"
  }

];


/* =========================
   START
========================= */

function play() {

  if (state === "normal") {

    normalGame();

    return;
  }

  if (state === "bonus") {

    bonusGame();

    return;
  }

  if (state === "void") {

    voidGame();

    return;
  }

  if (state === "replay30") {

    replayChanceGame();

    return;
  }

  if (state === "cz") {

    czGame();

    return;
  }

  if (state === "replayInfinite") {

    infiniteReplayGame();

    return;
  }

}


/* =========================
   通常時
========================= */

function normalGame() {

  const r = Math.random();


  /* チェリー */

  if (r < 0.025) {

    setReels(
      "🍒",
      "🍒",
      "🍒"
    );

    message(
      "チェリー！<br>チャンス役！"
    );

    addHistory(
      "通常時：チェリー"
    );

    return;
  }


  /* メロン */

  if (r < 0.05) {

    setReels(
      "🍈",
      "🍈",
      "🍈"
    );

    message(
      "メロン！<br>チャンス役！"
    );

    addHistory(
      "通常時：メロン"
    );

    return;
  }


  /* ボーナス */

  if (r < 0.065) {

    startBonus();

    return;
  }


  /* ハズレ */

  setReels(
    "7",
    "BAR",
    "🍒"
  );

  message(
    "ハズレ"
  );

  addHistory(
    "通常時：ハズレ"
  );

}


/* =========================
   ボーナス開始
========================= */

function startBonus() {

  const bonus =
    bonuses[
      Math.floor(
        Math.random() *
        bonuses.length
      )
    ];


  state = "bonus";

  bonusName = bonus.name;

  /*
    100枚 × 5回
  */

  bonusRemaining = 5;

  bonusTotal = 5;

  bonusMedals = 0;


  setState(
    "ボーナス",
    bonusName + "　100枚 × " +
    bonusRemaining + "回"
  );


  showBonusInfo();


  setReels(
    "BONUS",
    "BONUS",
    "BONUS"
  );


  message(
    "🎰 " +
    bonusName +
    "突入！<br>" +
    "100枚 × 5回"
  );


  addHistory(
    "ボーナス突入：" +
    bonusName
  );

}


/* =========================
   ボーナス中
========================= */

function bonusGame() {

  /*
    1回につき100枚
  */

  bonusRemaining--;

  bonusMedals += 100;


  setReels(
    "100",
    "枚",
    "GET"
  );


  updateBonusInfo();


  /*
    Void昇格
    約1%
  */

  if (Math.random() < 0.01) {

    state = "void";

    remainingGames = 100;


    hideBonusInfo();


    setState(
      "Voidボーナス",
      "100G"
    );


    setReels(
      "VOID",
      "VOID",
      "VOID"
    );


    message(
      "👑 <b>VOID BONUS昇格！</b><br>" +
      "100GのVoidボーナスへ！"
    );


    document
      .getElementById("message")
      .classList.add("void");


    addHistory(
      "🔥 ボーナス中 → Void昇格！"
    );


    return;
  }


  /*
    通常追加
    約10%
  */

  if (Math.random() < 0.10) {

    bonusRemaining++;

    bonusTotal++;


    setState(
      "ボーナス",
      bonusName +
      "　追加BONUS！"
    );


    message(
      "⚡ <b>BONUS CHANCE!</b><br>" +
      "+100枚追加！"
    );


    document
      .getElementById("message")
      .classList.add("hot");


    updateBonusInfo();


    addHistory(
      "BONUS CHANCE → +100枚"
    );


    setTimeout(() => {

      document
        .getElementById("message")
        .classList.remove("hot");

    }, 500);


    /*
      追加されたので終了判定しない
    */

    return;
  }


  /*
    大追加
    約2%
  */

  if (Math.random() < 0.02) {

    bonusRemaining += 5;

    bonusTotal += 5;


    setState(
      "ボーナス",
      bonusName +
      "　BIG BONUS CHANCE！"
    );


    message(
      "🔥 <b>BIG BONUS CHANCE!!</b><br>" +
      "+500枚追加！"
    );


    document
      .getElementById("message")
      .classList.add("hot");


    updateBonusInfo();


    addHistory(
      "BIG BONUS CHANCE → +500枚"
    );


    setTimeout(() => {

      document
        .getElementById("message")
        .classList.remove("hot");

    }, 500);


    return;
  }


  /*
    通常のボーナス中
  */

  message(
    "💰 100枚獲得！<br>" +
    "残り " +
    bonusRemaining +
    "回"
  );


  addHistory(
    "ボーナス：+100枚"
  );


  /*
    ボーナス終了
  */

  if (bonusRemaining <= 0) {

    finishBonus();

  }

}


/* =========================
   ボーナス終了
========================= */

function finishBonus() {

  state = "replay30";

  remainingGames = 30;


  hideBonusInfo();


  setState(
    "リプレイ確変",
    "30G"
  );


  setReels(
    "REPLAY",
    "REPLAY",
    "REPLAY"
  );


  message(
    "🎉 ボーナス終了！<br>" +
    "獲得枚数：" +
    bonusMedals +
    "枚<br>" +
    "リプレイ確変30Gへ！"
  );


  addHistory(
    "ボーナス終了：" +
    bonusMedals +
    "枚"
  );

}


/* =========================
   Voidボーナス
========================= */

function voidGame() {

  remainingGames--;


  /*
    Void中ゲーム数上乗せ
  */

  if (Math.random() < 0.02) {

    remainingGames += 10;


    message(
      "👑 Voidボーナス<br>" +
      "ゲーム数上乗せ！<br>" +
      "+10G"
    );


    addHistory(
      "Void：+10G"
    );


    return;
  }


  setReels(
    "VOID",
    randomSymbol(),
    "VOID"
  );


  message(
    "👑 Voidボーナス中<br>" +
    "残り " +
    remainingGames +
    "G"
  );


  if (remainingGames <= 0) {

    state =
      "replayInfinite";


    setState(
      "リプレイ確変（無限）",
      "終了条件なし"
    );


    setReels(
      "REPLAY",
      "REPLAY",
      "REPLAY"
    );


    message(
      "👑 Voidボーナス終了！<br>" +
      "♾️ リプレイ確変（無限）へ！"
    );


    addHistory(
      "Void終了 → 無限リプレイ確変"
    );

  }

}


/* =========================
   リプレイ確変30G
========================= */

function replayChanceGame() {

  remainingGames--;


  const r = Math.random();


  /*
    ボーナス
  */

  if (r < 0.02) {

    startBonus();

    return;
  }


  /*
    CZ
  */

  if (r < 0.10) {

    state = "cz";

    remainingGames = 5;


    setState(
      "CZ",
      "5G"
    );


    setReels(
      "CZ",
      "CZ",
      "CZ"
    );


    message(
      "⚡ CZ突入！<br>" +
      "5G間のチャンス！"
    );


    addHistory(
      "CZ突入"
    );


    return;
  }


  /*
    リプレイ
  */

  setReels(
    "REPLAY",
    "REPLAY",
    "BAR"
  );


  message(
    "リプレイ確変中<br>" +
    "残り " +
    remainingGames +
    "G"
  );


  if (remainingGames <= 0) {

    state = "normal";


    setState(
      "通常時",
      "小役を消化しながらボーナスを抽選"
    );


    message(
      "リプレイ確変終了<br>" +
      "通常時へ"
    );


    addHistory(
      "リプレイ確変終了"
    );

  }

}


/* =========================
   CZ
========================= */

function czGame() {

  remainingGames--;


  /*
    CZ成功率13%
  */

  if (Math.random() < 0.13) {

    state =
      "replayInfinite";


    setState(
      "リプレイ確変（無限）",
      "終了条件なし"
    );


    setReels(
      "REPLAY",
      "REPLAY",
      "REPLAY"
    );


    message(
      "🔥 <b>CZ成功！</b><br>" +
      "♾️ リプレイ確変（無限）へ！"
    );


    addHistory(
      "CZ成功 → 無限リプレイ確変"
    );


    return;
  }


  setReels(
    "REPLAY",
    "7",
    "BAR"
  );


  message(
    "CZ中……<br>" +
    "残り " +
    remainingGames +
    "G"
  );


  if (remainingGames <= 0) {

    state = "normal";


    setState(
      "通常時",
      "小役を消化しながらボーナスを抽選"
    );


    message(
      "CZ終了<br>" +
      "通常時へ"
    );


    addHistory(
      "CZ失敗"
    );

  }

}


/* =========================
   無限リプレイ確変
========================= */

function infiniteReplayGame() {

  const r = Math.random();


  /*
    Void
  */

  if (r < 0.04) {

    state = "void";

    remainingGames = 100;


    setState(
      "Voidボーナス",
      "100G"
    );


    setReels(
      "VOID",
      "VOID",
      "VOID"
    );


    message(
      "👑 <b>VOID BONUS！</b>"
    );


    addHistory(
      "無限リプレイ確変 → Void"
    );


    return;
  }


  /*
    通常ボーナス
  */

  if (r < 0.08) {

    startBonus();

    return;
  }


  /*
    リプレイ
  */

  setReels(
    "REPLAY",
    "REPLAY",
    "REPLAY"
  );


  message(
    "♾️ リプレイ確変（無限）<br>" +
    "終了条件なし"
  );


  addHistory(
    "無限リプレイ確変：リプレイ"
  );

}


/* =========================
   ボーナス表示
========================= */

function showBonusInfo() {

  const box =
    document.getElementById(
      "bonusInfo"
    );

  box.style.display = "block";

  updateBonusInfo();

}


/* =========================
   ボーナス情報更新
========================= */

function updateBonusInfo() {

  document.getElementById(
    "bonusTitle"
  ).textContent =
    bonusName + " BONUS";


  document.getElementById(
    "bonusCount"
  ).textContent =
    "100枚 × " +
    bonusRemaining +
    "回";


  document.getElementById(
    "bonusMedals"
  ).textContent =
    "獲得枚数：" +
    bonusMedals +
    "枚";


}


/* =========================
   ボーナス表示を隠す
========================= */

function hideBonusInfo() {

  document.getElementById(
    "bonusInfo"
  ).style.display = "none";

}


/* =========================
   リール
========================= */

function setReels(a, b, c) {

  document.getElementById(
    "reel1"
  ).textContent = a;

  document.getElementById(
    "reel2"
  ).textContent = b;

  document.getElementById(
    "reel3"
  ).textContent = c;

}


/* =========================
   ランダム図柄
========================= */

function randomSymbol() {

  const symbols = [
    "7",
    "BAR",
    "🍒",
    "🍈",
    "REPLAY"
  ];


  return symbols[
    Math.floor(
      Math.random() *
      symbols.length
    )
  ];

}


/* =========================
   状態変更
========================= */

function setState(name, info) {

  document.getElementById(
    "stateName"
  ).textContent = name;


  document.getElementById(
    "stateInfo"
  ).textContent = info;

}


/* =========================
   メッセージ
========================= */

function message(text) {

  document.getElementById(
    "message"
  ).innerHTML = text;

}


/* =========================
   履歴
========================= */

function addHistory(text) {

  const history =
    document.getElementById(
      "history"
    );


  const item =
    document.createElement(
      "div"
    );


  item.textContent = text;


  history.prepend(item);

}


/* =========================
   リセット
========================= */

function resetGame() {

  state = "normal";

  bonusName = "";

  bonusRemaining = 0;

  bonusTotal = 0;

  bonusMedals = 0;

  remainingGames = 0;


  hideBonusInfo();


  setState(
    "通常時",
    "小役を消化しながらボーナスを抽選"
  );


  setReels(
    "7",
    "BAR",
    "7"
  );


  message(
    "STARTを押してゲーム開始"
  );


  document.getElementById(
    "history"
  ).innerHTML =
    "<div>ゲームリセット</div>";

}

</script>

</body>
</html>
