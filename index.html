<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG CASINO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f111a;
    --card: #171a26;
    --dark: #0b0d14;
    --border: #282c3f;
    --gold: #f5b942;
    --green: #10b981;
    --red: #dc2626;
    --blue: #3b82f6;
    --purple: #a855f7;
    --pink: #ec4899;
    --text: #f8fafc;
    --muted: #8b92a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 10px;
  }
  .hidden { display: none !important; }

  .auth-card {
    width: 100%;
    max-width: 380px;
    margin-top: 40px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 22px;
  }
  .auth-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: var(--dark);
    padding: 4px;
    border-radius: 8px;
  }
  .auth-tab {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
    cursor: pointer;
  }
  .auth-tab.active { background: var(--gold); color: #111; }
  .label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; font-weight: bold; }
  .input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--dark);
    color: var(--text);
    font-size: 0.95rem;
  }
  .btn-main {
    width: 100%;
    padding: 12px 8px;
    border: none;
    border-radius: 8px;
    background: var(--gold);
    color: #111;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-main:disabled { background: #2c3146 !important; color: var(--muted) !important; cursor: not-allowed; }
  .btn-purple { background: var(--purple) !important; color: #fff !important; }
  .btn-pink { background: var(--pink) !important; color: #fff !important; }
  .btn-red { background: var(--red) !important; color: #fff !important; }
  .btn-green { background: var(--green) !important; color: #052e16 !important; }

  .app-wrap { width: 100%; max-width: 560px; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .bal { font-weight: 800; font-size: 0.95rem; }
  .bal span { color: var(--green); font-size: 1.15rem; }
  .mini-btn {
    background: #222638;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .mini-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1;
    min-width: 72px;
    padding: 10px 4px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    text-align: center;
  }
  .tab.active { background: var(--gold); color: #111; border-color: var(--gold); }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 12px;
    text-align: center;
  }
  .msg { margin-top: 10px; font-size: 0.88rem; font-weight: 700; min-height: 22px; }

  /* ==========================================
     🎰 オリジナル 1/500 RUSH スロット用スタイル
     ========================================== */
  .slot-machine {
    background: linear-gradient(180deg, #131624 0%, #090b12 100%);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 14px 10px;
    margin-bottom: 12px;
    box-shadow: 0 0 24px rgba(245, 185, 66, 0.15);
    transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
  }
  .slot-machine.rush-mode {
    background: linear-gradient(180deg, #3b0712 0%, #140509 100%);
    border-color: #f43f5e;
    box-shadow: 0 0 32px rgba(244, 63, 94, 0.55);
  }
  .slot-machine.chance-mode {
    background: linear-gradient(180deg, #2e1065 0%, #0f0722 100%);
    border-color: var(--purple);
    box-shadow: 0 0 28px rgba(168, 85, 247, 0.5);
  }

  .slot-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.45);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    font-weight: 800;
    margin-bottom: 10px;
  }
  .mode-badge {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 900;
    background: #222638;
    color: var(--gold);
  }
  .rush-mode .mode-badge {
    background: #f43f5e;
    color: #fff;
    animation: pulseBadge 0.8s infinite alternate;
  }
  @keyframes pulseBadge {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  .slot-lcd {
    background: #05070c;
    border: 2px solid #2c3146;
    border-radius: 10px;
    padding: 12px 8px;
    margin-bottom: 12px;
  }
  .lcd-banner {
    font-size: 0.82rem;
    font-weight: 900;
    color: var(--gold);
    min-height: 20px;
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }
  .slot-reels {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 6px 0;
  }
  .s-reel {
    width: 88px;
    height: 104px;
    background: linear-gradient(180deg, #1b1f30 0%, #0e101a 50%, #1b1f30 100%);
    border: 2px solid var(--gold);
    border-radius: 10px;
    font-size: 3.1rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
  }
  .rush-mode .s-reel {
    border-color: #fb7185;
    box-shadow: 0 0 14px rgba(244, 63, 94, 0.45);
  }
  .rush-stats-row {
    display: flex;
    justify-content: space-around;
    background: rgba(244, 63, 94, 0.15);
    border: 1px solid rgba(244, 63, 94, 0.4);
    border-radius: 8px;
    padding: 6px;
    margin-top: 8px;
    font-size: 0.8rem;
  }

  .auto-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  .spec-box {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 0.76rem;
    color: var(--muted);
    line-height: 1.65;
    text-align: left;
  }

  /* ==========================================
     🎁 複数ガチャ切り替え＆アイテムガチャ用スタイル
     ========================================== */
  .gacha-selector {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .gacha-sel-btn {
    flex: 1;
    min-width: 140px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--dark);
    color: var(--muted);
    font-weight: 800;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .gacha-sel-btn.active {
    background: rgba(245, 185, 66, 0.15);
    border-color: var(--gold);
    color: var(--gold);
  }

  .gacha-stage {
    min-height: 155px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .gacha-box-icon {
    font-size: 4rem;
    transition: transform 0.1s;
  }
  @keyframes shake {
    0%, 100% { transform: rotate(0deg) scale(1.05); }
    25% { transform: rotate(-12deg) scale(1.1); }
    75% { transform: rotate(12deg) scale(1.1); }
  }
  .shaking { animation: shake 0.18s infinite; }

  .gacha-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    width: 100%;
  }
  .gacha-summary-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .gacha-card {
    background: #171a26;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 7px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    font-size: 0.78rem;
    font-weight: 800;
  }
  .gacha-card .emoji { font-size: 1.5rem; flex-shrink: 0; }
  .rarity-MISS { border-color: #334155; color: var(--muted); }
  .rarity-3等 { border-color: var(--blue); color: #60a5fa; box-shadow: 0 0 8px rgba(59,130,246,0.25); }
  .rarity-2等 { border-color: var(--purple); color: #c084fc; box-shadow: 0 0 12px rgba(168,85,247,0.4); }
  .rarity-1等 {
    border-color: var(--gold);
    background: linear-gradient(135deg, rgba(245,185,66,0.28), rgba(244,63,94,0.25));
    color: #fde047;
    box-shadow: 0 0 18px rgba(245,185,66,0.7);
  }

  .gacha-rates {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.7;
    text-align: left;
  }
  .gacha-btns {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  /* 獲得アイテムインベントリ */
  .inv-box {
    margin-top: 14px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: left;
  }
  .inv-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--gold);
  }
  .inv-list {
    display: flex;
    flex-direction: column;
    gap: 6px
