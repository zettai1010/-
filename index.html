<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>777 CASINO SLOT</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #333, #050505);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: gold;
    font-size: 42px;
    text-shadow: 0 0 15px red;
}

.casino {
    width: 420px;
    max-width: 90%;
    margin: 30px auto;
    padding: 25px;
    background: linear-gradient(#b00000, #500000);
    border: 8px solid gold;
    border-radius: 25px;
    box-shadow: 0 0 30px gold;
}

.reels {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 25px 0;
}

.reel {
    width: 100px;
    height: 110px;
    background: white;
    color: black;
    border: 6px solid #aaa;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
    box-shadow: inset 0 0 15px #555;
}

button {
    padding: 15px 30px;
    margin: 8px;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: 3px solid gold;
    cursor: pointer;
}

#start {
    background: red;
    color: white;
    box-shadow: 0 0 15px red;
}

#adminLogin {
    background: #222;
    color: gold;
}

#settingArea {
    display: none;
    margin: 15px 0;
    padding: 12px;
    border: 2px solid gold;
    border-radius: 10px;
    background: rgba(0,0,0,0.4);
}

#settingButton {
    background: #222;
    color: gold;
}

#logoutButton {
    background: #555;
    color: white;
}

#adminStatus {
    font-size: 16px;
    color: #aaa;
    margin: 8px;
}

#coins {
    font-size: 25px;
    color: gold;
}

#result {
    font-size: 22px;
    min-height: 35px;
}

/* 777 JACKPOT */
#jackpotEffect {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255, 215, 0, 0.25);
    z-index: 999;
    pointer-events: none;
}

#jackpotEffect.show {
    display: flex;
    align-items: center;
    justify-content: center;
    animation: flash 0.15s infinite alternate;
}

.jackpotText {
    font-size: 80px;
    font-weight: bold;
    color: gold;
    text-shadow:
        0 0 10px red,
        0 0 30px red,
        0 0 60px gold;
    animation: jackpotBig 0.5s infinite alternate;
}

@keyframes flash {
    from {
        background: rgba(255, 0, 0, 0.15);
    }

    to {
        background: rgba(255, 215, 0, 0.5);
    }
}

@keyframes jackpotBig {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.3);
    }
}

.jackpotReel {
    animation: reelFlash 0.2s infinite alternate;
}

@keyframes reelFlash {
    from {
        box-shadow:
            0 0 10px gold,
            inset 0 0 15px #555;
    }

    to {
        box-shadow:
            0 0 50px red,
            0 0 80px gold,
            inset 0 0 15px #555;
    }
}
</style>
</head>

<body>

<h1>🎰 777 CASINO 🎰</h1>

<div class="casino">

    <div id="coins">
        💰 コイン：100
    </div>

    <!-- 管理者状態 -->
    <div id="adminStatus">
        🔒 管理者モード：OFF
    </div>

    <!-- 管理者ログイン -->
    <button id="adminLogin">
        🔐 管理者ログイン
    </button>

    <!--
        ここは最初から完全非表示。
        管理者ログイン成功時だけ表示される。
    -->
    <div id="settingArea">

        <div>
            ⚙️ 現在の設定：
            <span id="settingNumber"></span>
        </div>

        <button id="settingButton">
            ⚙️ 設定変更
        </button>

        <button id="logoutButton">
            🔓 ログアウト
        </button>

    </div>

    <div class="reels">

        <div class="reel" id="reel1">7</div>
        <div class="reel" id="reel2">7</div>
        <div class="reel" id="reel3">7</div>

    </div>

    <button id="start">
        START
    </button>

    <div id="result">
        スタートを押してね！
    </div>

</div>

<!-- 777専用演出 -->
<div id="jackpotEffect">
    <div class="jackpotText">
        🎉 777 JACKPOT!! 🎉
    </div>
</div>

<script>

/* =========================
   図柄
========================= */

const symbols = [
    "🍒",
    "🍋",
    "🔔",
    "⭐",
    "🍊",
    "💎",
    "7"
];

/* =========================
   初期設定
========================= */

let setting = 1;
let coins = 100;
let isAdmin = false;

/* =========================
   管理者パスワード
========================= */

const ADMIN_PASSWORD = "777admin";

/* =========================
   設定別777確率
========================= */

const settingRates = {
    1: 0.001,
    2: 0.002,
    3: 0.003,
    4: 0.005,
    5: 0.008,
    6: 0.012
};

/* =========================
   HTML
========================= */

const coinsElement =
    document.getElementById("coins");

const settingArea =
    document.getElementById("settingArea");

const settingNumber =
    document.getElementById("settingNumber");

const result =
    document.getElementById("result");

const reel1 =
    document.getElementById("reel1");

const reel2 =
    document.getElementById("reel2");

const reel3 =
    document.getElementById("reel3");

const startButton =
    document.getElementById("start");

const adminLogin =
    document.getElementById("adminLogin");

const settingButton =
    document.getElementById("settingButton");

const logoutButton =
    document.getElementById("logoutButton");

const adminStatus =
    document.getElementById("adminStatus");

const jackpotEffect =
    document.getElementById("jackpotEffect");


/* =========================
   ランダム図柄
========================= */

function randomSymbol() {

    return symbols[
        Math.floor(
            Math.random() * symbols.length
        )
    ];

}


/* =========================
   管理者ログイン
========================= */

adminLogin.addEventListener(
    "click",
    function() {

        const password =
            prompt(
                "🔐 管理者パスワードを入力してください"
            );

        if (password === ADMIN_PASSWORD) {

            isAdmin = true;

            /* 設定を表示 */
            settingArea.style.display =
                "block";

            settingNumber.textContent =
                setting;

            adminStatus.textContent =
                "🔓 管理者モード：ON";

            adminStatus.style.color =
                "lime";

            adminLogin.style.display =
                "none";

            result.textContent =
                "✅ 管理者ログイン成功！";

        } else {

            result.textContent =
                "❌ パスワードが違います！";

        }

    }
);


/* =========================
   ログアウト
========================= */

logoutButton.addEventListener(
    "click",
    function() {

        isAdmin = false;

        /* 設定を完全に隠す */
        settingArea.style.display =
            "none";

        adminLogin.style.display =
            "inline-block";

        adminStatus.textContent =
            "🔒 管理者モード：OFF";

        adminStatus.style.color =
            "#aaa";

        result.textContent =
            "🔒 管理者モードを終了しました";

    }
);


/* =========================
   設定変更
========================= */

settingButton.addEventListener(
    "click",
    function() {

        if (!isAdmin) {
            return;
        }

        setting++;

        if (setting > 6) {
            setting = 1;
        }

        settingNumber.textContent =
            setting;

        result.textContent =
            "⚙️ 設定" +
            setting +
            "に変更しました！";

    }
);


/* =========================
   スロット
========================= */

function play() {

    if (coins <= 0) {

        result.textContent =
            "💸 コインがありません！";

        return;
    }

    coins--;

    let a = randomSymbol();
    let b = randomSymbol();
    let c = randomSymbol();


    /* =========================
       777抽選
    ========================= */

    if (
        Math.random()
        <
        settingRates[setting]
    ) {

        a = "7";
        b = "7";
        c = "7";

    }


    /* =========================
       リール表示
    ========================= */

    reel1.textContent = a;
    reel2.textContent = b;
    reel3.textContent = c;


    /* =========================
       777 JACKPOT
    ========================= */

    if (
        a === "7" &&
        b === "7" &&
        c === "7"
    ) {

        coins += 100;

        result.textContent =
            "🎉🎉 JACKPOT!! +100 🎉🎉";

        reel1.classList.add(
            "jackpotReel"
        );

        reel2.classList.add(
            "jackpotReel"
        );

        reel3.classList.add(
            "jackpotReel"
        );

        jackpotEffect.classList.add(
            "show"
        );

        setTimeout(
            function() {

                jackpotEffect.classList.remove(
                    "show"
                );

                reel1.classList.remove(
                    "jackpotReel"
                );

                reel2.classList.remove(
                    "jackpotReel"
                );

                reel3.classList.remove(
                    "jackpotReel"
                );

            },
            2500
        );

    }


    /* =========================
       3つ揃い
    ========================= */

    else if (
        a === b &&
        b === c
    ) {

        coins += 20;

        result.textContent =
            "🔥 3つ揃った！ +20";

    }


    /* =========================
       2つ揃い
    ========================= */

    else if (
        a === b ||
        b === c ||
        a === c
    ) {

        coins += 5;

        result.textContent =
            "✨ 2つ揃った！ +5";

    }


    /* =========================
       ハズレ
    ========================= */

    else {

        result.textContent =
            "💦 ハズレ！";

    }


    coinsElement.textContent =
        "💰 コイン：" + coins;

}


/* =========================
   START
========================= */

startButton.addEventListener(
    "click",
    play
);

</script>

</body>
</html>
