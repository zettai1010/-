<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG CASINO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f111a;
    --card: #171a26;
    --dark: #0b0d14;
    --border: #282c3f;
    --gold: #f5b942;
    --green: #10b981;
    --red: #ef4444;
    --text: #f8fafc;
    --muted: #8b92a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .hidden { display: none !important; }

  .auth-card {
    width: 100%;
    max-width: 380px;
    margin-top: 40px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 22px;
  }
  .auth-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: var(--dark);
    padding: 4px;
    border-radius: 8px;
  }
  .auth-tab {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
    cursor: pointer;
  }
  .auth-tab.active { background: var(--gold); color: #111; }
  .label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; font-weight: bold; }
  .input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--dark);
    color: var(--text);
    font-size: 0.95rem;
  }
  .btn-main {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--gold);
    color: #111;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn-main:disabled { background: #2c3146; color: var(--muted); cursor: not-allowed; }
  .btn-green { background: var(--green) !important; color: #052e16 !important; }

  .app-wrap { width: 100%; max-width: 500px; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 14px;
  }
  .bal { font-weight: 800; font-size: 0.95rem; }
  .bal span { color: var(--green); font-size: 1.15rem; }
  .mini-btn {
    background: #222638;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    flex: 1;
    min-width: 75px;
    padding: 10px 4px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .tab.active { background: var(--gold); color: #111; border-color: var(--gold); }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
  }
  .screen {
    height: 150px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.2rem;
    font-weight: 900;
    margin-bottom: 14px;
  }
  .crashed { color: var(--red); }
  .cashed { color: var(--green); }

  .reels { display: flex; justify-content: center; gap: 10px; margin: 14px 0; }
  .reel {
    width: 84px;
    height: 100px;
    background: var(--dark);
    border: 2px solid var(--gold);
    border-radius: 10px;
    font-size: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mines-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 10px; }
  .mines-top select { background: var(--dark); color: #fff; border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; }
  .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; max-width: 300px; margin: 0 auto 14px; }
  .tile {
    aspect-ratio: 1;
    background: #222638;
    border: 1px solid #2f354d;
    border-radius: 8px;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile.gem { background: rgba(16, 185, 129, 0.22); border-color: var(--green); }
  .tile.bomb { background: rgba(239, 68, 68, 0.22); border-color: var(--red); }
  .tile.dim { opacity: 0.4; }

  .bet-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .bet-input {
    width: 130px;
    padding: 9px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
  }
  .msg { margin-top: 12px; font-size: 0.88rem; font-weight: 700; min-height: 22px; }
  .user-list {
    max-height: 200px;
    overflow-y: auto;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    text-align: left;
    margin-top: 14px;
    font-size: 0.82rem;
  }
  .user-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 8px;
    border-bottom: 1px solid #1a1e2e;
    cursor: pointer;
  }
  .user-row:hover { background: #171a26; }
</style>
</head>
<body>

<!-- ログイン / 新規登録画面 -->
<div class="auth-card" id="login-view">
  <h2 style="margin:0 0 14px; color:var(--gold); text-align:center;">⚔️ RPG CASINO</h2>
  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-log" onclick="switchAuth('login')">ログイン</button>
    <button class="auth-tab" id="tab-reg" onclick="switchAuth('register')">新規登録</button>
  </div>

  <label class="label">MCID（統合版は先頭に BE_ ）</label>
  <input id="mcid" class="input" placeholder="例: Steve / BE_Steve">

  <label class="label">パスワード</label>
  <input id="pass" type="password" class="input" placeholder="••••••••">

  <div id="reg-extra" class="hidden">
    <label class="label">パスワード（確認用）</label>
    <input id="pass2" type="password" class="input" placeholder="もう一度入力">
  </div>

  <button class="btn-main" id="auth-submit" onclick="submitAuth()">ログイン</button>
  <div id="err" style="color:var(--red); font-size:0.8rem; text-align:center; margin-top:10px;"></div>
</div>

<!-- メイン画面 -->
<div class="app-wrap hidden" id="game-view">
  <div class="header">
    <div>
      <div style="font-weight:800; color:var(--gold); font-size:0.9rem;" id="u-name"></div>
      <div class="bal"><span id="bal">0</span> G <button class="mini-btn" style="padding:2px 6px; margin-left:4px;" onclick="refreshBalance()">🔄</button></div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="mini-btn" style="border-color:var(--gold); color:var(--gold);" onclick="tab('deposit', document.getElementById('dep-tab-btn'))">💰 入出金</button>
      <button class="mini-btn" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="tab('crash', this)">🚀 CRASH</button>
    <button class="tab" onclick="tab('slot', this)">🎰 SLOTS</button>
    <button class="tab" onclick="tab('mines', this)">💣 MINES</button>
    <button class="tab" id="dep-tab-btn" onclick="tab('deposit', this)">💰 入出金</button>
    <button class="tab hidden" id="admin-tab-btn" style="color:var(--gold);" onclick="tab('admin', this)">👑 管理</button>
  </div>

  <!-- 1. CRASH -->
  <div id="crash" class="panel">
    <div class="screen" id="mult">1.00x</div>
    <div class="bet-row">
      <input id="c-bet" type="number" class="bet-input" value="500" min="10">
      <button class="mini-btn" onclick="scale('c-bet', 0.5)">1/2</button>
      <button class="mini-btn" onclick="scale('c-bet', 2)">2x</button>
      <button class="mini-btn" onclick="maxB('c-bet')">MAX</button>
    </div>
    <button class="btn-main" id="c-btn" onclick="toggleCrash()">START</button>
    <div class="msg" id="c-msg"></div>
  </div>

  <!-- 2. SLOTS -->
  <div id="slot" class="panel hidden">
    <div class="reels">
      <div class="reel" id="r1">7️⃣</div>
      <div class="reel" id="r2">7️⃣</div>
      <div class="reel" id="r3">7️⃣</div>
    </div>
    <div style="font-size:0.76rem; color:var(--muted); margin-bottom:12px;">
      🍒 2.5x | 🍋 4x | 🍇 8x | 🔔 15x | 💎 40x | 7️⃣ 100x
    </div>
    <div class="bet-row">
      <input id="s-bet" type="number" class="bet-input" value="500" min="10">
      <button class="mini-btn" onclick="scale('s-bet', 0.5)">1/2</button>
      <button class="mini-btn" onclick="scale('s-bet', 2)">2x</button>
      <button class="mini-btn" onclick="maxB('s-bet')">MAX</button>
    </div>
    <button class="btn-main" id="s-btn" onclick="spinSlot()">SPIN</button>
    <div class="msg" id="s-msg"></div>
  </div>

  <!-- 3. MINES -->
  <div id="mines" class="panel hidden">
    <div class="mines-top">
      <div>爆弾数:
        <select id="b-num">
          <option value="1">1個</option>
          <option value="3" selected>3個</option>
          <option value="5">5個</option>
          <option value="10">10個</option>
        </select>
      </div>
      <div>現在倍率: <strong id="m-mult" style="color:var(--green);">1.00x</strong></div>
    </div>
    <div class="mines-grid" id="m-grid"></div>
    <div class="bet-row">
      <input id="m-bet" type="number" class="bet-input" value="500" min="10">
      <button class="mini-btn" onclick="scale('m-bet', 0.5)">1/2</button>
      <button class="mini-btn" onclick="scale('m-bet', 2)">2x</button>
      <button class="mini-btn" onclick="maxB('m-bet')">MAX</button>
    </div>
    <button class="btn-main" id="m-btn" onclick="toggleMines()">START</button>
    <div class="msg" id="m-msg"></div>
  </div>

  <!-- 4. 入出金申請 -->
  <div id="deposit" class="panel hidden">
    <h3 style="margin-top:0; color:var(--gold);">💰 入金・出金申請</h3>
    <label class="label" style="text-align:left;">申請タイプ</label>
    <select id="req-type" class="input">
      <option value="💰 入金申請">💰 入金（マイクラ → カジノ）</option>
      <option value="💸 出金申請">💸 出金（カジノ → マイクラ）</option>
    </select>
    <label class="label" style="text-align:left;">金額 (G)</label>
    <input id="req-amount" type="number" class="input" value="10000" min="100">
    <button class="btn-main" id="req-btn" onclick="sendDepositNotice()">📩 運営に通知を送る</button>
    <div class="msg" id="req-msg"></div>
  </div>

  <!-- 5. 運営専用管理パネル（ADMIN_MCIDでログイン時のみ表示） -->
  <div id="admin" class="panel hidden">
    <h3 style="margin-top:0; color:var(--gold);">👑 運営用：残高追加・操作</h3>
    <label class="label" style="text-align:left;">対象プレイヤーのMCID</label>
    <input id="adm-target" class="input" placeholder="下のリストからタップでも選択可">
    <label class="label" style="text-align:left;">増減金額（減らす場合はマイナス -1000）</label>
    <input id="adm-amount" type="number" class="input" value="10000">
    <button class="btn-main" onclick="adminAddBalance()">✅ 残高を反映する</button>
    <div class="msg" id="adm-msg"></div>
    <div class="user-list" id="adm-user-list">読み込み中...</div>
  </div>
</div>

<script>
  // ==========================================
  // sb_publishable_hzvWmXR05qO1F3n5Law-DA_kU4B4s_B
  // ==========================================
  const SUPABASE_URL = "https://vjbejlzlddaniyqmbvr.supabase.co";
  const SUPABASE_ANON_KEY = "ここに公開可能キー(sb_publishable_...)を貼る";
  const ADMIN_MCID = "ここにあなたのMCIDを貼る";
  const DISCORD_WEBHOOK_URL = "ここにDiscordのWebhook URLを貼る";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ME_KEY = "rpg_casino_cloud_mcid";
  let authMode = "login";
  let me = localStorage.getItem(ME_KEY);
  let myBalance = 0;

  function switchAuth(mode) {
    authMode = mode;
    document.getElementById("err").innerText = "";
    document.getElementById("tab-log").classList.toggle("active", mode === "login");
    document.getElementById("tab-reg").classList.toggle("active", mode === "register");
    document.getElementById("reg-extra").classList.toggle("hidden", mode === "login");
    document.getElementById("auth-submit").innerText = mode === "login" ? "ログイン" : "アカウントを新規作成";
  }

  async function submitAuth() {
    const id = document.getElementById("mcid").value.trim();
    const pw = document.getElementById("pass").value.trim();
    const pw2 = document.getElementById("pass2").value.trim();
    const err = document.getElementById("err");
    const btn = document.getElementById("auth-submit");

    if (!id || !pw) { err.innerText = "MCIDとパスワードを入力してください"; return; }
    btn.disabled = true;
    err.innerText = "通信中...";

    if (authMode === "register") {
      if (pw !== pw2) { err.innerText = "確認用パスワードが一致しません"; btn.disabled = false; return; }
      const { data: existing } = await sb.from("casino_users").select("mcid").eq("mcid", id).maybeSingle();
      if (existing) { err.innerText = "このMCIDはすでに登録されています"; btn.disabled = false; return; }

      const { error } = await sb.from("casino_users").insert({ mcid: id, password: pw, balance: 0 });
      if (error) { err.innerText = "登録エラー: " + error.message; btn.disabled = false; return; }
      notifyDiscord(`🆕 **新規登録**\nMCID: \`${id}\``);
    } else {
      const { data: user, error } = await sb.from("casino_users").select("*").eq("mcid", id).maybeSingle();
      if (error || !user) { err.innerText = "MCIDが見つかりません"; btn.disabled = false; return; }
      if (user.password !== pw) { err.innerText = "パスワードが違います"; btn.disabled = false; return; }
    }

    me = id;
    localStorage.setItem(ME_KEY, me);
    btn.disabled = false;
    err.innerText = "";
    await startApp();
  }

  async function startApp() {
    document.getElementById("login-view").classList.add("hidden");
    document.getElementById("game-view").classList.remove("hidden");
    document.getElementById("u-name").innerText = "MCID: " + me;
    if (me === ADMIN_MCID) {
      document.getElementById("admin-tab-btn").classList.remove("hidden");
    }
    await refreshBalance();
  }

  async function refreshBalance() {
    const { data } = await sb.from("casino_users").select("balance").eq("mcid", me).single();
    if (data) {
      myBalance = Number(data.balance);
      document.getElementById("bal").innerText = Math.floor(myBalance).toLocaleString();
    }
  }

  async function updateCloudBalance(diff) {
    await refreshBalance();
    const nextBal = Math.max(0, Math.floor(myBalance + diff));
    const { error } = await sb.from("casino_users").update({ balance: nextBal }).eq("mcid", me);
    if (!error) {
      myBalance = nextBal;
      document.getElementById("bal").innerText = myBalance.toLocaleString();
    }
  }

  function logout() {
    localStorage.removeItem(ME_KEY);
    location.reload();
  }

  function tab(name, btn) {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    ["crash", "slot", "mines", "deposit", "admin"].forEach(t => document.getElementById(t).classList.toggle("hidden", t !== name));
    if (name === "admin") loadAllUsers();
  }

  async function loadAllUsers() {
    const box = document.getElementById("adm-user-list");
    const { data } = await sb.from("casino_users").select("mcid, balance").order("balance", { ascending: false });
    if (!data) return;
    box.innerHTML = data.map(u => `
      <div class="user-row" onclick="document.getElementById('adm-target').value='${u.mcid}'">
        <span>👤 <strong>${u.mcid}</strong></span>
        <span style="color:var(--green);">${Number(u.balance).toLocaleString()} G</span>
      </div>
    `).join("");
  }

  async function adminAddBalance() {
    const target = document.getElementById("adm-target").value.trim();
    const diff = Number(document.getElementById("adm-amount").value);
    const msg = document.getElementById("adm-msg");
    if (!target || !diff) return;

    const { data: u } = await sb.from("casino_users").select("balance").eq("mcid", target).maybeSingle();
    if (!u) { msg.style.color = "var(--red)"; msg.innerText = "そのMCIDは見つかりません"; return; }

    const next = Math.max(0, Number(u.balance) + diff);
    await sb.from("casino_users").update({ balance: next }).eq("mcid", target);
    msg.style.color = "var(--green)";
    msg.innerText = `✅ ${target} の残高を ${next.toLocaleString()} G に更新しました`;
    if (target === me) await refreshBalance();
    await loadAllUsers();
  }

  async function notifyDiscord(text) {
    if (!DISCORD_WEBHOOK_URL) return false;
    try {
      await fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: text })
      });
      return true;
    } catch (e) { return false; }
  }

  async function sendDepositNotice() {
    const type = document.getElementById("req-type").value;
    const amount = Number(document.getElementById("req-amount").value);
    const msg = document.getElementById("req-msg");
    const btn = document.getElementById("req-btn");

    if (amount <= 0) return;
    await refreshBalance();
    if (type.includes("出金") && amount > myBalance) {
      msg.style.color = "var(--red)";
      msg.innerText = "残高不足です";
      return;
    }

    btn.disabled = true;
    const payload = `━━━━━━━━━━━━━━\n**${type}**\n👤 MCID: \`${me}\`\n💵 金額: **${amount.toLocaleString()} G**\n━━━━━━━━━━━━━━`;
    const ok = await notifyDiscord(payload);
    if (ok) {
      if (type.includes("出金")) await updateCloudBalance(-amount);
      msg.style.color = "var(--green)";
      msg.innerText = "✅ 運営のDiscordに通知しました！";
    } else {
      msg.style.color = "var(--gold)";
      msg.innerText = "⚠️ Webhook URLが未設定か送信に失敗しました";
    }
    btn.disabled = false;
  }

  function scale(id, f) { const e = document.getElementById(id); e.value = Math.max(10, Math.floor(e.value * f)); }
  function maxB(id) { document.getElementById(id).value = Math.max(10, Math.floor(myBalance)); }

  // 1. CRASH (RTP 99.5%)
  let cRun = false, cMult = 1, cTarget = 1, cBet = 0, cIv = null;
  async function toggleCrash() {
    const btn = document.getElementById("c-btn"), el = document.getElementById("mult"), msg = document.getElementById("c-msg");
    if (!cRun) {
      await refreshBalance();
      cBet = Number(document.getElementById("c-bet").value);
      if (cBet <= 0 || cBet > myBalance) { msg.innerText = "残高不足です"; return; }
      await updateCloudBalance(-cBet);
      const r = Math.random();
      cTarget = r < 0.005 ? 1.00 : Math.max(1.01, 0.995 / (1 - r));
      if (cTarget <= 1.00) {
        el.innerText = "1.00x"; el.className = "screen crashed";
        msg.innerText = `💥 即爆発 (-${cBet.toLocaleString()} G)`;
        return;
      }
      cRun = true; cMult = 1.00; el.className = "screen"; msg.innerText = "";
      btn.innerText = "CASH OUT (利確)"; btn.classList.add("btn-green");
      cIv = setInterval(() => {
        cMult += 0.01 * (cMult * 0.55);
        if (cMult >= cTarget) {
          clearInterval(cIv); cRun = false;
          el.innerText = cTarget.toFixed(2) + "x"; el.className = "screen crashed";
          msg.innerText = `💥 ${cTarget.toFixed(2)}x で爆発 (-${cBet.toLocaleString()} G)`;
          btn.innerText = "START"; btn.classList.remove("btn-green");
        } else el.innerText = cMult.toFixed(2) + "x";
      }, 50);
    } else {
      clearInterval(cIv); cRun = false;
      const win = Math.floor(cBet * cMult);
      await updateCloudBalance(win);
      el.className = "screen cashed";
      msg.innerText = `🎉 ${cMult.toFixed(2)}x 利確！ +${win.toLocaleString()} G`;
      btn.innerText = "START"; btn.classList.remove("btn-green");
    }
  }

  // 2. SLOTS (RTP 99.5%)
  const syms = ["🍒","🍋","🍇","🔔","💎","7️⃣"];
  const pays = {"🍒":2.5,"🍋":4,"🍇":8,"🔔":15,"💎":40,"7️⃣":100};
  async function spinSlot() {
    const bet = Number(document.getElementById("s-bet").value), msg = document.getElementById("s-msg"), btn = document.getElementById("s-btn");
    await refreshBalance();
    if (bet <= 0 || bet > myBalance) { msg.innerText = "残高不足です"; return; }
    await updateCloudBalance(-bet);
    btn.disabled = true; msg.innerText = "回転中...";
    let t = 0;
    const iv = setInterval(async () => {
      ["r1","r2","r3"].forEach(id => document.getElementById(id).innerText = syms[Math.floor(Math.random()*6)]);
      if (++t > 12) {
        clearInterval(iv);
        const r = Math.random() * 100;
        let res;
        if (r < 18.0) res = ["🍒","🍒","🍒"];
        else if (r < 25.0) res = ["🍋","🍋","🍋"];
        else if (r < 27.0) res = ["🍇","🍇","🍇"];
        else if (r < 27.4) res = ["🔔","🔔","🔔"];
        else if (r < 27.475) res = ["💎","💎","💎"];
        else if (r < 27.49) res = ["7️⃣","7️⃣","7️⃣"];
        else {
          res = [syms[Math.floor(Math.random()*6)], syms[Math.floor(Math.random()*6)], syms[Math.floor(Math.random()*6)]];
          while (res[0] === res[1] && res[1] === res[2]) res[2] = syms[Math.floor(Math.random()*6)];
        }
        ["r1","r2","r3"].forEach((id, i) => document.getElementById(id).innerText = res[i]);
        if (res[0] === res[1] && res[1] === res[2]) {
          const win = Math.floor(bet * pays[res[0]]);
          await updateCloudBalance(win);
          msg.innerText = `🎉 ${res[0]} 揃い (${pays[res[0]]}x)！ +${win.toLocaleString()} G`;
        } else msg.innerText = "ハズレ...";
        btn.disabled = false;
      }
    }, 55);
  }

  // 3. MINES (RTP 99.5%)
  let mRun = false, mBet = 0, bSet = new Set(), openCnt = 0, mCur = 1;
  const grid = document.getElementById("m-grid");
  for (let i = 0; i < 25; i++) {
    const b = document.createElement("button");
    b.className = "tile"; b.disabled = true;
    b.onclick = async () => {
      if (!mRun || b.disabled) return;
      const bNum = Number(document.getElementById("b-num").value);
      if (bSet.has(i)) {
        b.classList.add("bomb"); b.innerText = "💣";
        endMines(`💥 爆弾！ -${mBet.toLocaleString()} G`);
      } else {
        b.classList.add("gem"); b.innerText = "💎"; b.disabled = true;
        openCnt++;
        let p = 1;
        for (let k = 0; k < openCnt; k++) p *= (25 - bNum - k) / (25 - k);
        mCur = 0.995 / p;
        document.getElementById("m-mult").innerText = mCur.toFixed(2) + "x";
        if (openCnt === 25 - bNum) {
          const w = Math.floor(mBet * mCur);
          await updateCloudBalance(w);
          endMines(`👑 全開け達成！ +${w.toLocaleString()} G`);
        }
      }
    };
    grid.appendChild(b);
  }

  async function toggleMines() {
    const btn = document.getElementById("m-btn"), msg = document.getElementById("m-msg");
    if (!mRun) {
      await refreshBalance();
      mBet = Number(document.getElementById("m-bet").value);
      if (mBet <= 0 || mBet > myBalance) { msg.innerText = "残高不足です"; return; }
      await updateCloudBalance(-mBet);
      const bNum = Number(document.getElementById("b-num").value);
      bSet.clear();
      while (bSet.size < bNum) bSet.add(Math.floor(Math.random() * 25));
      mRun = true; openCnt = 0; mCur = 1.00;
      document.getElementById("m-mult").innerText = "1.00x";
      document.getElementById("b-num").disabled = true;
      msg.innerText = "パネルを開けてください";
      document.querySelectorAll(".tile").forEach(t => { t.className = "tile"; t.innerText = ""; t.disabled = false; });
      btn.innerText = "CASH OUT (利確)"; btn.classList.add("btn-green");
    } else {
      if (openCnt === 0) { msg.innerText = "1マス以上開けてください"; return; }
      const w = Math.floor(mBet * mCur);
      await updateCloudBalance(w);
      endMines(`🎉 ${mCur.toFixed(2)}x 利確！ +${w.toLocaleString()} G`);
    }
  }

  function endMines(text) {
    mRun = false;
    document.getElementById("b-num").disabled = false;
    document.getElementById("m-msg").innerText = text;
    document.querySelectorAll(".tile").forEach((t, i) => {
      t.disabled = true;
      if (!t.classList.contains("gem") && !t.classList.contains("bomb")) {
        t.classList.add("dim");
        t.innerText = bSet.has(i) ? "💣" : "💎";
      }
    });
    const btn = document.getElementById("m-btn");
    btn.innerText = "START"; btn.classList.remove("btn-green");
  }

  if (me) startApp();
</script>
</body>
</html>
