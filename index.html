<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>スロット[Re]</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,"Noto Sans JP",sans-serif;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #252525 0%,
            #111 55%,
            #050505 100%
        );

    transition:
        background 0.35s ease;
}


/* =========================
   当たり濃厚背景
========================= */

body.hot{
    background:
        radial-gradient(
            circle at center,
            #6b3b0d 0%,
            #321804 55%,
            #090300 100%
        );
}

body.void-hot{
    background:
        radial-gradient(
            circle at center,
            #68258a 0%,
            #280b38 55%,
            #060108 100%
        );
}


/* =========================
   メイン
========================= */

.game{
    width:780px;
    max-width:95vw;

    padding:22px;

    background:rgba(10,15,25,.96);

    border:2px solid #414c66;

    border-radius:20px;

    box-shadow:
        0 0 40px rgba(0,0,0,.8);
}


/* =========================
   タイトル
========================= */

.title{
    text-align:center;

    font-size:38px;

    font-weight:bold;

    letter-spacing:4px;

    margin-bottom:4px;
}

.subtitle{
    text-align:center;

    color:#8994aa;

    font-size:13px;

    margin-bottom:18px;
}


/* =========================
   状態
========================= */

.status{
    padding:15px;

    background:#171e2d;

    border:1px solid #35415b;

    border-radius:12px;

    margin-bottom:14px;
}

.status-name{
    font-size:23px;

    font-weight:bold;
}

.status-info{
    margin-top:6px;

    color:#929eb8;

    font-size:14px;
}


/* =========================
   リール
========================= */

.reels{
    display:flex;

    justify-content:center;

    gap:10px;

    margin:22px 0;
}

.reel{
    width:150px;

    height:120px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            #f5f5f5,
            #c9c9c9
        );

    color:#111;

    border:5px solid #59657c;

    border-radius:12px;

    font-size:28px;

    font-weight:bold;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.35),
        0 7px 20px rgba(0,0,0,.45);
}


/* =========================
   PUSH
========================= */

.push{
    width:100%;

    height:75px;

    border:0;

    border-radius:15px;

    font-size:30px;

    font-weight:bold;

    letter-spacing:4px;

    cursor:pointer;

    transition:.12s;

    box-shadow:
        0 7px 0 rgba(0,0,0,.45);
}

.push:active{
    transform:translateY(5px);

    box-shadow:
        0 2px 0 rgba(0,0,0,.45);
}


/* 通常 */

.push-white{
    background:
        linear-gradient(
            #eeeeee,
            #999999
        );

    color:#111;
}


/* 当たり濃厚 */

.push-red{
    background:
        linear-gradient(
            #ff6666,
            #a80000
        );

    color:white;

    box-shadow:
        0 7px 0 #450000,
        0 0 25px rgba(255,0,0,.65);
}


/* 超強 */

.push-purple{
    background:
        linear-gradient(
            #d47aff,
            #6420a4
        );

    color:white;

    box-shadow:
        0 7px 0 #28003d,
        0 0 30px rgba(190,70,255,.75);
}


/* 最強 */

.push-rainbow{
    background:
        linear-gradient(
            90deg,
            #ff3030,
            #ffd42e,
            #42dc62,
            #4ca7ff,
            #c55cff
        );

    color:white;

    box-shadow:
        0 7px 0 #222,
        0 0 35px rgba(255,255,255,.75);
}


/* =========================
   メッセージ
========================= */

.message{
    min-height:78px;

    margin-top:17px;

    padding:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    line-height:1.5;

    font-size:18px;

    background:#171e2d;

    border:1px solid #35415b;

    border-radius:11px;
}

.message.hot{
    color:#ffe56b;

    border-color:#9c7620;

    background:#2a210c;
}

.message.void{
    color:#e5b2ff;

    border-color:#824ca3;

    background:#25122e;
}


/* =========================
   BONUS情報
========================= */

.bonus-info{
    display:none;

    padding:15px;

    margin-bottom:14px;

    background:#171e2d;

    border:1px solid #495675;

    border-radius:12px;
}

.bonus-title{
    font-size:22px;

    font-weight:bold;
}

.bonus-count{
    margin-top:7px;

    font-size:17px;
}

.bonus-medals{
    margin-top:5px;

    color:#9ba7bd;
}


/* =========================
   ボーナス一覧
========================= */

.section-title{
    margin-top:22px;

    margin-bottom:10px;

    font-size:18px;

    font-weight:bold;

    color:#bbc6e5;
}

.bonus-list{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;
}

.bonus{
    padding:12px;

    background:#1a2233;

    border:1px solid #303b54;

    border-radius:9px;
}

.bonus-name{
    font-weight:bold;
}

.bonus-game{
    margin-top:5px;

    color:#8995ae;

    font-size:13px;
}


/* =========================
   履歴
========================= */

.history{
    max-height:150px;

    overflow-y:auto;

    padding:10px;

    background:#0c121e;

    border-radius:10px;

    margin-top:8px;
}

.history div{
    padding:5px;

    border-bottom:1px solid #202a3c;

    color:#929eb6;

    font-size:13px;
}


/* =========================
   リセット
========================= */

.reset{
    width:100%;

    margin-top:12px;

    padding:10px;

    background:#242d40;

    color:#aab4c9;

    border:1px solid #3b4760;

    border-radius:8px;

    cursor:pointer;
}


/* =========================
   突入演出
========================= */

.effect{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    background:rgba(0,0,0,.95);
}

.effect.show{
    display:flex;
}

.effect-box{
    text-align:center;

    animation:
        effectIn .45s ease-out;
}

.effect-small{
    font-size:22px;

    letter-spacing:5px;

    color:#d5d9e5;
}

.effect-big{
    margin-top:12px;

    font-size:58px;

    font-weight:bold;

    text-shadow:
        0 0 25px currentColor;
}

.effect-sub{
    margin-top:15px;

    font-size:24px;

    color:white;
}

@keyframes effectIn{

    from{
        transform:scale(.5);

        opacity:0;
    }

    to{
        transform:scale(1);

        opacity:1;
    }

}


/* =========================
   点滅
========================= */

.flash{
    animation:
        flash .25s ease-in-out 4;
}

@keyframes flash{

    50%{
        transform:scale(1.04);
    }

}


/* =========================
   スマホ
========================= */

@media(max-width:600px){

    .game{
        padding:14px;
    }

    .title{
        font-size:30px;
    }

    .reel{
        width:30%;
        height:90px;

        font-size:21px;
    }

    .bonus-list{
        grid-template-columns:1fr;
    }

    .effect-big{
        font-size:40px;
    }

}

</style>
</head>


<body>


<div class="game">

    <div class="title">
        スロット[Re]
    </div>

    <div class="subtitle">
        BONUS / VOID / REPLAY CHANCE
    </div>

    <div class="status">
        <div class="status-name" id="medalDisplay">メダル：1000枚</div>
        <div class="status-info">1 PUSH = 3枚</div>
    </div>


    <!-- 状態 -->

    <div class="status">

        <div
            class="status-name"
            id="stateName">

            通常時

        </div>

        <div
            class="status-info"
            id="stateInfo">

            設定1：ボーナス確率 1/238.1　｜　PUSH 3枚

        </div>

    </div>


    <!-- BONUS情報 -->

    <div
        class="bonus-info"
        id="bonusInfo">

        <div
            class="bonus-title"
            id="bonusTitle">

            BONUS

        </div>

        <div
            class="bonus-count"
            id="bonusCount">

            10枚 × 5回

        </div>

        <div
            class="bonus-medals"
            id="bonusMedals">

            獲得枚数：0枚

        </div>

    </div>


    <!-- リール -->

    <div class="reels">

        <div
            class="reel"
            id="reel1">

            7

        </div>

        <div
            class="reel"
            id="reel2">

            BAR

        </div>

        <div
            class="reel"
            id="reel3">

            7

        </div>

    </div>


    <!-- PUSH -->

    <button
        class="push push-white"
        id="pushButton"
        onclick="play()">

        PUSH

    </button>


    <!-- メッセージ -->

    <div
        class="message"
        id="message">

        PUSHでゲーム開始

    </div>


    <!-- ボーナス一覧 -->

    <div class="section-title">

        ボーナス

    </div>


    <div class="bonus-list">

        <div class="bonus">
            <div class="bonus-name">レギュラー</div>
            <div class="bonus-game">10枚 × 5回 = 50枚</div>
        </div>

        <div class="bonus">
            <div class="bonus-name">リーフィンド</div>
            <div class="bonus-game">10枚 × 11回 = 110枚</div>
        </div>

        <div class="bonus">
            <div class="bonus-name">ダストロック</div>
            <div class="bonus-game">10枚 × 11回 = 110枚</div>
        </div>

        <div class="bonus">
            <div class="bonus-name">書物の怨念</div>
            <div class="bonus-game">10枚 × 11回 = 110枚</div>
        </div>

        <div class="bonus">
            <div class="bonus-name">Void</div>
            <div class="bonus-game">100枚 × 10回 = 1000枚</div>
        </div>

    </div>


    <!-- 履歴 -->

    <div class="section-title">

        ゲーム履歴

    </div>


    <div
        class="history"
        id="history">

        <div>
            ゲーム開始
        </div>

    </div>


    <button
        class="reset"
        onclick="resetGame()">

        リセット

    </button>

</div>


<!-- =========================
     突入演出
========================= -->

<div
    class="effect"
    id="effect">

    <div class="effect-box">

        <div
            class="effect-small"
            id="effectSmall">

            CHANCE

        </div>

        <div
            class="effect-big"
            id="effectBig">

            BONUS

        </div>

        <div
            class="effect-sub"
            id="effectSub">

            BONUS START!!

        </div>

    </div>

</div>


<script>


/* =========================
   ゲーム状態
========================= */

/* =========================
   設定・掛け金
========================= */

let CURRENT_SETTING = 1;

// 設定は最初は1。ページを開いてから1時間ごとに次の設定を抽選。
const SETTING_WEIGHTS = [
  { setting: 1, weight: 50 },
  { setting: 2, weight: 24 },
  { setting: 3, weight: 15 },
  { setting: 4, weight: 7 },
  { setting: 5, weight: 3 },
  { setting: 6, weight: 1 },
  { setting: 7, weight: 1 }
];

function chooseHourlySetting() {
  const entries = Object.entries(SETTING_WEIGHTS)
    .map(([setting, weight]) => ({
      setting: Number(setting),
      weight: Math.max(0, Number(weight) || 0)
    }))
    .filter(x => x.weight > 0);

  const total = entries.reduce((sum, x) => sum + x.weight, 0);
  if (total <= 0) return 1;

  let r = Math.random() * total;
  for (const item of entries) {
    r -= item.weight;
    if (r < 0) return item.setting;
  }
  return 1;
}

function scheduleHourlySettingChange() {
  setTimeout(() => {
    CURRENT_SETTING = chooseHourlySetting();

    // 画面上の設定表示がある場合は更新
    const settingEl = document.getElementById("settingDisplay");
    if (settingEl) {
      settingEl.textContent = `設定${CURRENT_SETTING}`;
    }

    // 次の1時間後にも再抽選
    scheduleHourlySettingChange();
  }, SETTING_CHANGE_INTERVAL);
}

scheduleHourlySettingChange(); // 1～7。ここを変更すると設定変更できます。
const BET = 3;

/* ===== 設定を変更するときはここだけ編集 ===== */

// 各設定のボーナス当選確率
const BONUS_PROBABILITY = {
  1: 1 / 280,
  2: 1 / 250,
  3: 1 / 225,
  4: 1 / 200,
  5: 1 / 180,
  6: 1 / 160,
  7: 1 / 140
};

// 1時間ごとの設定選択率（合計100%）
const SETTING_WEIGHTS = {
  1: 50,
  2: 24,
  3: 15,
  4: 7,
  5: 3,
  6: 1,
  7: 0
};

// 最初は設定1
let CURRENT_SETTING = 1;

// 設定変更間隔
const SETTING_CHANGE_INTERVAL = 60 * 60 * 1000;


const BONUS_TYPES = [
    { name:"レギュラー", rounds:5, payout:10, weight:39.5 },
    { name:"リーフィンド", rounds:11, payout:10, weight:20 },
    { name:"ダストロック", rounds:11, payout:10, weight:20 },
    { name:"書物の怨念", rounds:11, payout:10, weight:20 },
    { name:"Void", rounds:10, payout:100, weight:0.5 }
];

let medals = 1000;

let state =
    "normal";


let bonusName =
    "";


let bonusRemaining =
    0;


let bonusMedals =
    0;

let voidMedals =
    0;


let remainingGames =
    0;


/*
    通常時の演出状態

    normal
    hot
    void
*/

let signal =
    "normal";


/* =========================
   ボーナス種類
========================= */

const bonuses = BONUS_TYPES;


/* =========================
   初期状態
========================= */

normalSignal();
updateMedals();
document.getElementById("stateInfo").textContent =
    "設定" + CURRENT_SETTING + "：ボーナス確率 1/" +
    (1 / BONUS_PROBABILITY[CURRENT_SETTING]).toFixed(1) +
    "　｜　PUSH 3枚";


/* =========================
   通常状態
========================= */

function normalSignal(){

    signal =
        "normal";


    document.body.classList.remove(
        "hot"
    );

    document.body.classList.remove(
        "void-hot"
    );


    const button =
        document.getElementById(
            "pushButton"
        );


    button.className =
        "push push-white";

}


/* =========================
   当たり濃厚演出
========================= */

function hotSignal(){

    signal =
        "hot";


    document.body.classList.remove(
        "void-hot"
    );

    document.body.classList.add(
        "hot"
    );


    const button =
        document.getElementById(
            "pushButton"
        );


    button.className =
        "push push-red";


    button.classList.add(
        "flash"
    );


    setTimeout(()=>{

        button.classList.remove(
            "flash"
        );

    },1000);

}


/* =========================
   Void濃厚演出
========================= */

function voidSignal(){

    signal =
        "void";


    document.body.classList.remove(
        "hot"
    );

    document.body.classList.add(
        "void-hot"
    );


    const button =
        document.getElementById(
            "pushButton"
        );


    button.className =
        "push push-rainbow";


    button.classList.add(
        "flash"
    );


    setTimeout(()=>{

        button.classList.remove(
            "flash"
        );

    },1000);

}


/* =========================
   PUSH
========================= */

function play(){

    if(state === "normal"){

        normalGame();

        return;
    }


    if(state === "bonus"){

        bonusGame();

        return;
    }


    if(state === "void"){

        voidGame();

        return;
    }


    if(state === "replay30"){

        replay30Game();

        return;
    }


    if(state === "cz"){

        czGame();

        return;
    }


    if(state === "replayInfinite"){

        infiniteReplayGame();

        return;
    }

}


/* =========================
   通常時
========================= */

function normalGame(){

    // 1 PUSH = 3枚
    if(medals < BET){
        message("メダルが足りません。リセットしてください。");
        addHistory("メダル不足");
        return;
    }

    medals -= BET;
    updateMedals();
    normalSignal();

    const bonusChance = BONUS_PROBABILITY[CURRENT_SETTING];
    const r = Math.random();

    // Voidはボーナス振り分け0.5%として、まず通常ボーナス当選を判定。
    if(r < bonusChance){

        const bonus = drawBonusType();

        bonusName = bonus.name;

        if(bonusName === "Void"){
            voidSignal();
            setReels("V","O","I");
            message("……VOID……！");
            addHistory("VOID BONUS当選");
            setTimeout(()=>{
                startVoidBonusEffect();
            },450);
            return;
        }

        hotSignal();
        setReels("7","7","7");
        message("……！");
        addHistory("BONUS当選：" + bonusName);

        setTimeout(()=>{
            startBonusEffect();
        },500);

        return;
    }

    // CZチャンス
    if(r < bonusChance + 0.08){
        setReels("CZ","CZ","CZ");
        message("CZチャンス！");
        addHistory("通常時：CZチャンス");
        return;
    }

    // チャンス役
    if(r < bonusChance + 0.20){
        setReels("🍒","🍒","🍒");
        message("チャンス役！");
        addHistory("通常時：チャンス役");
        return;
    }

    // ハズレ
    setReels("7","BAR","🍒");
    message("ハズレ");
    addHistory("通常時：ハズレ");
}


/* =========================
   BONUS突入演出
========================= */

function startBonusEffect(){

    if(!bonusName){
        bonusName = drawBonusType().name;
    }


    showEffect(
        "BONUS CHANCE",
        bonusName + " BONUS",
        "BONUS START!!",
        false
    );


    addHistory(
        "BONUS突入"
    );


    setTimeout(()=>{

        hideEffect();

        startBonus();

    },1800);

}


/* =========================
   BONUS開始
========================= */

function startBonus(){

    const bonus = BONUS_TYPES.find(b => b.name === bonusName);

    state = "bonus";
    bonusRemaining = bonus.rounds;
    bonusMedals = 0;

    normalSignal();
    showBonusInfo();

    setState(
        "ボーナス",
        bonusName + "　" + bonus.payout + "枚 × " + bonus.rounds + "回"
    );

    setReels("BONUS","BONUS","BONUS");

    message(
        "🎰 " + bonusName + " BONUS開始！<br>" +
        bonus.payout + "枚 × " + bonus.rounds + "回"
    );

    addHistory(
        bonusName + " BONUS START"
    );
}


/* =========================
   BONUS中
========================= */

function bonusGame(){

    const bonus = BONUS_TYPES.find(b => b.name === bonusName);
    const payout = bonus ? bonus.payout : 10;

    bonusRemaining--;
    bonusMedals += payout;
    medals += payout;
    updateMedals();

    setReels(
        String(payout),
        "枚",
        "GET"
    );

    updateBonusInfo();

    // Void昇格
    if(Math.random() < 0.01){
        startVoidBonusEffect();
        return;
    }

    // +5回
    if(Math.random() < 0.02){
        bonusRemaining += 5;

        message(
            "🔥 <b>BIG BONUS CHANCE!</b><br>" +
            "+5回！ +" + (payout * 5) + "枚！"
        );

        document.getElementById("message").classList.add("hot");
        updateBonusInfo();
        addHistory("BONUS +5回");

        setTimeout(()=>{
            document.getElementById("message").classList.remove("hot");
        },600);

        return;
    }

    // +1回
    if(Math.random() < 0.10){
        bonusRemaining += 1;

        message(
            "⚡ BONUS CHANCE!<br>" +
            "+1回！ +" + payout + "枚！"
        );

        updateBonusInfo();
        addHistory("BONUS +1回");
        return;
    }

    message(
        "💰 " + payout + "枚獲得！<br>" +
        "残り " + bonusRemaining + "回"
    );

    addHistory(
        "BONUS：" + payout + "枚"
    );

    if(bonusRemaining <= 0){
        finishBonus();
    }
}


/* =========================
   BONUS終了
========================= */

function finishBonus(){

    state =
        "replay30";


    remainingGames =
        30;


    hideBonusInfo();


    setState(
        "リプレイ確変",
        "30G"
    );


    normalSignal();


    setReels(
        "REPLAY",
        "REPLAY",
        "REPLAY"
    );


    message(
        "🎉 BONUS終了！<br>" +
        "獲得枚数：" +
        bonusMedals +
        "枚<br>" +
        "リプレイ確変30Gへ！"
    );


    addHistory(
        "BONUS終了：" +
        bonusMedals +
        "枚"
    );

}


/* =========================
   VOID演出
========================= */

function startVoidBonusEffect(){

    voidSignal();


    showEffect(
        "SPECIAL",
        "VOID BONUS",
        "MAXIMUM CHANCE",
        true
    );


    addHistory(
        "VOID BONUS昇格"
    );


    setTimeout(()=>{

        hideEffect();

        startVoidBonus();

    },2000);

}


/* =========================
   VOID開始
========================= */

function startVoidBonus(){

    state =
        "void";


    remainingGames =
        100;


    hideBonusInfo();


    normalSignal();


    setState(
        "Voidボーナス",
        "100G"
    );


    setReels(
        "VOID",
        "VOID",
        "VOID"
    );


    message(
        "👑 <b>VOID BONUS</b><br>" +
        "100G開始！"
    );


    document
        .getElementById(
            "message"
        )
        .classList.add(
            "void"
        );


    addHistory(
        "VOID BONUS START"
    );

}


/* =========================
   VOID中
========================= */

function voidGame(){

    remainingGames--;


    

    // Void中は1Gごとに10枚獲得
    voidMedals += 10;
    medals += 10;
    updateMedals();
/*
       +10G
    */

    if(Math.random() < 0.02){

        remainingGames +=
            10;


        message(
            "👑 Void中<br>" +
            "+10G上乗せ！"
        );


        addHistory(
            "Void：+10G"
        );


        return;
    }


    setReels(
        "VOID",
        randomSymbol(),
        "VOID"
    );


    message(
        "👑 Voidボーナス中<br>" +
        "10枚獲得！<br>" +
        "残り " +
        remainingGames +
        "G"
    );


    if(
        remainingGames <= 0
    ){

        state =
            "replayInfinite";


        document
            .getElementById(
                "message"
            )
            .classList.remove(
                "void"
            );


        setState(
            "リプレイ確変（無限）",
            "終了条件なし"
        );


        setReels(
            "REPLAY",
            "REPLAY",
            "REPLAY"
        );


        message(
            "👑 Void終了！<br>" +
            "♾️ 無限リプレイ確変へ！"
        );


        addHistory(
            "Void終了 → 無限リプレイ"
        );

    }

}


/* =========================
   リプレイ確変30G
========================= */

function replay30Game(){

    remainingGames--;


    const r =
        Math.random();


    /*
       BONUS
    */

    if(r < 0.02){

        bonusName = drawBonusType().name;
        startBonusEffect();

        return;
    }


    /*
       CZ
    */

    if(r < 0.10){

        state =
            "cz";


        remainingGames =
            5;


        setState(
            "CZ",
            "5G"
        );


        setReels(
            "CZ",
            "CZ",
            "CZ"
        );


        message(
            "⚡ <b>CZ突入！</b><br>" +
            "5G間のチャンス！"
        );


        addHistory(
            "CZ突入"
        );


        return;
    }


    /*
       REPLAY
    */

    setReels(
        "REPLAY",
        "REPLAY",
        "BAR"
    );


    message(
        "リプレイ確変中<br>" +
        "残り " +
        remainingGames +
        "G"
    );


    if(
        remainingGames <= 0
    ){

        state =
            "normal";


        setState(
            "通常時",
            "設定" + CURRENT_SETTING + "：ボーナス確率 1/" +
            (1 / BONUS_PROBABILITY[CURRENT_SETTING]).toFixed(1) +
            "　｜　PUSH 3枚"
        );


        normalSignal();


        setReels(
            "7",
            "BAR",
            "7"
        );


        message(
            "リプレイ確変終了<br>" +
            "通常時へ"
        );


        addHistory(
            "リプレイ確変終了"
        );

    }

}

/* =========================
   無限リプレイ
========================= */

function infiniteReplayGame(){

    const r =
        Math.random();


    /*
       VOID
    */

    if(r < 0.04){

        startVoidBonusEffect();

        return;
    }


    /*
       BONUS
    */

    if(r < 0.08){

        bonusName = drawBonusType().name;
        startBonusEffect();

        return;
    }


    /*
       REPLAY
    */

    setReels(
        "REPLAY",
        "REPLAY",
        "REPLAY"
    );


    message(
        "♾️ リプレイ確変（無限）<br>" +
        "終了条件なし"
    );


    addHistory(
        "無限リプレイ：リプレイ"
    );

}


/* =========================
   リール
========================= */

function setReels(a,b,c){

    document.getElementById(
        "reel1"
    ).textContent =
        a;


    document.getElementById(
        "reel2"
    ).textContent =
        b;


    document.getElementById(
        "reel3"
    ).textContent =
        c;

}


/* =========================
   ランダム図柄
========================= */

function randomSymbol(){

    const symbols = [

        "7",

        "BAR",

        "🍒",

        "🍈",

        "REPLAY"

    ];


    return symbols[
        Math.floor(
            Math.random() *
            symbols.length
        )
    ];

}


/* =========================
   状態表示
========================= */

function updateMedals(){
    document.getElementById("medalDisplay").textContent =
        "メダル：" + medals + "枚";
}

function drawBonusType(){
    const total = BONUS_TYPES.reduce((sum,b) => sum + b.weight, 0);
    let r = Math.random() * total;

    for(const bonus of BONUS_TYPES){
        r -= bonus.weight;
        if(r < 0){
            return bonus;
        }
    }

    return BONUS_TYPES[0];
}

function setState(name,info){

    document.getElementById(
        "stateName"
    ).textContent =
        name;


    document.getElementById(
        "stateInfo"
    ).textContent =
        info;

}


/* =========================
   メッセージ
========================= */

function message(text){

    document.getElementById(
        "message"
    ).innerHTML =
        text;

}


/* =========================
   BONUS情報
========================= */

function showBonusInfo(){

    document.getElementById(
        "bonusInfo"
    ).style.display =
        "block";


    updateBonusInfo();

}


function hideBonusInfo(){

    document.getElementById(
        "bonusInfo"
    ).style.display =
        "none";

}


function updateBonusInfo(){

    const bonus = BONUS_TYPES.find(b => b.name === bonusName);
    const payout = bonus ? bonus.payout : 10;

    document.getElementById("bonusTitle").textContent =
        bonusName + " BONUS";

    document.getElementById("bonusCount").textContent =
        payout + "枚 × " + bonusRemaining + "回";

    document.getElementById("bonusMedals").textContent =
        "今回の獲得枚数：" + bonusMedals + "枚";
}


/* =========================
   演出表示
========================= */

function showEffect(
    small,
    big,
    sub,
    isVoid
){

    document.getElementById(
        "effectSmall"
    ).textContent =
        small;


    document.getElementById(
        "effectBig"
    ).textContent =
        big;


    document.getElementById(
        "effectSub"
    ).textContent =
        sub;


    const bigText =
        document.getElementById(
            "effectBig"
        );


    if(isVoid){

        bigText.style.color =
            "#dc8aff";

    }
    else{

        bigText.style.color =
            "#ffd65c";

    }


    document.getElementById(
        "effect"
    ).classList.add(
        "show"
    );

}


function hideEffect(){

    document.getElementById(
        "effect"
    ).classList.remove(
        "show"
    );

}


/* =========================
   履歴
========================= */

function addHistory(text){

    const history =
        document.getElementById(
            "history"
        );


    const item =
        document.createElement(
            "div"
        );


    item.textContent =
        text;


    history.prepend(
        item
    );

}


/* =========================
   リセット
========================= */

function resetGame(){

    medals = 1000;

    state =
        "normal";


    bonusName =
        "";


    bonusRemaining =
        0;


    bonusMedals =
        0;


    remainingGames =
        0;


    hideBonusInfo();

    hideEffect();

    updateMedals();

    normalSignal();


    setState(
        "通常時",
        "設定" + CURRENT_SETTING + "：ボーナス確率 1/" +
        (1 / BONUS_PROBABILITY[CURRENT_SETTING]).toFixed(1) +
        "　｜　PUSH 3枚"
    );


    setReels(
        "7",
        "BAR",
        "7"
    );


    message(
        "PUSHでゲーム開始"
    );


    document.getElementById(
        "history"
    ).innerHTML =
        "<div>ゲームリセット</div>";

}

</script>
