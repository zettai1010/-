<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG CASINO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f111a;
    --card: #171a26;
    --dark: #0b0d14;
    --border: #282c3f;
    --gold: #f5b942;
    --green: #10b981;
    --red: #dc2626;
    --blue: #3b82f6;
    --purple: #a855f7;
    --pink: #ec4899;
    --text: #f8fafc;
    --muted: #8b92a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 10px;
  }
  .hidden { display: none !important; }

  .auth-card {
    width: 100%;
    max-width: 380px;
    margin-top: 40px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 22px;
  }
  .auth-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: var(--dark);
    padding: 4px;
    border-radius: 8px;
  }
  .auth-tab {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
    cursor: pointer;
  }
  .auth-tab.active { background: var(--gold); color: #111; }
  .label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; font-weight: bold; }
  .input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--dark);
    color: var(--text);
    font-size: 0.95rem;
  }
  .btn-main {
    width: 100%;
    padding: 12px 8px;
    border: none;
    border-radius: 8px;
    background: var(--gold);
    color: #111;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .btn-main:disabled { background: #2c3146 !important; color: var(--muted) !important; cursor: not-allowed; }
  .btn-purple { background: var(--purple) !important; color: #fff !important; }
  .btn-pink { background: var(--pink) !important; color: #fff !important; }
  .btn-red { background: var(--red) !important; color: #fff !important; }

  .app-wrap { width: 100%; max-width: 560px; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .bal { font-weight: 800; font-size: 0.95rem; }
  .bal span { color: var(--green); font-size: 1.15rem; }
  .mini-btn {
    background: #222638;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1;
    min-width: 72px;
    padding: 10px 4px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    text-align: center;
  }
  .tab.active { background: var(--gold); color: #111; border-color: var(--gold); }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 12px;
    text-align: center;
  }
  .msg { margin-top: 10px; font-size: 0.88rem; font-weight: 700; min-height: 22px; }

  /* ==========================================
     🎡 ホイールアニメーション
     ========================================== */
  .wheel-stage {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 6px auto 12px;
  }
  .wheel-pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 11px solid transparent;
    border-right: 11px solid transparent;
    border-top: 20px solid var(--gold);
    z-index: 10;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
  }
  #wheel-canvas {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 5px solid var(--gold);
    box-shadow: 0 0 24px rgba(245, 185, 66, 0.3);
    transition: transform 4.2s cubic-bezier(0.12, 0.85, 0.18, 1);
  }
  .wheel-center-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--dark);
    border: 3px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 900;
    color: #fff;
    z-index: 5;
  }

  .history-bar {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-bottom: 12px;
    min-height: 24px;
  }
  .hist-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 0.72rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  /* チップ選択 & ベットテーブル */
  .chip-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .chip {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 3px dashed #fff;
    font-weight: 900;
    font-size: 0.7rem;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    transition: transform 0.12s;
  }
  .chip.active {
    transform: scale(1.15);
    outline: 3px solid var(--gold);
  }
  .chip-1 { background: #2563eb; }
  .chip-2 { background: #059669; }
  .chip-3 { background: #d97706; }
  .chip-4 { background: #dc2626; }

  .table-felt {
    background: #0d3b26;
    border: 2px solid #1f6b47;
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 10px;
    user-select: none;
  }
  .grid-zero { margin-bottom: 4px; }
  .grid-nums {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .grid-dozens {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .grid-outside {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
  }
  .bet-cell {
    position: relative;
    padding: 9px 2px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.22);
    font-weight: 800;
    font-size: 0.82rem;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bet-cell:active { transform: scale(0.96); }
  .cell-red { background: #b91c1c; }
  .cell-black { background: #18181b; }
  .cell-green { background: #047857; }
  .cell-out { background: rgba(0,0,0,0.35); font-size: 0.72rem; }

  .placed-chip {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--gold);
    color: #111;
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 1px 6px;
    font-size: 0.68rem;
    font-weight: 900;
    box-shadow: 0 2px 6px rgba(0,0,0,0.7);
    pointer-events: none;
    white-space: nowrap;
  }

  .bet-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--dark);
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 0.82rem;
  }

  /* ==========================================
     🎁 複数ガチャ切り替え＆アイテムガチャ用スタイル
     ========================================== */
  .gacha-selector {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .gacha-sel-btn {
    flex: 1;
    min-width: 140px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--dark);
    color: var(--muted);
    font-weight: 800;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .gacha-sel-btn.active {
    background: rgba(245, 185, 66, 0.15);
    border-color: var(--gold);
    color: var(--gold);
  }

  .gacha-stage {
    min-height: 155px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .gacha-box-icon {
    font-size: 4rem;
    transition: transform 0.1s;
  }
  @keyframes shake {
    0%, 100% { transform: rotate(0deg) scale(1.05); }
    25% { transform: rotate(-12deg) scale(1.1); }
    75% { transform: rotate(12deg) scale(1.1); }
  }
  .shaking { animation: shake 0.18s infinite; }

  .gacha-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    width: 100%;
  }
  .gacha-summary-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .gacha-card {
    background: #171a26;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 7px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    font-size: 0.78rem;
    font-weight: 800;
  }
  .gacha-card .emoji { font-size: 1.5rem; flex-shrink: 0; }
  .rarity-MISS { border-color: #334155; color: var(--muted); }
  .rarity-3等 { border-color: var(--blue); color: #60a5fa; box-shadow: 0 0 8px rgba(59,130,246,0.25); }
  .rarity-2等 { border-color: var(--purple); color: #c084fc; box-shadow: 0 0 12px rgba(168,85,247,0.4); }
  .rarity-1等 {
    border-color: var(--gold);
    background: linear-gradient(135deg, rgba(245,185,66,0.28), rgba(244,63,94,0.25));
    color: #fde047;
    box-shadow: 0 0 18px rgba(245,185,66,0.7);
  }

  .gacha-rates {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.7;
    text-align: left;
  }
  .gacha-btns {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  /* 獲得アイテムインベントリ */
  .inv-box {
    margin-top: 14px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: left;
  }
  .inv-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--gold);
  }
  .inv-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }
  .inv-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #171a26;
    border: 1px solid var(--border);
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 0.8rem;
  }

  /* ランキング用スタイル */
  .rank-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
    text-align: left;
  }
  .rank-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--dark);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 9px;
    font-size: 0.9rem;
  }
  .rank-item.me {
    border-color: var(--gold);
    background: rgba(245, 185, 66, 0.08);
  }
  .rank-left { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .rank-badge { width: 28px; text-align: center; font-weight: 900; color: var(--muted); }
  .rank-1 { color: #ffd700; font-size: 1.15rem; }
  .rank-2 { color: #c0c0c0; font-size: 1.1rem; }
  .rank-3 { color: #cd7f32; font-size: 1.05rem; }
  .rank-bal { font-weight: 800; color: var(--green); }

  .user-list {
    max-height: 220px;
    overflow-y: auto;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    text-align: left;
    margin-top: 14px;
    font-size: 0.82rem;
  }
  .user-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 8px;
    border-bottom: 1px solid #1a1e2e;
    cursor: pointer;
  }
  .user-row:hover { background: #171a26; }
</style>
</head>
<body>

<!-- ログイン / 新規登録画面 -->
<div class="auth-card" id="login-view">
  <h2 style="margin:0 0 14px; color:var(--gold); text-align:center;">⚔️ RPG CASINO</h2>
  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-log" onclick="switchAuth('login')">ログイン</button>
    <button class="auth-tab" id="tab-reg" onclick="switchAuth('register')">新規登録</button>
  </div>

  <label class="label">MCID（統合版は先頭に BE_ ）</label>
  <input id="mcid" class="input" placeholder="例: Steve / BE_Steve">

  <label class="label">パスワード</label>
  <input id="pass" type="password" class="input" placeholder="••••••••">

  <div id="reg-extra" class="hidden">
    <label class="label">パスワード（確認用）</label>
    <input id="pass2" type="password" class="input" placeholder="もう一度入力">
  </div>

  <button class="btn-main" id="auth-submit" onclick="submitAuth()">ログイン</button>
  <div id="err" style="color:var(--red); font-size:0.8rem; text-align:center; margin-top:10px;"></div>
</div>

<!-- メイン画面 -->
<div class="app-wrap hidden" id="game-view">
  <div class="header">
    <div>
      <div style="font-weight:800; color:var(--gold); font-size:0.9rem;" id="u-name"></div>
      <div class="bal"><span id="bal">0</span> n <button class="mini-btn" style="padding:2px 6px; margin-left:4px;" onclick="refreshBalance()">🔄</button></div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="mini-btn" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="tab('roulette', this)">🎡 ルーレット</button>
    <button class="tab" onclick="tab('gacha', this)">🎁 ガチャ</button>
    <button class="tab" onclick="tab('ranking', this)">🏆 順位</button>
    <button class="tab" id="dep-tab-btn" onclick="tab('deposit', this)">💰 入出金</button>
    <button class="tab hidden" id="admin-tab-btn" style="color:var(--gold);" onclick="tab('admin', this)">👑 管理</button>
  </div>

  <!-- 1. 本格ルーレットテーブル -->
  <div id="roulette" class="panel">
    <div class="wheel-stage">
      <div class="wheel-pointer"></div>
      <canvas id="wheel-canvas" width="440" height="440"></canvas>
      <div class="wheel-center-badge" id="wheel-res">?</div>
    </div>

    <div class="history-bar" id="rl-hist"></div>

    <div class="chip-bar">
      <button class="chip chip-1 active" onclick="selectChip(10000, this)">1万</button>
      <button class="chip chip-2" onclick="selectChip(50000, this)">5万</button>
      <button class="chip chip-3" onclick="selectChip(100000, this)">10万</button>
      <button class="chip chip-4" onclick="selectChip(500000, this)">50万</button>
      <button class="mini-btn" onclick="clearBets()">🗑️ クリア</button>
      <button class="mini-btn" onclick="rebet()">🔁 前回と同じ</button>
    </div>

    <div class="table-felt">
      <div class="grid-zero">
        <div class="bet-cell cell-green" data-bet="n:0" onclick="placeBet('n:0')">0 (36x)</div>
      </div>
      <div class="grid-nums" id="num-grid"></div>
      <div class="grid-dozens">
        <div class="bet-cell cell-out" data-bet="d:1" onclick="placeBet('d:1')">1st 12 (3x)</div>
        <div class="bet-cell cell-out" data-bet="d:2" onclick="placeBet('d:2')">2nd 12 (3x)</div>
        <div class="bet-cell cell-out" data-bet="d:3" onclick="placeBet('d:3')">3rd 12 (3x)</div>
      </div>
      <div class="grid-outside">
        <div class="bet-cell cell-out" data-bet="o:low" onclick="placeBet('o:low')">1-18</div>
        <div class="bet-cell cell-out" data-bet="o:even" onclick="placeBet('o:even')">EVEN</div>
        <div class="bet-cell cell-red" data-bet="o:red" onclick="placeBet('o:red')">RED</div>
        <div class="bet-cell cell-black" data-bet="o:black" onclick="placeBet('o:black')">BLACK</div>
        <div class="bet-cell cell-out" data-bet="o:odd" onclick="placeBet('o:odd')">ODD</div>
        <div class="bet-cell cell-out" data-bet="o:high" onclick="placeBet('o:high')">19-36</div>
      </div>
    </div>

    <div class="bet-summary">
      <span>合計ベット: <strong id="total-bet-txt" style="color:var(--gold);">0</strong> n</span>
      <span style="color:var(--muted);">上限: 500,000 n</span>
    </div>

    <button class="btn-main" id="rl-spin-btn" onclick="spinRoulette()">🎡 SPIN ROULETTE</button>
    <div class="msg" id="rl-msg"></div>
  </div>

  <!-- 2. 複数対応ガチャ画面 -->
  <div id="gacha" class="panel hidden">
    <div class="gacha-selector" id="gacha-selector"></div>

    <h3 id="gacha-title" style="margin:0 0 10px; color:var(--gold);"></h3>

    <div class="gacha-stage" id="gacha-stage"></div>

    <div class="gacha-rates" id="gacha-rate-box"></div>

    <div class="gacha-btns">
      <button class="btn-main gacha-pull-btn" id="gacha-btn-1" onclick="pullGacha(1)"></button>
      <button class="btn-main btn-purple gacha-pull-btn" id="gacha-btn-10" onclick="pullGacha(10)"></button>
      <button class="btn-main btn-pink gacha-pull-btn" id="gacha-btn-100" onclick="pullGacha(100)"></button>
      <button class="btn-main btn-red gacha-pull-btn" id="gacha-btn-1000" onclick="pullGacha(1000)"></button>
    </div>
    <div class="msg" id="gacha-msg"></div>

    <!-- 獲得済みアイテムインベントリ -->
    <div class="inv-box">
      <div class="inv-header">
        <span>🎒 当選アイテム（未受取）</span>
        <button class="mini-btn" style="border-color:var(--green); color:var(--green);" onclick="claimAllItems()">📦 まとめて受取申請</button>
      </div>
      <div class="inv-list" id="inv-list">
        <div style="color:var(--muted); font-size:0.78rem; text-align:center; padding:10px;">まだアイテムがありません</div>
      </div>
    </div>
  </div>

  <!-- 3. 所持金ランキング -->
  <div id="ranking" class="panel hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <h3 style="margin:0; color:var(--gold);">🏆 所持金ランキング TOP20</h3>
      <button class="mini-btn" onclick="loadRanking()">🔄 更新</button>
    </div>
    <div class="rank-list" id="rank-list">読み込み中...</div>
  </div>

  <!-- 4. 入出金申請 -->
  <div id="deposit" class="panel hidden">
    <h3 style="margin-top:0; color:var(--gold);">💰 入金・出金申請</h3>
    <label class="label" style="text-align:left;">申請タイプ</label>
    <select id="req-type" class="input">
      <option value="💰 入金申請">💰 入金（マイクラ → カジノ）</option>
      <option value="💸 出金申請">💸 出金（カジノ → マイクラ）</option>
    </select>
    <label class="label" style="text-align:left;">金額 (n)</label>
    <input id="req-amount" type="number" class="input" value="100000" min="1000">
    <button class="btn-main" id="req-btn" onclick="sendDepositNotice()">📩 運営に通知を送る</button>
    <div class="msg" id="req-msg"></div>
  </div>

  <!-- 5. 運営専用管理パネル -->
  <div id="admin" class="panel hidden">
    <h3 style="margin-top:0; color:var(--gold);">👑 運営用：残高操作</h3>
    <label class="label" style="text-align:left;">対象プレイヤーのMCID</label>
    <input id="adm-target" class="input" placeholder="下のリストからタップでも選択可">
    <label class="label" style="text-align:left;">増減金額（減らす場合はマイナス -100000）</label>
    <input id="adm-amount" type="number" class="input" value="100000">

  const MAX_BET_LIMIT = 100000000;

  // ==========================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let myBalance = 0;

  async function submitAuth() {

  async function startApp() {
    document.getElementById("login-view").classList.add("hidden");
    document.getElementById("game-view").classList.remove("hidden");
    document.getElementById("u-name").innerText = "MCID: " + me;

      document.getElementById("admin-tab-btn").classList.remove("hidden");
    }
    renderInventory();
    await refreshBalance();

  async function refreshBalance() {
    const { data } = await sb.from("casino_users").select("balance").eq("mcid", me).single();
    if (data) {
      myBalance = Number(data.balance);
      document.getElementById("bal").innerText = Math.floor(myBalance).toLocaleString();
    }
  }

  async function updateCloudBalance(diff) {
    await refreshBalance();
    const nextBal = Math.max(0, Math.floor(myBalance + diff));
    const { error } = await sb.from("casino_users").update({ balance: nextBal }).eq("mcid", me);
    if (!error) {
      myBalance = nextBal;
      document.getElementById("bal").innerText = myBalance.toLocaleString();
    }
  }

  function logout() {
    localStorage.removeItem(ME_KEY);
    location.reload();
  }

  function tab(name, btn) {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    ["roulette", "gacha", "ranking", "deposit", "admin"].forEach(t => document.getElementById(t).classList.toggle("hidden", t !== name));
    if (name === "ranking") loadRanking();
    if (name === "admin") loadAllUsers();
  }

  // ==========================================
  // 🎡 ヨーロピアンルーレット円盤描画 & テーブル初期化
  // ==========================================
  const WHEEL_ORDER = [
    0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
    5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
  ];
  const RED_NUMS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

  function getNumColor(n) {
    if (n === 0) return "green";
    return RED_NUMS.has(n) ? "red" : "black";
  }

  const numGrid = document.getElementById("num-grid");
  for (let n = 1; n <= 36; n++) {
    const col = getNumColor(n);
    const cell = document.createElement("div");
    cell.className = `bet-cell cell-${col}`;
    cell.dataset.bet = `n:${n}`;
    cell.innerText = n;
    cell.onclick = () => placeBet(`n:${n}`);
    numGrid.appendChild(cell);
  }

  function drawWheelCanvas() {
    const canvas = document.getElementById("wheel-canvas");
    const ctx = canvas.getContext("2d");
    const cx = 220, cy = 220, radius = 215;
    const sliceAngle = (2 * Math.PI) / 37;

    WHEEL_ORDER.forEach((num, idx) => {
      const startAngle = -Math.PI / 2 - sliceAngle / 2 + idx * sliceAngle;
      const endAngle = startAngle + sliceAngle;
      const col = getNumColor(num);

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = col === "green" ? "#059669" : col === "red" ? "#dc2626" : "#18181b";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#f5b942";
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(startAngle + sliceAngle / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 20px sans-serif";
      ctx.fillText(num.toString(), radius - 14, 7);
      ctx.restore();
    });
  }
  drawWheelCanvas();

  let currentChip = 10000;
  let bets = {};
  let lastBets = {};
  let isSpinning = false;
  let currentRotation = 0;
  let rlHistory = [];

  function selectChip(val, btn) {
    currentChip = val;
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
  }

  function getTotalBet() {
    return Object.values(bets).reduce((a, b) => a + b, 0);
  }

  function placeBet(key) {
    if (isSpinning) return;
    const total = getTotalBet();
    const msg = document.getElementById("rl-msg");
    if (total + currentChip > MAX_BET_LIMIT) {
      msg.style.color = "var(--red)";
      msg.innerText = `合計ベット上限は ${MAX_BET_LIMIT.toLocaleString()} n です`;
      return;
    }
    msg.innerText = "";
    bets[key] = (bets[key] || 0) + currentChip;
    renderBets();
  }

  function clearBets() {
    if (isSpinning) return;
    bets = {};
    document.getElementById("rl-msg").innerText = "";
    renderBets();
  }

  function rebet() {
    if (isSpinning || Object.keys(lastBets).length === 0) return;
    bets = { ...lastBets };
    renderBets();
  }

  function formatChipText(amount) {
    if (amount >= 10000) return (amount / 10000) + "万";
    if (amount >= 1000) return (amount / 1000) + "K";
    return amount;
  }

  function renderBets() {
    document.querySelectorAll(".placed-chip").forEach(el => el.remove());
    for (const [key, amount] of Object.entries(bets)) {
      const cell = document.querySelector(`.bet-cell[data-bet="${key}"]`);
      if (cell) {
        const badge = document.createElement("div");
        badge.className = "placed-chip";
        badge.innerText = formatChipText(amount);
        cell.appendChild(badge);
      }
    }
    document.getElementById("total-bet-txt").innerText = getTotalBet().toLocaleString();
  }

  async function spinRoulette() {
    if (isSpinning) return;
    const totalBet = getTotalBet();
    const msg = document.getElementById("rl-msg");
    const btn = document.getElementById("rl-spin-btn");

    if (totalBet <= 0) {
      msg.style.color = "var(--gold)";
      msg.innerText = "テーブルをタップしてチップを置いてください";
      return;
    }

    await refreshBalance();
    if (totalBet > myBalance) {
      msg.style.color = "var(--red)";
      msg.innerText = "残高不足です";
      return;
    }

    await updateCloudBalance(-totalBet);
    lastBets = { ...bets };
    isSpinning = true;
    btn.disabled = true;
    msg.style.color = "var(--muted)";
    msg.innerText = "ルーレット回転中...";

    const resBadge = document.getElementById("wheel-res");
    resBadge.innerText = "?";
    resBadge.style.background = "var(--dark)";

    const winIndex = Math.floor(Math.random() * 37);
    const winNum = WHEEL_ORDER[winIndex];
    const winCol = getNumColor(winNum);

    const sliceDeg = 360 / 37;
    const targetMod = (360 - (winIndex * sliceDeg)) % 360;
    const currentMod = ((currentRotation % 360) + 360) % 360;
    const delta = (targetMod - currentMod + 360) % 360;
    currentRotation += 360 * 6 + delta;

    const canvas = document.getElementById("wheel-canvas");
    canvas.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(async () => {
      resBadge.innerText = winNum;
      resBadge.style.background = winCol === "green" ? "#059669" : winCol === "red" ? "#dc2626" : "#18181b";

      rlHistory.unshift({ num: winNum, col: winCol });
      if (rlHistory.length > 10) rlHistory.pop();
      document.getElementById("rl-hist").innerHTML = rlHistory.map(h => {
        const bg = h.col === "red" ? "#dc2626" : h.col === "black" ? "#27272a" : "#059669";
        return `<div class="hist-dot" style="background:${bg};">${h.num}</div>`;
      }).join("");

      let totalPayout = 0;
      for (const [key, amt] of Object.entries(bets)) {
        const [type, val] = key.split(":");
        if (type === "n" && Number(val) === winNum) {
          totalPayout += amt * 36;
        } else if (type === "d" && winNum !== 0) {
          if (val === "1" && winNum >= 1 && winNum <= 12) totalPayout += amt * 3;
          if (val === "2" && winNum >= 13 && winNum <= 24) totalPayout += amt * 3;
          if (val === "3" && winNum >= 25 && winNum <= 36) totalPayout += amt * 3;
        } else if (type === "o" && winNum !== 0) {
          if (val === "red" && winCol === "red") totalPayout += amt * 2;
          if (val === "black" && winCol === "black") totalPayout += amt * 2;
          if (val === "even" && winNum % 2 === 0) totalPayout += amt * 2;
          if (val === "odd" && winNum % 2 === 1) totalPayout += amt * 2;
          if (val === "low" && winNum >= 1 && winNum <= 18) totalPayout += amt * 2;
          if (val === "high" && winNum >= 19 && winNum <= 36) totalPayout += amt * 2;
        }
      }

      if (totalPayout > 0) {
        await updateCloudBalance(totalPayout);
        msg.style.color = "var(--green)";
        msg.innerText = `🎉 出目「${winNum}」的中！ +${totalPayout.toLocaleString()} n 獲得！`;
      } else {
        msg.style.color = "var(--red)";
        msg.innerText = `💥 出目「${winNum}」ハズレ... (-${totalBet.toLocaleString()} n)`;
      }

      isSpinning = false;
      btn.disabled = false;
    }, 4300);
  }

  // ==========================================
  // 🎁 マイクラRPGアイテムガチャ＆インベントリロジック
  // ==========================================
  let isPullingGacha = false;

  function getInvKey() {
    return "rpg_casino_inv_" + me;
  }

  function loadInventory() {
    try {
      return JSON.parse(localStorage.getItem(getInvKey()) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveInventory(inv) {
    localStorage.setItem(getInvKey(), JSON.stringify(inv));
    renderInventory();
  }

  function renderInventory() {
    const inv = loadInventory();
    const box = document.getElementById("inv-list");
    const entries = Object.entries(inv).filter(([, count]) => count > 0);
    if (entries.length === 0) {
      box.innerHTML = `<div style="color:var(--muted); font-size:0.78rem; text-align:center; padding:10px;">まだ未受取のアイテムがありません</div>`;
      return;
    }
    box.innerHTML = entries.map(([label, count]) => `
      <div class="inv-row">
        <span><strong>${label}</strong> × ${count}</span>
        <button class="mini-btn" style="border-color:var(--gold); color:var(--gold);" onclick="claimSingleItem('${label}')">📩 受取申請</button>
      </div>
    `).join("");
  }

  function rollSingleGacha(pool) {
    const r = Math.random() * 100;
    let acc = 0;
    for (const item of pool.items) {
      acc += item.rate;
      if (r < acc) return item;
    }
    return pool.items[pool.items.length - 1];
  }

  function setPullButtonsDisabled(disabled) {
    document.querySelectorAll(".gacha-pull-btn").forEach(b => b.disabled = disabled);
  }

  async function pullGacha(times) {
    if (isPullingGacha) return;
    const pool = GACHA_POOLS[currentPoolIndex];
    const cost = pool.unitCost * times;
    const msg = document.getElementById("gacha-msg");
    const stage = document.getElementById("gacha-stage");

    await refreshBalance();
    if (cost > myBalance) {
      msg.style.color = "var(--red)";
      msg.innerText = `残高不足です（${cost.toLocaleString()} n 必要）`;
      return;
    }

    await updateCloudBalance(-cost);
    isPullingGacha = true;
    setPullButtonsDisabled(true);
    msg.style.color = "var(--muted)";
    msg.innerText = `${times}連抽選中...`;

    stage.innerHTML = `<div class="gacha-box-icon shaking">${pool.icon}</div><div style="font-size:0.85rem; color:var(--gold); margin-top:6px;">${times}連 開封中...</div>`;

    setTimeout(() => {
      const results = [];
      const inv = loadInventory();
      let hitCount = 0;
      const summaryMap = {};

      for (let i = 0; i < times; i++) {
        const item = rollSingleGacha(pool);
        results.push(item);
        const key = `${item.rarity}|${item.emoji}|${item.name}|${item.isMiss}`;
        summaryMap[key] = (summaryMap[key] || 0) + 1;

        if (!item.isMiss) {
          hitCount++;
          const label = `${item.emoji} [${item.rarity}] ${item.name}`;
          inv[label] = (inv[label] || 0) + 1;
        }
      }
      saveInventory(inv);

      if (times === 1) {
        const it = results[0];
        stage.innerHTML = `
          <div class="gacha-card rarity-${it.rarity}" style="width:250px; padding:14px; justify-content:center;">
            <div class="emoji" style="font-size:2.4rem;">${it.emoji}</div>
            <div>
              <div style="font-size:0.75rem;">[${it.rarity === "MISS" ? "ハズレ" : it.rarity}]</div>
              <div style="font-size:0.95rem; margin-top:2px;">${it.name}</div>
            </div>
          </div>
        `;
      } else if (times === 10) {
        stage.innerHTML = `<div class="gacha-grid">` + results.map(it => `
          <div class="gacha-card rarity-${it.rarity}">
            <div class="emoji">${it.emoji}</div>
            <div>
              <div style="font-size:0.65rem;">[${it.rarity === "MISS" ? "ハズレ" : it.rarity}]</div>
              <div>${it.name}</div>
            </div>
          </div>
        `).join("") + `</div>`;
      } else {
        // 100連・1000連はレアリティ別の集計リストで見やすく表示
        const rows = pool.items.map(it => {
          const key = `${it.rarity}|${it.emoji}|${it.name}|${it.isMiss}`;
          const cnt = summaryMap[key] || 0;
          if (cnt === 0) return "";
          return `
            <div class="gacha-card rarity-${it.rarity}" style="justify-content:space-between; padding:9px 12px;">
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="emoji">${it.emoji}</span>
                <span>[${it.rarity === "MISS" ? "ハズレ" : it.rarity}] ${it.name}</span>
              </div>
              <span style="font-size:0.95rem;">× ${cnt.toLocaleString()}</span>
            </div>
          `;
        }).join("");
        stage.innerHTML = `<div class="gacha-summary-list">${rows}</div>`;
      }

      if (hitCount > 0) {
        msg.style.color = "var(--green)";
        msg.innerText = `🎉 ${times}連中 ${hitCount}個当選！下の持ち物から受取申請できます`;
      } else {
        msg.style.color = "var(--red)";
        msg.innerText = `💀 ${times}連すべてハズレでした...`;
      }

      isPullingGacha = false;
      setPullButtonsDisabled(false);
    }, 850);
  }

  async function claimSingleItem(label) {
    const inv = loadInventory();
    const count = inv[label] || 0;
    if (count <= 0) return;

    const msg = document.getElementById("gacha-msg");
    const payload = `━━━━━━━━━━━━━━\n**🎁 RPGガチャ景品 受取申請**\n👤 MCID: \`${me}\`\n🎒 アイテム: **${label} × ${count}**\n━━━━━━━━━━━━━━`;
    const ok = await notifyDiscord(payload);
    if (ok) {
      delete inv[label];
      saveInventory(inv);
      msg.style.color = "var(--green)";
      msg.innerText = `✅ 「${label} × ${count}」の受取申請を運営に送信しました！`;
    } else {
      msg.style.color = "var(--gold)";
      msg.innerText = "⚠️ Webhook URLが未設定か送信に失敗しました";
    }
  }

  async function claimAllItems() {
    const inv = loadInventory();
    const entries = Object.entries(inv).filter(([, count]) => count > 0);
    const msg = document.getElementById("gacha-msg");
    if (entries.length === 0) {
      msg.style.color = "var(--muted)";
      msg.innerText = "申請できるアイテムがありません";
      return;
    }

    const listText = entries.map(([label, count]) => `・**${label}** × ${count}`).join("\n");
    const payload = `━━━━━━━━━━━━━━\n**🎁 RPGガチャ景品 一括受取申請**\n👤 MCID: \`${me}\`\n${listText}\n━━━━━━━━━━━━━━`;
    const ok = await notifyDiscord(payload);
    if (ok) {
      saveInventory({});
      msg.style.color = "var(--green)";
      msg.innerText = "✅ すべての獲得アイテムの受取申請を運営に送信しました！";
    } else {
      msg.style.color = "var(--gold)";
      msg.innerText = "⚠️ Webhook URLが未設定か送信に失敗しました";
    }
  }

  // 🏆 ランキング読み込み
  async function loadRanking() {
    const box = document.getElementById("rank-list");
    box.innerHTML = "<div style='text-align:center; color:var(--muted); padding:16px;'>読み込み中...</div>";
    const { data, error } = await sb
      .from("casino_users")
      .select("mcid, balance")
      .order("balance", { ascending: false })
      .limit(20);

    if (error || !data) {
      box.innerHTML = "<div style='color:var(--red); text-align:center;'>読み込みに失敗しました</div>";
      return;
    }

    box.innerHTML = data.map((u, idx) => {
      const rank = idx + 1;
      let badge = `${rank}位`;
      let cls = "rank-badge";
      if (rank === 1) { badge = "🥇"; cls += " rank-1"; }
      else if (rank === 2) { badge = "🥈"; cls += " rank-2"; }
      else if (rank === 3) { badge = "🥉"; cls += " rank-3"; }

      const isMe = u.mcid === me ? " me" : "";
      return `
        <div class="rank-item${isMe}">
          <div class="rank-left">
            <span class="${cls}">${badge}</span>
            <span>${u.mcid}${u.mcid === me ? " <small style='color:var(--gold);'>(あなた)</small>" : ""}</span>
          </div>
          <div class="rank-bal">${Number(u.balance).toLocaleString()} n</div>
        </div>
      `;
    }).join("");
  }

  async function loadAllUsers() {
    const box = document.getElementById("adm-user-list");
    const { data } = await sb.from("casino_users").select("mcid, balance").order("balance", { ascending: false });
    if (!data) return;
    box.innerHTML = data.map(u => `
      <div class="user-row" onclick="document.getElementById('adm-target').value='${u.mcid}'">
        <span>👤 <strong>${u.mcid}</strong></span>
        <span style="color:var(--green);">${Number(u.balance).toLocaleString()} n</span>
      </div>
    `).join("");
  }

  async function adminAddBalance() {
    const target = document.getElementById("adm-target").value.trim();
    const diff = Number(document.getElementById("adm-amount").value);
    const msg = document.getElementById("adm-msg");
    if (!target || !diff) return;

    const { data: u } = await sb.from("casino_users").select("balance").eq("mcid", target).maybeSingle();
    if (!u) { msg.style.color = "var(--red)"; msg.innerText = "そのMCIDは見つかりません"; return; }

    const next = Math.max(0, Number(u.balance) + diff);
    await sb.from("casino_users").update({ balance: next }).eq("mcid", target);
    msg.style.color = "var(--green)";
    msg.innerText = `✅ ${target} の残高を ${next.toLocaleString()} n に更新しました`;
    if (target === me) await refreshBalance();
    await loadAllUsers();
  }

  async function notifyDiscord(text) {
    if (!DISCORD_WEBHOOK_URL) return false;
    try {
      await fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: text })
      });
      return true;
    } catch (e) { return false; }
  }

  async function sendDepositNotice() {
    const type = document.getElementById("req-type").value;
    const amount = Number(document.getElementById("req-amount").value);
    const msg = document.getElementById("req-msg");
    const btn = document.getElementById("req-btn");

    if (amount <= 0) return;
    await refreshBalance();
    if (type.includes("出金") && amount > myBalance) {
      msg.style.color = "var(--red)";
      msg.innerText = "残高不足です";
      return;
    }

    btn.disabled = true;
    const payload = `━━━━━━━━━━━━━━\n**${type}**\n👤 MCID: \`${me}\`\n💵 金額: **${amount.toLocaleString()} n**\n━━━━━━━━━━━━━━`;
    const ok = await notifyDiscord(payload);
    if (ok) {
      if (type.includes("出金")) await updateCloudBalance(-amount);
      msg.style.color = "var(--green)";
      msg.innerText = "✅ 運営のDiscordに通知しました！";
    } else {
      msg.style.color = "var(--gold)";
      msg.innerText = "⚠️ Webhook URLが未設定か送信に失敗しました";
    }
    btn.disabled = false;
  }

  if (me) startApp();
</script>
</body>
</html>
