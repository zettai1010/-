<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スロット[Re]</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #20283d 0%, #0b0f1b 55%, #05070d 100%);
  color: #fff;
  font-family: Arial, "Noto Sans JP", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game {
  width: 720px;
  max-width: 95vw;
  background: #111827;
  border: 2px solid #394866;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 0 35px rgba(0,0,0,.6);
}

/* タイトル */
.title {
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  margin-bottom: 5px;
  color: #f4f5ff;
}

.subtitle {
  text-align: center;
  color: #8e9ab5;
  font-size: 13px;
  margin-bottom: 20px;
}

/* 状態 */
.status {
  background: #1b2335;
  border: 1px solid #34405c;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

.status-name {
  font-size: 22px;
  font-weight: bold;
  color: #cfd7ff;
}

.status-info {
  margin-top: 7px;
  color: #9da9c4;
  font-size: 14px;
}

/* リール */
.reels {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}

.reel {
  width: 150px;
  height: 120px;
  background: linear-gradient(#f5f5f5, #c9c9c9);
  border: 5px solid #59657c;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #111;
  font-size: 38px;
  font-weight: bold;
  box-shadow:
    inset 0 0 15px rgba(0,0,0,.3),
    0 5px 15px rgba(0,0,0,.4);
}

/* START */
.start {
  width: 100%;
  height: 65px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(#6675ff, #4050d7);
  color: white;
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 0 #2935a0;
}

.start:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #2935a0;
}

/* メッセージ */
.message {
  min-height: 65px;
  margin-top: 16px;
  background: #181f30;
  border: 1px solid #303c57;
  border-radius: 10px;
  padding: 14px;
  text-align: center;
  font-size: 17px;
  color: #dfe5ff;
}

/* ボーナス一覧 */
.section-title {
  margin-top: 22px;
  margin-bottom: 10px;
  color: #b9c4ff;
  font-size: 18px;
  font-weight: bold;
}

.bonus-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.bonus {
  background: #1a2233;
  border: 1px solid #303b55;
  border-radius: 9px;
  padding: 12px;
}

.bonus-name {
  font-weight: bold;
  font-size: 15px;
}

.bonus-game {
  color: #8e9ab5;
  font-size: 13px;
  margin-top: 5px;
}

/* 履歴 */
.history {
  margin-top: 15px;
  background: #0d1320;
  border-radius: 10px;
  padding: 10px;
  max-height: 130px;
  overflow-y: auto;
}

.history div {
  padding: 5px;
  border-bottom: 1px solid #202a3d;
  color: #9da9c4;
  font-size: 13px;
}

.reset {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  background: #242d42;
  color: #aeb8d0;
  border: 1px solid #3b4762;
  border-radius: 8px;
  cursor: pointer;
}

@media (max-width: 600px) {
  .game {
    padding: 14px;
  }

  .reel {
    width: 30%;
    height: 90px;
    font-size: 26px;
  }

  .bonus-list {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="title">スロット[Re]</div>
  <div class="subtitle">
    Voidボーナスと無限リプレイ確変を目指せ
  </div>

  <!-- 状態 -->
  <div class="status">
    <div class="status-name" id="stateName">通常時</div>
    <div class="status-info" id="stateInfo">
      小役を消化しながらボーナスを抽選
    </div>
  </div>

  <!-- リール -->
  <div class="reels">
    <div class="reel" id="reel1">7</div>
    <div class="reel" id="reel2">BAR</div>
    <div class="reel" id="reel3">7</div>
  </div>

  <button class="start" id="startButton" onclick="play()">
    START
  </button>

  <div class="message" id="message">
    STARTを押してゲーム開始
  </div>

  <!-- ボーナス -->
  <div class="section-title">ボーナス</div>

  <div class="bonus-list">

    <div class="bonus">
      <div class="bonus-name">レギュラー</div>
      <div class="bonus-game">10G</div>
    </div>

    <div class="bonus">
      <div class="bonus-name">リーフィンド</div>
      <div class="bonus-game">22G</div>
    </div>

    <div class="bonus">
      <div class="bonus-name">ダストロック</div>
      <div class="bonus-game">18G</div>
    </div>

    <div class="bonus">
      <div class="bonus-name">書物の怨念</div>
      <div class="bonus-game">14G</div>
    </div>

  </div>

  <!-- 履歴 -->
  <div class="section-title">ゲーム履歴</div>

  <div class="history" id="history">
    <div>ゲーム開始</div>
  </div>

  <button class="reset" onclick="resetGame()">
    リセット
  </button>

</div>


<script>

let state = "normal";
let remainingGames = 0;

/* ボーナス */
const bonuses = [
  {
    name: "レギュラー",
    games: 10
  },
  {
    name: "リーフィンド",
    games: 22
  },
  {
    name: "ダストロック",
    games: 18
  },
  {
    name: "書物の怨念",
    games: 14
  }
];


/* START */
function play() {

  if (state === "normal") {
    normalGame();
    return;
  }

  if (state === "bonus") {
    bonusGame();
    return;
  }

  if (state === "void") {
    voidGame();
    return;
  }

  if (state === "replay30") {
    replayChanceGame();
    return;
  }

  if (state === "cz") {
    czGame();
    return;
  }

  if (state === "replayInfinite") {
    infiniteReplayGame();
    return;
  }
}


/* 通常時 */
function normalGame() {

  const r = Math.random();

  /*
    通常時
    メロン・チェリーをチャンス役として扱う
  */

  if (r < 0.025) {

    setReels("🍒", "🍒", "🍒");

    message("チェリー！ チャンス役！");
    addHistory("チェリー");

    return;
  }

  if (r < 0.05) {

    setReels("🍈", "🍈", "🍈");

    message("メロン！ チャンス役！");
    addHistory("メロン");

    return;
  }

  /*
    ボーナス抽選
  */

  if (r < 0.065) {

    startBonus();

    return;
  }

  /*
    ハズレ
  */

  setReels("7", "BAR", "🍒");

  message("ハズレ");

  addHistory("通常時：ハズレ");
}


/* ボーナス開始 */
function startBonus() {

  const bonus =
    bonuses[Math.floor(Math.random() * bonuses.length)];

  state = "bonus";
  remainingGames = bonus.games;

  setState(
    "ボーナス",
    bonus.name + " " + bonus.games + "G"
  );

  setReels("BONUS", "BONUS", "BONUS");

  message(
    bonus.name +
    " 突入！ " +
    bonus.games +
    "G"
  );

  addHistory(
    "ボーナス突入：" + bonus.name
  );
}


/* ボーナス中 */
function bonusGame() {

  remainingGames--;

  /*
    ボーナス中にVoid昇格
  */
  if (Math.random() < 0.01) {

    state = "void";
    remainingGames = 100;

    setState(
      "Voidボーナス",
      "100G"
    );

    setReels("VOID", "VOID", "VOID");

    message(
      "⚡ Voidボーナスへ昇格！"
    );

    addHistory(
      "Voidボーナスへ昇格"
    );

    return;
  }

  setReels(
    randomSymbol(),
    randomSymbol(),
    randomSymbol()
  );

  message(
    "ボーナス中　残り " +
    remainingGames +
    "G"
  );

  if (remainingGames <= 0) {

    /*
      ボーナス終了後
      リプレイ確変30Gへ
    */

    state = "replay30";
    remainingGames = 30;

    setState(
      "リプレイ確変",
      "30G"
    );

    message(
      "ボーナス終了！\n" +
      "リプレイ確変30Gへ"
    );

    addHistory(
      "リプレイ確変30Gへ"
    );
  }
}


/* Voidボーナス */
function voidGame() {

  remainingGames--;

  /*
    Void中のゲーム数上乗せ
  */
  if (Math.random() < 0.02) {

    remainingGames += 10;

    message(
      "ゲーム数上乗せ！ +10G\n" +
      "残り " + remainingGames + "G"
    );

    addHistory("Void中：+10G");

    return;
  }

  setReels(
    "VOID",
    randomSymbol(),
    "VOID"
  );

  message(
    "Voidボーナス中\n残り " +
    remainingGames +
    "G"
  );

  if (remainingGames <= 0) {

    /*
      Void終了後は無限リプレイ確変
    */

    state = "replayInfinite";

    setState(
      "リプレイ確変（無限）",
      "終了条件なし"
    );

    setReels(
      "REPLAY",
      "REPLAY",
      "REPLAY"
    );

    message(
      "Voidボーナス終了\n" +
      "リプレイ確変（無限）へ！"
    );

    addHistory(
      "リプレイ確変（無限）へ"
    );
  }
}


/* リプレイ確変30G */
function replayChanceGame() {

  remainingGames--;

  /*
    リプレイ確変中
  */

  const r = Math.random();

  if (r < 0.02) {

    /*
      ボーナス
    */

    startBonus();

    return;
  }

  if (r < 0.10) {

    /*
      CZ突入
    */

    state = "cz";
    remainingGames = 5;

    setState(
      "CZ",
      "5G"
    );

    setReels(
      "CZ",
      "CZ",
      "CZ"
    );

    message(
      "CZ突入！\n5G間のチャンス"
    );

    addHistory("CZ突入");

    return;
  }

  setReels(
    "REPLAY",
    "REPLAY",
    "BAR"
  );

  message(
    "リプレイ確変中\n残り " +
    remainingGames +
    "G"
  );

  if (remainingGames <= 0) {

    state = "normal";

    setState(
      "通常時",
      "小役を消化しながらボーナスを抽選"
    );

    message(
      "リプレイ確変終了\n通常時へ"
    );

    addHistory(
      "リプレイ確変終了"
    );
  }
}


/* CZ */
function czGame() {

  remainingGames--;

  /*
    CZ中に成功
  */

  if (Math.random() < 0.13) {

    state = "replayInfinite";

    setState(
      "リプレイ確変（無限）",
      "終了条件なし"
    );

    setReels(
      "REPLAY",
      "REPLAY",
      "REPLAY"
    );

    message(
      "CZ成功！\n" +
      "リプレイ確変（無限）へ！"
    );

    addHistory(
      "CZ成功 → 無限リプレイ確変"
    );

    return;
  }

  setReels(
    "REPLAY",
    "7",
    "BAR"
  );

  message(
    "CZ中…… 残り " +
    remainingGames +
    "G"
  );

  if (remainingGames <= 0) {

    state = "normal";

    setState(
      "通常時",
      "小役を消化しながらボーナスを抽選"
    );

    message(
      "CZ終了\n通常時へ"
    );

    addHistory(
      "CZ失敗"
    );
  }
}


/* 無限リプレイ確変 */
function infiniteReplayGame() {

  const r = Math.random();

  if (r < 0.04) {

    /*
      Voidボーナス
    */

    state = "void";
    remainingGames = 100;

    setState(
      "Voidボーナス",
      "100G"
    );

    setReels(
      "VOID",
      "VOID",
      "VOID"
    );

    message(
      "Voidボーナス当選！"
    );

    addHistory(
      "無限リプレイ確変 → Void"
    );

    return;
  }

  if (r < 0.08) {

    startBonus();

    return;
  }

  setReels(
    "REPLAY",
    "REPLAY",
    "REPLAY"
  );

  message(
    "リプレイ確変（無限）\n" +
    "終了条件なし"
  );

  addHistory(
    "無限リプレイ確変：リプレイ"
  );
}


/* リール */
function setReels(a, b, c) {

  document.getElementById("reel1").textContent = a;
  document.getElementById("reel2").textContent = b;
  document.getElementById("reel3").textContent = c;
}


/* ランダム図柄 */
function randomSymbol() {

  const symbols = [
    "7",
    "BAR",
    "🍒",
    "🍈",
    "REPLAY"
  ];

  return symbols[
    Math.floor(Math.random() * symbols.length)
  ];
}


/* 状態変更 */
function setState(name, info) {

  document.getElementById(
    "stateName"
  ).textContent = name;

  document.getElementById(
    "stateInfo"
  ).textContent = info;
}


/* メッセージ */
function message(text) {

  document.getElementById(
    "message"
  ).innerHTML = text.replace(/\n/g, "<br>");
}


/* 履歴 */
function addHistory(text) {

  const history =
    document.getElementById("history");

  const item =
    document.createElement("div");

  item.textContent = text;

  history.prepend(item);
}


/* リセット */
function resetGame() {

  state = "normal";
  remainingGames = 0;

  setState(
    "通常時",
    "小役を消化しながらボーナスを抽選"
  );

  setReels(
    "7",
    "BAR",
    "7"
  );

  message(
    "STARTを押してゲーム開始"
  );

  document.getElementById(
    "history"
  ).innerHTML =
    "<div>ゲームリセット</div>";
}

</script>

</body>
</html>
