<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASINO [Re]</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #242424 0%, #0d0d0d 55%, #000 100%);
  color: white;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   LOGIN
========================= */

#loginScreen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.loginBox {
  width: 380px;
  max-width: 100%;
  background: linear-gradient(145deg, #1e1e1e, #080808);
  border: 3px solid #777;
  border-radius: 18px;
  padding: 35px 25px;
  box-shadow:
    0 0 30px rgba(255, 210, 0, 0.15),
    inset 0 0 20px rgba(255,255,255,0.03);
  text-align: center;
}

.loginTitle {
  font-size: 38px;
  font-weight: bold;
  color: #ffd21a;
  text-shadow:
    0 0 8px #ffae00,
    0 0 20px #ff6a00;
  margin-bottom: 8px;
}

.loginSub {
  color: #aaa;
  margin-bottom: 25px;
}

.loginBox input {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border-radius: 8px;
  border: 1px solid #555;
  background: #111;
  color: white;
  font-size: 16px;
  outline: none;
}

.loginBox input:focus {
  border-color: #ffd21a;
}

.loginBtn {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  background: linear-gradient(#ffe45a, #e5a900);
  color: #111;
  font-size: 18px;
  font-weight: bold;
}

.registerBtn {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: 1px solid #777;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 16px;
}

.loginBtn:hover,
.registerBtn:hover {
  filter: brightness(1.15);
}

#loginMessage {
  min-height: 25px;
  margin-top: 15px;
  color: #ff6868;
  font-size: 14px;
}

/* =========================
   HUB
========================= */

#hubScreen {
  min-height: 100vh;
  padding: 25px;
}

.hubHeader {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  border-bottom: 2px solid #444;
  padding-bottom: 15px;
}

.logo {
  color: #ffd21a;
  font-size: 32px;
  font-weight: bold;
  text-shadow: 0 0 12px #ff8800;
}

.accountArea {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.coins {
  background: #151515;
  border: 1px solid #777;
  border-radius: 8px;
  padding: 10px 15px;
  color: #ffd21a;
  font-weight: bold;
}

.logoutBtn {
  padding: 10px 15px;
  background: #222;
  border: 1px solid #666;
  color: white;
  border-radius: 7px;
}

.hubTitle {
  text-align: center;
  margin: 50px 0 30px;
  font-size: 32px;
}

.gameGrid {
  max-width: 1100px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.gameCard {
  background: linear-gradient(145deg, #242424, #0b0b0b);
  border: 2px solid #555;
  border-radius: 15px;
  padding: 25px;
  min-height: 200px;
  box-shadow: 0 0 15px rgba(255,255,255,0.04);
}

.gameCard h2 {
  color: #ffd21a;
}

.gameCard p {
  color: #aaa;
  min-height: 45px;
}

.gameCard button {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 7px;
  background: linear-gradient(#ffe45a, #d99e00);
  font-weight: bold;
  font-size: 16px;
}

.gameCard.disabled {
  opacity: 0.45;
}

.gameCard.disabled button {
  cursor: not-allowed;
}

/* =========================
   SLOT
========================= */

#slotScreen {
  min-height: 100vh;
  padding: 20px;
}

.slotTop {
  max-width: 1000px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.backBtn {
  padding: 10px 15px;
  background: #222;
  color: white;
  border: 1px solid #666;
  border-radius: 7px;
}

.machine {
  width: 650px;
  max-width: 100%;
  margin: 20px auto;
  background:
    linear-gradient(145deg, #292929, #090909);
  border: 8px solid #777;
  border-radius: 20px;
  padding: 25px;
  box-shadow:
    0 0 35px rgba(0,0,0,0.8),
    inset 0 0 25px rgba(255,255,255,0.05);
}

.machineTitle {
  text-align: center;
  color: #ffd21a;
  font-size: 40px;
  font-weight: bold;
  text-shadow:
    0 0 8px #ff8c00,
    0 0 20px #ff4500;
  margin-bottom: 15px;
}

.status {
  text-align: center;
  min-height: 28px;
  color: #ddd;
  margin-bottom: 10px;
}

.reels {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px auto;
}

.reel {
  width: 170px;
  height: 150px;
  background: linear-gradient(#fafafa, #ccc);
  border: 6px solid #555;
  border-radius: 10px;
  color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 65px;
  font-weight: bold;
  box-shadow:
    inset 0 0 15px rgba(0,0,0,0.4),
    0 4px 10px #000;
}

.gogo {
  width: 150px;
  height: 65px;
  margin: 10px auto 20px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #ffd21a 20%, #ff7b00 45%, #700 100%);
  border: 6px solid #333;
  box-shadow:
    0 0 15px #ff9d00,
    0 0 30px rgba(255,100,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  text-shadow: 0 0 5px #000;
}

.controls {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.spinBtn {
  padding: 18px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(#ffe45a, #d99e00);
  font-size: 25px;
  font-weight: bold;
  color: #111;
}

.spinBtn:active {
  transform: scale(0.98);
}

.result {
  text-align: center;
  min-height: 45px;
  margin-top: 15px;
  font-size: 22px;
  font-weight: bold;
}

.slotInfo {
  text-align: center;
  color: #aaa;
  margin-top: 10px;
}

/* WIN EFFECT */

.winEffect {
  animation: winFlash 0.7s ease;
}

@keyframes winFlash {
  0% {
    filter: brightness(1);
  }
  30% {
    filter: brightness(3);
  }
  60% {
    filter: brightness(1.5);
  }
  100% {
    filter: brightness(1);
  }
}

@media (max-width: 600px) {
  .machineTitle {
    font-size: 30px;
  }

  .reel {
    width: 30%;
    height: 110px;
    font-size: 45px;
  }

  .machine {
    padding: 15px;
  }
}
</style>
</head>

<body>

<section id="loginScreen">

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://yazkexvgmdyjeeimmayq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_87rSIEju76172IK7boCx_g_y_2qPHpe";


/*
  ★重要★

  persistSession: false

  これによってブラウザを閉じたり
  ページを更新したときに
  自動ログインしなくなる。
*/

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    }
  );


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;
let medals = 0;

let saveQueue = Promise.resolve();

const BET = 3;


/* =====================================================
   ID → 内部メール
===================================================== */

function idToEmail(id) {
  return id.toLowerCase() + "@casino-re.local";
}


/* =====================================================
   IDチェック
===================================================== */

function validId(id) {

  return /^[a-zA-Z0-9_-]{3,20}$/.test(id);

}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  const id =
    document.getElementById("loginId").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  message.style.color = "#ff6868";
  message.textContent = "";


  if (!validId(id)) {

    message.textContent =
      "IDは3～20文字の英数字・_・-で入力してね。";

    return;
  }


  if (!password) {

    message.textContent =
      "パスワードを入力してね。";

    return;
  }


  message.textContent =
    "ログイン中...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: idToEmail(id),

      password: password

    });


  if (error) {

    console.error("LOGIN ERROR:", error);

    message.textContent =
      "ログインできませんでした："
      + error.message;

    return;
  }


  currentUser = data.user;


  const loaded =
    await loadProfile();


  if (!loaded) {

    await supabaseClient.auth.signOut();

    currentUser = null;

    message.textContent =
      "コインデータを読み込めませんでした。";

    return;
  }


  message.style.color = "#5cff8a";

  message.textContent =
    "ログイン成功！";


  showHub();

}


/* =====================================================
   REGISTER
===================================================== */

async function register() {

  const id =
    document.getElementById("loginId").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");


  message.style.color = "#ff6868";
  message.textContent = "";


  if (!validId(id)) {

    message.textContent =
      "IDは3～20文字の英数字・_・-で入力してね。";

    return;
  }


  if (password.length < 6) {

    message.textContent =
      "パスワードは6文字以上にしてね。";

    return;
  }


  message.textContent =
    "アカウント作成中...";


  const { data, error } =
    await supabaseClient.auth.signUp({

      email: idToEmail(id),

      password: password

    });


  if (error) {

    console.error("REGISTER ERROR:", error);

    message.textContent =
      "登録できません："
      + error.message;

    return;
  }


  /*
    Supabase側でConfirm emailがONの場合、
    sessionが存在しないことがある。
  */

  if (!data.session) {

    message.textContent =
      "アカウントは作成されました。"
      + "SupabaseのConfirm emailをOFFにしてください。";

    return;
  }


  currentUser = data.user;


  const profileOK =
    await ensureProfile();


  if (!profileOK) {

    console.error(
      "プロフィール作成に失敗しました"
    );

    await supabaseClient.auth.signOut();

    currentUser = null;

    message.textContent =
      "アカウントは作成されましたが、"
      + "コインデータを作成できませんでした。";

    return;
  }


  const loaded =
    await loadProfile();


  if (!loaded) {

    message.textContent =
      "コインデータを読み込めませんでした。";

    return;
  }


  message.style.color = "#5cff8a";

  message.textContent =
    "登録完了！";


  showHub();

}


/* =====================================================
   PROFILE確認
===================================================== */

async function ensureProfile() {

  if (!currentUser) {

    return false;

  }


  console.log(
    "PROFILE CHECK:",
    currentUser.id
  );


  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("id, coins")
      .eq("id", currentUser.id)
      .maybeSingle();


  if (error) {

    console.error(
      "PROFILE SELECT ERROR:",
      error
    );

    return false;
  }


  /*
    すでに存在するなら何もしない
  */

  if (data) {

    return true;

  }


  console.log(
    "PROFILE CREATE:",
    currentUser.id
  );


  const { error: insertError } =
    await supabaseClient
      .from("profiles")
      .insert({

        id: currentUser.id,

        coins: 1000

      });


  if (insertError) {

    console.error(
      "PROFILE CREATE ERROR:",
      insertError
    );

    return false;
  }


  console.log(
    "PROFILE CREATE SUCCESS"
  );


  return true;

}


/* =====================================================
   PROFILE読み込み
===================================================== */

async function loadProfile() {

  if (!currentUser) {

    return false;

  }


  const profileOK =
    await ensureProfile();


  if (!profileOK) {

    return false;

  }


  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("id, coins")
      .eq("id", currentUser.id)
      .maybeSingle();


  if (error) {

    console.error(
      "PROFILE LOAD ERROR:",
      error
    );

    return false;
  }


  if (!data) {

    return false;

  }


  medals =
    Number(data.coins ?? 0);


  updateCoins();


  return true;

}


/* =====================================================
   COIN表示
===================================================== */

function updateCoins() {

  document.getElementById("hubCoins").textContent =
    medals.toLocaleString();

  document.getElementById("slotCoins").textContent =
    medals.toLocaleString();

}


/* =====================================================
   COIN保存
===================================================== */

function saveCoins() {

  if (!currentUser) {

    return Promise.resolve();

  }


  const coinsToSave =
    Number(medals);


  saveQueue =
    saveQueue.then(async () => {

      const { error } =
        await supabaseClient
          .from("profiles")
          .update({

            coins: coinsToSave

          })
          .eq("id", currentUser.id);


      if (error) {

        console.error(
          "COIN SAVE ERROR:",
          error
        );

      }

    });


  return saveQueue;

}


/* =====================================================
   HUB表示
===================================================== */

function showHub() {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("slotScreen")
    .classList.add("hidden");

  document
    .getElementById("hubScreen")
    .classList.remove("hidden");


  document.getElementById("hubPlayer").textContent =
    "ID: " +
    currentUser.email.split("@")[0];


  updateCoins();

}


/* =====================================================
   SLOTを開く
===================================================== */

function openSlot() {

  document
    .getElementById("hubScreen")
    .classList.add("hidden");

  document
    .getElementById("slotScreen")
    .classList.remove("hidden");

  updateCoins();

}


/* =====================================================
   HUBへ戻る
===================================================== */

function backToHub() {

  document
    .getElementById("slotScreen")
    .classList.add("hidden");

  document
    .getElementById("hubScreen")
    .classList.remove("hidden");

  updateCoins();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  /*
    保存処理が残っていたら
    完了するまで待つ。
  */

  await saveQueue;


  await supabaseClient.auth.signOut();


  currentUser = null;

  medals = 0;


  document
    .getElementById("hubScreen")
    .classList.add("hidden");

  document
    .getElementById("slotScreen")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");


  document.getElementById("loginId").value = "";
  document.getElementById("loginPassword").value = "";

  document.getElementById("loginMessage").textContent = "";

}


/* =====================================================
   SETTINGS
===================================================== */

const BONUS_PROBABILITY = {

  1: 1 / 280,

  2: 1 / 250,

  3: 1 / 225,

  4: 1 / 200,

  5: 1 / 180,

  6: 1 / 160,

  7: 1 / 140

};


const SETTING_WEIGHTS = {

  1: 50,

  2: 24,

  3: 15,

  4: 7,

  5: 3,

  6: 1,

  7: 1

};


let currentSetting = 1;


/* =====================================================
   SETTING抽選
===================================================== */

function chooseSetting() {

  const total =
    Object.values(SETTING_WEIGHTS)
      .reduce((a, b) => a + b, 0);


  let random =
    Math.random() * total;


  for (const setting in SETTING_WEIGHTS) {

    random -= SETTING_WEIGHTS[setting];


    if (random <= 0) {

      return Number(setting);

    }

  }


  return 1;

}


/* =====================================================
   1時間ごとに設定変更
===================================================== */

function updateSettingHourly() {

  currentSetting =
    chooseSetting();

}


setInterval(
  updateSettingHourly,
  60 * 60 * 1000
);


/* =====================================================
   BONUS
===================================================== */

const BONUS_TYPES = [

  {
    name: "レギュラー",
    payout: 50
  },

  {
    name: "リーフィンド",
    payout: 110
  },

  {
    name: "ダストロック",
    payout: 110
  },

  {
    name: "書物の怨念",
    payout: 110
  },

  {
    name: "Void",
    payout: 1000
  }

];


/* =====================================================
   BONUS抽選
===================================================== */

function drawBonus() {

  const probability =
    BONUS_PROBABILITY[currentSetting];


  if (Math.random() >= probability) {

    return null;

  }


  /*
    Voidはかなり低確率
  */

  const r = Math.random();


  if (r < 0.005) {

    return BONUS_TYPES[4];

  }


  const normalBonuses =
    BONUS_TYPES.slice(0, 4);


  return normalBonuses[
    Math.floor(
      Math.random() * normalBonuses.length
    )
  ];

}


/* =====================================================
   REEL抽選
===================================================== */

function randomSymbol() {

  const symbols = [

    "7",
    "7",
    "7",
    "BAR",
    "BAR",
    "🍒",
    "🍒",
    "🍉",
    "🔔",
    "🔔",
    "★"

  ];


  return symbols[
    Math.floor(
      Math.random() * symbols.length
    )
  ];

}


/* =====================================================
   SPIN
===================================================== */

function spin() {

  if (!currentUser) {

    return;

  }


  const result =
    document.getElementById("result");

  const status =
    document.getElementById("slotStatus");

  const machine =
    document.querySelector(".machine");


  /*
    コイン不足
  */

  if (medals < BET) {

    result.textContent =
      "コインが足りません！";

    return;

  }


  /*
    BET
  */

  medals -= BET;

  updateCoins();

  saveCoins();


  /*
    リール
    アニメーションなし
  */

  const reel1 =
    document.getElementById("reel1");

  const reel2 =
    document.getElementById("reel2");

  const reel3 =
    document.getElementById("reel3");


  /*
    BONUS抽選
  */

  const bonus =
    drawBonus();


  if (bonus) {

    /*
      777
    */

    reel1.textContent = "7";
    reel2.textContent = "7";
    reel3.textContent = "7";


    result.textContent =
      "🎉 " +
      bonus.name +
      " BONUS！ +" +
      bonus.payout;


    status.textContent =
      "777 BONUS";


    medals += bonus.payout;


    updateCoins();

    saveCoins();


    /*
      当たり時だけ演出
    */

    machine.classList.remove("winEffect");

    void machine.offsetWidth;

    machine.classList.add("winEffect");


    /*
      GOGOランプ
    */

    document.querySelector(".gogo").style.boxShadow =
      "0 0 25px #ffff00, 0 0 60px #ff8800";


    setTimeout(() => {

      machine.classList.remove("winEffect");

    }, 700);


    return;

  }


  /*
    ハズレ
  */

  reel1.textContent =
    randomSymbol();

  reel2.textContent =
    randomSymbol();

  reel3.textContent =
    randomSymbol();


  /*
    2ぞろいは作らない
  */

  if (
    reel1.textContent === reel2.textContent &&
    reel2.textContent === reel3.textContent
  ) {

    reel3.textContent =
      "BAR";

  }


  result.textContent =
    "ハズレ";

  status.textContent =
    "READY";


  document.querySelector(".gogo").style.boxShadow =
    "0 0 15px #ff9d00, 0 0 30px rgba(255,100,0,0.4)";

}
