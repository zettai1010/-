<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P 東京喰種 -極・狂気LT仕様-</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #1b0004 0%, #050505 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }
    .cabinet {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(180deg, #2b0409 0%, #111113 25%, #160205 85%, #2b0409 100%);
      border: 3px solid #ff1a40;
      box-shadow: 0 0 35px rgba(255, 0, 50, 0.45), inset 0 0 20px rgba(0, 0, 0, 0.9);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }
    /* ヘッダー情報 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.65);
      border: 1px solid #4a0d16;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .badge-setting select {
      background: #250207;
      color: #ff4d6d;
      border: 1px solid #ff1a40;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: bold;
      outline: none;
      font-size: 12px;
    }
    .counter-display {
      display: flex;
      gap: 12px;
      font-weight: bold;
    }
    .counter-val {
      color: #ff3355;
      font-family: monospace;
      font-size: 15px;
    }

    /* メイン液晶画面 */
    .lcd-screen {
      height: 310px;
      background: radial-gradient(circle at center, #26050b 0%, #000000 95%);
      border: 2px solid #ff2a4b;
      border-radius: 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 25px rgba(255, 0, 40, 0.35);
    }
    .status-banner {
      font-size: 13px;
      font-weight: 800;
      padding: 4px 16px;
      border-radius: 20px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #ff2a4b;
      color: #ff5e78;
      letter-spacing: 1px;
    }
    .mode-lt {
      border-color: #ffd700 !important;
      color: #ffd700 !important;
      background: rgba(40, 30, 0, 0.85) !important;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      animation: pulse 1s infinite alternate;
    }

    /* デジタル図柄表示 */
    .reels-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      z-index: 2;
    }
    .digit-box {
      width: 82px;
      height: 110px;
      background: linear-gradient(180deg, #1f0206 0%, #450912 50%, #1f0206 100%);
      border: 2px solid #ff3b5c;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 15px #ff1a40, 0 0 30px #ff0033;
      box-shadow: 0 6px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,50,80,0.4);
      transition: transform 0.1s ease;
    }
    .digit-box.spinning {
      filter: blur(2px);
      animation: digitShake 0.08s infinite;
      color: #ff8599;
    }

    /* リーチ・覚醒・LT演出オーバーレイ */
    .overlay-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      width: 100%;
      pointer-events: none;
      z-index: 10;
      display: none;
    }
    .reach-text {
      color: #ff1133;
      text-shadow: 0 0 20px #ff0000, 0 0 40px #fff;
      animation: reachPop 0.4s infinite alternate;
    }

    /* 下部ステータス表示 */
    .screen-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
      color: #bbb;
      z-index: 2;
    }

    /* 大型PUSHボタン */
    .push-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
    }
    .giant-push-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff4d6d, #b3001e 60%, #4a000a);
      border: 4px solid #ff99aa;
      box-shadow: 0 8px 0 #59000d, 0 12px 25px rgba(255, 0, 40, 0.6);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: all 0.06s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .giant-push-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #59000d, 0 5px 15px rgba(255, 0, 40, 0.4);
    }
    .giant-push-btn.ready-judge {
      animation: judgeGlow 0.4s infinite alternate;
      border-color: #ffd700;
      background: radial-gradient(circle at 35% 35%, #ff3300, #ff0055 60%, #660011);
    }
    .push-subtext {
      font-size: 11px;
      font-weight: 700;
      color: #ffd;
      margin-top: 2px;
    }

    /* 操作コントロール */
    .controls-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }
    .btn {
      background: linear-gradient(180deg, #333 0%, #1a1a1a 100%);
      color: #fff;
      border: 1px solid #555;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.1s ease;
    }
    .btn:active {
      background: #111;
    }
    .btn-spin {
      background: linear-gradient(180deg, #d90429 0%, #7a0014 100%);
      border-color: #ff4d6d;
      box-shadow: 0 4px 12px rgba(217, 4, 41, 0.4);
      font-size: 17px;
    }
    .btn-auto.active {
      background: linear-gradient(180deg, #00b4d8 0%, #0077b6 100%);
      border-color: #90e0ef;
      box-shadow: 0 0 12px #00b4d8;
    }

    /* 検証デバッグバー */
    .debug-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: rgba(0,0,0,0.5);
      padding: 8px;
      border-radius: 8px;
      border: 1px dashed #444;
    }
    .btn-dbg {
      background: #222;
      border: 1px solid #666;
      color: #bbb;
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      flex: 1 1 auto;
    }
    .btn-dbg:hover {
      background: #333;
      color: #fff;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }
    @keyframes digitShake {
      0% { transform: translateY(-2px); }
      50% { transform: translateY(2px); }
      100% { transform: translateY(-2px); }
    }
    @keyframes reachPop {
      0% { transform: translate(-50%, -50%) scale(0.9); }
      100% { transform: translate(-50%, -50%) scale(1.1); }
    }
    @keyframes judgeGlow {
      0% { box-shadow: 0 0 10px #ff0055, 0 8px 0 #59000d; }
      100% { box-shadow: 0 0 35px #ffd700, 0 8px 0 #59000d; }
    }
  </style>
</head>
<body>

  <div class="cabinet">
    <!-- ヘッダー情報 -->
    <div class="header-bar">
      <div class="badge-setting">
        設定:
        <select id="settingSelect">
          <option value="1079">設定1 (1/1079)</option>
          <option value="1056">設定2 (1/1056)</option>
          <option value="1022">設定3 (1/1022)</option>
          <option value="999">設定4 (1/999)</option>
          <option value="961">設定5 (1/961)</option>
          <option value="924">設定6 (1/924)</option>
          <option value="873">設定7 (1/873)</option>
        </select>
      </div>
      <div class="counter-display">
        <div>玉: <span id="ballsVal" class="counter-val">1500</span></div>
        <div>回転: <span id="spinsVal" class="counter-val">0</span></div>
      </div>
    </div>

    <!-- メイン液晶画面 -->
    <div class="lcd-screen" id="lcdScreen">
      <div id="modeBanner" class="status-banner">通常モード (1回15玉)</div>

      <!-- デジタル図柄 -->
      <div class="reels-wrapper">
        <div class="digit-box" id="reel1">7</div>
        <div class="digit-box" id="reel2">7</div>
        <div class="digit-box" id="reel3">7</div>
      </div>

      <!-- 演出テキスト -->
      <div id="reachOverlay" class="overlay-message reach-text">激 熱 リーチ!!</div>
      <div id="judgeOverlay" class="overlay-message" style="color:#ffd700; text-shadow:0 0 25px #ff0055;">
        PUSHでLTを掴み取れ!!
      </div>

      <div class="screen-footer">
        <div>獲得出玉: <span id="bonusPayout" style="color:#ffd700;">0</span> 発</div>
        <div>ST残り: <span id="rushCount" style="color:#ff3355;">-</span> 回</div>
      </div>
    </div>

    <!-- PUSHボタン -->
    <div class="push-area">
      <button id="pushBtn" class="giant-push-btn">
        <span>PUSH</span>
        <span class="push-subtext" id="pushLabel">押して変動</span>
      </button>
    </div>

    <!-- コントロールボタン -->
    <div class="controls-grid">
      <button id="spinBtn" class="btn btn-spin">
        SPIN (1回転)
      </button>
      <button id="autoBtn" class="btn btn-auto">
        AUTO OFF
      </button>
    </div>

    <!-- テスト検証バー -->
    <div class="debug-bar">
      <button class="btn-dbg" id="dbgHitBtn">🎯 即・大当り</button>
      <button class="btn-dbg" id="dbgLtBtn">⚡ 即・極LT突入</button>
      <button class="btn-dbg" id="dbgSkipBtn">⏩ 100回転スキップ</button>
      <button class="btn-dbg" id="dbgRefillBtn">🪙 +1500玉補充</button>
    </div>
  </div>

  <script>
    // --- Web Audio サウンド生成 ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function initAudio() {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
    }
    function playBeep(freq, type = 'sine', duration = 0.08, vol = 0.2) {
      if (!actx) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(vol, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + duration);
      } catch (e) {}
    }
    function playHeartbeat() {
      playBeep(65, 'triangle', 0.2, 0.4);
      setTimeout(() => playBeep(55, 'triangle', 0.25, 0.35), 180);
    }
    function playFanfare() {
      const notes = [440, 554, 659, 880];
      notes.forEach((f, idx) => {
        setTimeout(() => playBeep(f, 'sawtooth', 0.3, 0.2), idx * 120);
      });
    }

    // --- ゲーム状態管理 ---
    const STATE_NORMAL = 'NORMAL';
    const STATE_JUDGE = 'JUDGE';       // LTチャレンジ
    const STATE_RUSH_NORMAL = 'RUSH';  // 通常RUSH (ST50回, 1/39.9)
    const STATE_RUSH_LT = 'LT';        // 極・覚醒LT (ST140回, 1/29.9)

    let currentMode = STATE_NORMAL;
    let balls = 1500;
    let totalSpins = 0;
    let rushRemaining = 0;
    let bonusPayoutTotal = 0;
    let isSpinning = false;
    let isAuto = false;
    let autoInterval = null;

    // DOM要素
    const settingSelect = document.getElementById('settingSelect');
    const ballsVal = document.getElementById('ballsVal');
    const spinsVal = document.getElementById('spinsVal');
    const reel1 = document.getElementById('reel1');
    const reel2 = document.getElementById('reel2');
    const reel3 = document.getElementById('reel3');
    const modeBanner = document.getElementById('modeBanner');
    const reachOverlay = document.getElementById('reachOverlay');
    const judgeOverlay = document.getElementById('judgeOverlay');
    const pushBtn = document.getElementById('pushBtn');
    const pushLabel = document.getElementById('pushLabel');
    const spinBtn = document.getElementById('spinBtn');
    const autoBtn = document.getElementById('autoBtn');
    const bonusPayout = document.getElementById('bonusPayout');
    const rushCount = document.getElementById('rushCount');

    // UI更新
    function updateUI() {
      ballsVal.innerText = balls;
      spinsVal.innerText = totalSpins;
      bonusPayout.innerText = bonusPayoutTotal;
      rushCount.innerText = (currentMode === STATE_RUSH_NORMAL || currentMode === STATE_RUSH_LT) ? rushRemaining : '-';

      if (currentMode === STATE_NORMAL) {
        modeBanner.className = 'status-banner';
        modeBanner.innerText = '通常モード (1回15玉)';
        pushLabel.innerText = '押して変動';
        pushBtn.classList.remove('ready-judge');
      } else if (currentMode === STATE_JUDGE) {
        modeBanner.className = 'status-banner mode-lt';
        modeBanner.innerText = '運命のLTチャレンジ！';
        pushLabel.innerText = '一撃を叩き込め！';
        pushBtn.classList.add('ready-judge');
      } else if (currentMode === STATE_RUSH_LT) {
        modeBanner.className = 'status-banner mode-lt';
        modeBanner.innerText = '極・覚醒 東京喰種 LT (無料消化中)';
        pushLabel.innerText = '高速即当り待機';
        pushBtn.classList.remove('ready-judge');
      } else if (currentMode === STATE_RUSH_NORMAL) {
        modeBanner.className = 'status-banner';
        modeBanner.style.borderColor = '#00e5ff';
        modeBanner.style.color = '#00e5ff';
        modeBanner.innerText = '東京喰種 RUSH (無料消化中)';
        pushLabel.innerText = '高速即当り待機';
        pushBtn.classList.remove('ready-judge');
      }
    }

    // 内部抽選確率の取得
    function getDenominator() {
      if (currentMode === STATE_RUSH_LT) return 29.9;
      if (currentMode === STATE_RUSH_NORMAL) return 39.9;
      return parseFloat(settingSelect.value); // 1079〜873
    }

    // 変動処理 (SPIN)
    function executeSpin(forceWin = false) {
      if (isSpinning) return;
      initAudio();

      // チャレンジ待機中はPUSHでジャッジ
      if (currentMode === STATE_JUDGE) {
        handleLtJudge();
        return;
      }

      // 通常時は15玉消費、RUSH/LT中は完全無料
      if (currentMode === STATE_NORMAL) {
        if (balls < 15) {
          alert('玉が足りません。「+1500玉補充」を押してください。');
          stopAuto();
          return;
        }
        balls -= 15;
      } else {
        // RUSH中減算
        rushRemaining--;
      }

      totalSpins++;
      isSpinning = true;
      updateUI();

      // 抽選実行
      const denom = getDenominator();
      const isWin = forceWin || (Math.random() < (1 / denom));

      // リール回転開始
      playBeep(260, 'square', 0.08, 0.2);
      reel1.classList.add('spinning');
      reel2.classList.add('spinning');
      reel3.classList.add('spinning');

      const isReach = isWin || (Math.random() < 0.15); // 当選または15%でリーチ発展
      const targetDigit = isWin ? 7 : Math.floor(Math.random() * 9) + 1;

      // 図柄停止シーケンス
      setTimeout(() => {
        // 左停止
        reel1.classList.remove('spinning');
        reel1.innerText = targetDigit;
        playBeep(320, 'sine', 0.05, 0.2);

        setTimeout(() => {
          // 右停止
          reel3.classList.remove('spinning');
          if (isReach) {
            reel3.innerText = targetDigit;
            reachOverlay.style.display = 'block';
            playHeartbeat();
          } else {
            let d3 = Math.floor(Math.random() * 9) + 1;
            if (d3 === targetDigit) d3 = (d3 % 9) + 1;
            reel3.innerText = d3;
            playBeep(320, 'sine', 0.05, 0.2);
          }

          // 中停止（当落告知）
          setTimeout(() => {
            reel2.classList.remove('spinning');
            reachOverlay.style.display = 'none';

            if (isWin) {
              reel2.innerText = targetDigit;
              playFanfare();
              handleHit();
            } else {
              let d2 = Math.floor(Math.random() * 9) + 1;
              if (d2 === targetDigit) d2 = (d2 % 9) + 1;
              reel2.innerText = d2;
              playBeep(220, 'sine', 0.06, 0.2);
              isSpinning = false;

              // RUSH駆け抜け判定
              if ((currentMode === STATE_RUSH_NORMAL || currentMode === STATE_RUSH_LT) && rushRemaining <= 0) {
                currentMode = STATE_NORMAL;
                alert('RUSH終了 通常時へ転落しました。');
              }
              updateUI();
            }
          }, isReach ? 800 : 250);
        }, 200);
      }, 300);
    }

    // 大当り当選時の処理
    function handleHit() {
      // 1500発払出
      balls += 1500;
      bonusPayoutTotal += 1500;
      updateUI();

      if (currentMode === STATE_NORMAL) {
        // 通常からの初当りはLTチャレンジへ突入
        stopAuto();
        currentMode = STATE_JUDGE;
        judgeOverlay.style.display = 'block';
        updateUI();
        isSpinning = false;
      } else {
        // RUSH中の連チャンはそのままST回数再セット
        if (currentMode === STATE_RUSH_LT) {
          rushRemaining = 140;
        } else {
          rushRemaining = 50;
        }
        setTimeout(() => {
          isSpinning = false;
          updateUI();
        }, 700);
      }
    }

    // LT突入チャレンジ判定（50%で極LT、失敗で通常RUSH）
    function handleLtJudge() {
      judgeOverlay.style.display = 'none';
      playHeartbeat();

      const isLtSuccess = Math.random() < 0.5;

      if (isLtSuccess) {
        currentMode = STATE_RUSH_LT;
        rushRemaining = 140;
        playFanfare();
        alert('極・覚醒 東京喰種 LT 突入!! (ST140回・高確率1/29.9)');
      } else {
        currentMode = STATE_RUSH_NORMAL;
        rushRemaining = 50;
        playBeep(440, 'triangle', 0.3, 0.3);
        alert('東京喰種 RUSH 突入 (ST50回・高確率1/39.9)');
      }
      updateUI();
    }

    // オートモード切り替え
    function toggleAuto() {
      if (isAuto) {
        stopAuto();
      } else {
        initAudio();
        isAuto = true;
        autoBtn.classList.add('active');
        autoBtn.innerText = 'AUTO ON';
        autoInterval = setInterval(() => {
          if (!isSpinning && currentMode !== STATE_JUDGE) {
            executeSpin();
          }
        }, 1100);
      }
    }
    function stopAuto() {
      isAuto = false;
      autoBtn.classList.remove('active');
      autoBtn.innerText = 'AUTO OFF';
      if (autoInterval) clearInterval(autoInterval);
    }

    // イベントリスナー紐付け
    spinBtn.addEventListener('click', () => executeSpin());
    pushBtn.addEventListener('click', () => executeSpin());
    autoBtn.addEventListener('click', toggleAuto);

    // テスト検証ボタン群
    document.getElementById('dbgHitBtn').addEventListener('click', () => executeSpin(true));
    document.getElementById('dbgLtBtn').addEventListener('click', () => {
      currentMode = STATE_RUSH_LT;
      rushRemaining = 140;
      updateUI();
      alert('極・覚醒 LTに直撃突入しました！');
    });
    document.getElementById('dbgSkipBtn').addEventListener('click', () => {
      totalSpins += 100;
      if (currentMode === STATE_NORMAL) {
        balls = Math.max(0, balls - 1500);
      }
      updateUI();
    });
    document.getElementById('dbgRefillBtn').addEventListener('click', () => {
      balls += 1500;
      updateUI();
    });

    updateUI();
  </script>
</body>
</html>
