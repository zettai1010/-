<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>777 CASINO SLOT</title>

<style>

body {
    margin: 0;
    background:
        radial-gradient(circle at center, #444 0%, #111 45%, #000 100%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: gold;
    font-size: 42px;
    margin: 25px 0;
    text-shadow:
        0 0 10px red,
        0 0 25px gold;
}

.casino {
    width: 430px;
    max-width: 90%;
    margin: 20px auto;
    padding: 25px;

    background:
        linear-gradient(
            180deg,
            #c40000,
            #750000 45%,
            #350000
        );

    border: 8px solid gold;
    border-radius: 25px;

    box-shadow:
        0 0 15px gold,
        0 0 40px red;

    box-sizing: border-box;
}

#coins {
    font-size: 28px;
    font-weight: bold;
    color: gold;
    margin-bottom: 10px;

    text-shadow:
        0 0 8px orange;
}

#adminStatus {
    font-size: 15px;
    color: #aaa;
    margin: 10px;
}

#timer {
    font-size: 14px;
    color: #ddd;
    margin-bottom: 10px;
}

.reels {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 25px 0;
}

.reel {
    width: 100px;
    height: 110px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #eeeeee,
            #cccccc
        );

    color: black;

    border: 6px solid #aaa;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 55px;

    box-shadow:
        inset 0 0 15px #555,
        0 0 5px white;
}

button {
    padding: 14px 25px;
    margin: 7px;

    font-size: 20px;
    font-weight: bold;

    border-radius: 12px;
    border: 3px solid gold;

    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

#start {
    background:
        linear-gradient(#ff3333, #aa0000);

    color: white;

    font-size: 30px;

    padding: 18px 55px;

    border: 4px solid gold;

    box-shadow:
        0 0 15px red,
        0 0 30px orange;
}

#adminLogin {
    background: #222;
    color: gold;
}

#settingArea {
    display: none;

    margin: 15px 0;
    padding: 15px;

    border: 2px solid gold;
    border-radius: 10px;

    background: rgba(0,0,0,0.45);
}

#settingNumber {
    color: gold;
    font-size: 25px;
    font-weight: bold;
}

#settingButton {
    background: #222;
    color: gold;
}

#logoutButton {
    background: #555;
    color: white;
}

#result {
    font-size: 22px;
    min-height: 40px;
    margin-top: 15px;
    font-weight: bold;
}


/* =========================
   JACKPOT
========================= */

#jackpotEffect {
    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(255, 215, 0, 0.3);

    z-index: 9999;

    pointer-events: none;
}

#jackpotEffect.show {
    display: flex;

    align-items: center;
    justify-content: center;

    animation:
        flash 0.12s infinite alternate;
}

.jackpotText {
    font-size: 70px;
    font-weight: bold;

    color: gold;

    text-shadow:
        0 0 10px red,
        0 0 30px red,
        0 0 60px gold,
        0 0 100px white;

    animation:
        jackpotBig 0.35s infinite alternate;
}

@keyframes flash {

    from {
        background: rgba(255, 0, 0, 0.15);
    }

    to {
        background: rgba(255, 215, 0, 0.55);
    }

}

@keyframes jackpotBig {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.3);
    }

}

.jackpotReel {

    animation:
        reelFlash 0.15s infinite alternate;

}

@keyframes reelFlash {

    from {

        box-shadow:
            0 0 10px gold,
            inset 0 0 15px #555;

    }

    to {

        box-shadow:
            0 0 50px red,
            0 0 90px gold,
            inset 0 0 15px #555;

    }

}


/* =========================
   小さい画面
========================= */

@media (max-width: 500px) {

    h1 {
        font-size: 32px;
    }

    .reel {
        width: 80px;
        height: 90px;
        font-size: 45px;
    }

    .jackpotText {
        font-size: 45px;
    }

}

</style>
</head>


<body>


<h1>🎰 777 CASINO 🎰</h1>


<div class="casino">


    <!-- コイン -->

    <div id="coins">
        💰 コイン：100
    </div>


    <!-- 管理者状態 -->

    <div id="adminStatus">
        🔒 管理者モード：OFF
    </div>


    <!-- 設定変更までの時間 -->

    <div id="timer">
        ⏱️ 設定変更まで計算中...
    </div>


    <!-- 管理者ログイン -->

    <button id="adminLogin">
        🔐 管理者ログイン
    </button>


    <!-- 管理者エリア -->

    <div id="settingArea">

        <div>
            ⚙️ 現在の設定：
            <span id="settingNumber">
                -
            </span>
        </div>

        <br>

        <button id="settingButton">
            ⚙️ 設定変更
        </button>

        <button id="logoutButton">
            🔓 ログアウト
        </button>

    </div>


    <!-- リール -->

    <div class="reels">

        <div class="reel" id="reel1">
            7
        </div>

        <div class="reel" id="reel2">
            7
        </div>

        <div class="reel" id="reel3">
            7
        </div>

    </div>


    <!-- START -->

    <button id="start">
        START
    </button>


    <!-- 結果 -->

    <div id="result">
        スタートを押してね！
    </div>


</div>


<!-- 777演出 -->

<div id="jackpotEffect">

    <div class="jackpotText">
        🎉 777 JACKPOT!! 🎉
    </div>

</div>


<script>


/* =========================
   図柄
========================= */

const symbols = [

    "🍒",
    "🍋",
    "🔔",
    "⭐",
    "🍊",
    "💎",
    "7"

];


/* =========================
   基本設定
========================= */

let coins = 100;

let isAdmin = false;


/* =========================
   管理者パスワード
========================= */

const ADMIN_PASSWORD = "777admin";


/* =========================
   設定ごとの777確率
========================= */

const settingRates = {

    1: 0.0005,
    2: 0.0008,
    3: 0.0012,
    4: 0.0030,
    5: 0.0070,
    6: 0.0120

};


/*
設定1  = 0.05%
設定2  = 0.08%
設定3  = 0.12%
設定4  = 0.30%
設定5  = 0.70%
設定6  = 1.20%
*/


/* =========================
   3つ揃いの確率
========================= */

const tripleRates = {

    1: 0.005,
    2: 0.008,
    3: 0.012,
    4: 0.030,
    5: 0.070,
    6: 0.120

};


/*
設定1〜3はかなり低め

設定4から上がる

設定5はかなり当たりやすい

設定6は一番当たりやすい
*/


/* =========================
   設定のランダム抽選
========================= */

function randomSetting() {

    const r = Math.random() * 100;


    /*
    設定1 = 50%
    設定2 = 24%
    設定3 = 15%
    設定4 = 7%
    設定5 = 3%
    設定6 = 1%
    */


    if (r < 50) {

        return 1;

    }

    else if (r < 74) {

        return 2;

    }

    else if (r < 89) {

        return 3;

    }

    else if (r < 96) {

        return 4;

    }

    else if (r < 99) {

        return 5;

    }

    else {

        return 6;

    }

}


/* =========================
   最初の設定
========================= */

let setting = randomSetting();


/* =========================
   HTML取得
========================= */

const coinsElement =
    document.getElementById("coins");

const settingArea =
    document.getElementById("settingArea");

const settingNumber =
    document.getElementById("settingNumber");

const result =
    document.getElementById("result");

const reel1 =
    document.getElementById("reel1");

const reel2 =
    document.getElementById("reel2");

const reel3 =
    document.getElementById("reel3");

const startButton =
    document.getElementById("start");

const adminLogin =
    document.getElementById("adminLogin");

const settingButton =
    document.getElementById("settingButton");

const logoutButton =
    document.getElementById("logoutButton");

const adminStatus =
    document.getElementById("adminStatus");

const jackpotEffect =
    document.getElementById("jackpotEffect");

const timer =
    document.getElementById("timer");


/* =========================
   ランダム図柄
========================= */

function randomSymbol() {

    return symbols[
        Math.floor(
            Math.random() * symbols.length
        )
    ];

}


/* =========================
   管理者ログイン
========================= */

adminLogin.addEventListener(
    "click",
    function() {

        const password =
            prompt(
                "🔐 管理者パスワードを入力してください"
            );


        if (password === ADMIN_PASSWORD) {

            isAdmin = true;


            settingArea.style.display =
                "block";


            settingNumber.textContent =
                setting;


            adminStatus.textContent =
                "🔓 管理者モード：ON";


            adminStatus.style.color =
                "lime";


            adminLogin.style.display =
                "none";


            result.textContent =
                "✅ 管理者ログイン成功！";

        }

        else {

            result.textContent =
                "❌ パスワードが違います！";

        }

    }
);


/* =========================
   ログアウト
========================= */

logoutButton.addEventListener(
    "click",
    function() {

        isAdmin = false;


        settingArea.style.display =
            "none";


        adminLogin.style.display =
            "inline-block";


        adminStatus.textContent =
            "🔒 管理者モード：OFF";


        adminStatus.style.color =
            "#aaa";


        result.textContent =
            "🔒 管理者モードを終了しました";

    }
);


/* =========================
   管理者による設定変更
========================= */

settingButton.addEventListener(
    "click",
    function() {

        if (!isAdmin) {

            return;

        }


        setting++;


        if (setting > 6) {

            setting = 1;

        }


        settingNumber.textContent =
            setting;


        result.textContent =
            "⚙️ 設定" +
            setting +
            "に変更しました！";

    }
);


/* =========================
   スロット
========================= */

function play() {


    /* コインチェック */

    if (coins < 3) {

        result.textContent =
            "💸 コインが足りません！";

        return;

    }


    /* 1回3コイン */

    coins -= 3;


    let a;
    let b;
    let c;


    /* =====================
       777抽選
    ===================== */

    const jackpot =
        Math.random()
        <
        settingRates[setting];


    if (jackpot) {

        a = "7";
        b = "7";
        c = "7";

    }


    /* =====================
       3つ揃い抽選
    ===================== */

    else if (
        Math.random()
        <
        tripleRates[setting]
    ) {

        const symbol =
            symbols[
                Math.floor(
                    Math.random()
                    *
                    (symbols.length - 1)
                )
            ];

        a = symbol;
        b = symbol;
        c = symbol;

    }


    /* =====================
       普通の抽選
    ===================== */

    else {

        a = randomSymbol();
        b = randomSymbol();
        c = randomSymbol();

    }


    /* リール表示 */

    reel1.textContent = a;
    reel2.textContent = b;
    reel3.textContent = c;


    /* =====================
       777
    ===================== */

    if (
        a === "7" &&
        b === "7" &&
        c === "7"
    ) {


        coins += 100;


        result.textContent =
            "🎉🎉 JACKPOT!! +100 🎉🎉";


        reel1.classList.add(
            "jackpotReel"
        );

        reel2.classList.add(
            "jackpotReel"
        );

        reel3.classList.add(
            "jackpotReel"
        );


        jackpotEffect.classList.add(
            "show"
        );


        setTimeout(
            function() {

                jackpotEffect.classList.remove(
                    "show"
                );


                reel1.classList.remove(
                    "jackpotReel"
                );

                reel2.classList.remove(
                    "jackpotReel"
                );

                reel3.classList.remove(
                    "jackpotReel"
                );

            },
            2500
        );

    }


    /* =====================
       3つ揃い
    ===================== */

    else if (
        a === b &&
        b === c
    ) {

        coins += 20;


        result.textContent =
            "🔥 3つ揃った！ +20";

    }


    /* =====================
       2つ揃い
       → 配当なし
    ===================== */

    else if (
        a === b ||
        b === c ||
        a === c
    ) {

        result.textContent =
            "💦 2つ揃い！ 配当なし";

    }


    /* =====================
       ハズレ
    ===================== */

    else {

        result.textContent =
            "💦 ハズレ！";

    }


    /* コイン更新 */

    coinsElement.textContent =
        "💰 コイン：" + coins;

}


/* =========================
   START
========================= */

startButton.addEventListener(
    "click",
    play
);


/* =========================
   1時間ごとの設定変更
========================= */

setInterval(
    function() {


        setting =
            randomSetting();


        if (isAdmin) {

            settingNumber.textContent =
                setting;

        }


        result.textContent =
            "🎲 1時間経過！設定が変更されました";


    },
    60 * 60 * 1000
);


/* =========================
   タイマー表示
========================= */

let secondsLeft =
    60 * 60;


setInterval(
    function() {

        secondsLeft--;


        if (secondsLeft <= 0) {

            secondsLeft =
                60 * 60;

        }


        const minutes =
            Math.floor(
                secondsLeft / 60
            );


        const seconds =
            secondsLeft % 60;


        timer.textContent =
            "⏱️ 次の設定変更まで " +
            minutes +
            "分 " +
            seconds +
            "秒";

    },
    1000
);


/* =========================
   初期タイマー
========================= */

timer.textContent =
    "⏱️ 次の設定変更まで 60分 0秒";


</script>

</body>
</html>
