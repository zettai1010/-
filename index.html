<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG CASINO</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #0f111a;
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 30px 16px;
  }
  .box {
    width: 100%;
    max-width: 400px;
    background: #171a26;
    border: 1px solid #2a2e42;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
  .hidden { display: none; }
  input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #2a2e42;
    background: #0b0d14;
    color: #fff;
    font-size: 1rem;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border: none;
    border-radius: 6px;
    background: #f5b942;
    color: #111;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-weight: bold;
  }
  .screen {
    background: #0b0d14;
    padding: 24px;
    border-radius: 8px;
    font-size: 2.6rem;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { background: #222638; color: #fff; margin: 0; padding: 8px; font-size: 0.9rem; }
  .tabs button.active { background: #f5b942; color: #111; }
  .green { background: #10b981 !important; }
</style>
</head>
<body>

<!-- ログイン（未登録なら自動作成） -->
<div class="box" id="login-view">
  <h2 style="margin-top:0; color:#f5b942;">RPG CASINO</h2>
  <input id="mcid" placeholder="MCID (統合版は BE_)">
  <input id="pass" type="password" placeholder="パスワード">
  <button onclick="login()">ログイン / 新規登録</button>
  <p id="err" style="color:#ef4444; font-size:0.85rem;"></p>
</div>

<!-- ゲーム画面 -->
<div class="box hidden" id="game-view">
  <div class="top">
    <span id="u-name"></span>
    <span style="color:#10b981;"><span id="bal">0</span> G</span>
    <button style="width:auto; padding:4px 8px; margin:0; font-size:0.8rem; background:#222638; color:#fff;" onclick="logout()">出る</button>
  </div>

  <div class="tabs">
    <button class="active" onclick="tab('crash', this)">CRASH</button>
    <button onclick="tab('slot', this)">SLOT</button>
  </div>

  <!-- CRASH -->
  <div id="crash">
    <div class="screen" id="mult">1.00x</div>
    <input id="c-bet" type="number" value="500" placeholder="ベット額">
    <button id="c-btn" onclick="crash()">START</button>
    <p id="c-msg" style="font-size:0.9rem;"></p>
  </div>

  <!-- SLOT -->
  <div id="slot" class="hidden">
    <div class="screen" id="reels">7️⃣ 7️⃣ 7️⃣</div>
    <input id="s-bet" type="number" value="500" placeholder="ベット額">
    <button onclick="slot()">SPIN</button>
    <p id="s-msg" style="font-size:0.9rem;"></p>
  </div>
</div>

<script>
  let db = JSON.parse(localStorage.getItem("casino_db") || "{}");
  let me = localStorage.getItem("casino_me");

  function save() { localStorage.setItem("casino_db", JSON.stringify(db)); }
  function sync() { document.getElementById("bal").innerText = Math.floor(db[me].bal).toLocaleString(); }

  function login() {
    const id = document.getElementById("mcid").value.trim();
    const pw = document.getElementById("pass").value.trim();
    if (!id || !pw) return;
    if (!db[id]) db[id] = { pw, bal: 10000 };
    else if (db[id].pw !== pw) { document.getElementById("err").innerText = "パスワード違い"; return; }
    me = id;
    localStorage.setItem("casino_me", me);
    save();
    start();
  }

  function start() {
    document.getElementById("login-view").classList.add("hidden");
    document.getElementById("game-view").classList.remove("hidden");
    document.getElementById("u-name").innerText = me;
    sync();
  }

  function logout() { localStorage.removeItem("casino_me"); location.reload(); }

  function tab(name, btn) {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("crash").classList.toggle("hidden", name !== "crash");
    document.getElementById("slot").classList.toggle("hidden", name !== "slot");
  }

  // CRASH (五分五分 RTP 99.5%)
  let run = false, m = 1, target = 1, bet = 0, iv;
  function crash() {
    const btn = document.getElementById("c-btn"), el = document.getElementById("mult"), msg = document.getElementById("c-msg");
    if (!run) {
      bet = Number(document.getElementById("c-bet").value);
      if (bet <= 0 || bet > db[me].bal) { msg.innerText = "残高不足"; return; }
      db[me].bal -= bet; save(); sync();
      const r = Math.random();
      target = r < 0.005 ? 1 : Math.max(1.01, 0.995 / (1 - r));
      if (target <= 1) { el.innerText = "1.00x"; msg.innerText = "💥 即爆発"; return; }
      run = true; m = 1; msg.innerText = "";
      btn.innerText = "CASH OUT"; btn.classList.add("green");
      iv = setInterval(() => {
        m += 0.01 * m * 0.55;
        if (m >= target) {
          clearInterval(iv); run = false;
          el.innerText = target.toFixed(2) + "x"; msg.innerText = "💥 爆発";
          btn.innerText = "START"; btn.classList.remove("green");
        } else el.innerText = m.toFixed(2) + "x";
      }, 50);
    } else {
      clearInterval(iv); run = false;
      const win = Math.floor(bet * m);
      db[me].bal += win; save(); sync();
      msg.innerText = `🎉 +${win.toLocaleString()} G`;
      btn.innerText = "START"; btn.classList.remove("green");
    }
  }

  // SLOT (五分五分 RTP 99.5%)
  const syms = ["🍒","🍋","🍇","🔔","💎","7️⃣"], pays = {"🍒":2.5,"🍋":4,"🍇":8,"🔔":15,"💎":40,"7️⃣":100};
  function slot() {
    const b = Number(document.getElementById("s-bet").value), msg = document.getElementById("s-msg");
    if (b <= 0 || b > db[me].bal) { msg.innerText = "残高不足"; return; }
    db[me].bal -= b;
    const r = Math.random() * 100;
    let res = r < 18 ? ["🍒","🍒","🍒"] : r < 25 ? ["🍋","🍋","🍋"] : r < 27 ? ["🍇","🍇","🍇"] : r < 27.4 ? ["🔔","🔔","🔔"] : r < 27.475 ? ["💎","💎","💎"] : r < 27.49 ? ["7️⃣","7️⃣","7️⃣"] : ["🍒","🍋","7️⃣"];
    document.getElementById("reels").innerText = res.join(" ");
    if (res[0] === res[1] && res[1] === res[2]) {
      const win = Math.floor(b * pays[res[0]]);
      db[me].bal += win;
      msg.innerText = `🎉 +${win.toLocaleString()} G`;
    } else msg.innerText = "ハズレ";
    save(); sync();
  }

  if (me && db[me]) start();
</script>
</body>
</html>
